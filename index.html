<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CostPilot v2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" integrity="sha384-tMH8h3BGESGckSAVGZ82T9n90ztNXxvdwvdM6UoR56cYcf+0iGXBliJ29D+wZ/x8" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" integrity="sha384-bm7MnzvK++ykSwVJ2tynSE5TRdN+xL418osEVF2DE/L/gfWHj91J2Sphe582B1Bh" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js" integrity="sha384-aGlMNK3U/x0wl4lEH5jD1PGhJlX9hApuPmIiA5gtiYCOQ1J8ejIdC0btaU/TMoBD" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js" integrity="sha384-OUW9euuUyxyHcAhTqbhI+Iyb8LMssXt/cpz0yXhs9UWG2/R/uaWdakx/4cfww7Vb" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" integrity="sha384-JcnsjUPPylna1s1fvi1u12X5qjY5OL56iySh75FdtrwhO/SWXgMjoVqcKyIIWOLk" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" integrity="sha384-ZZ1pncU3bQe8y31yfZdMFdSpttDoPmOZg2wguVK9almUodir1PghgT0eY7Mrty8H" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://unpkg.com/mammoth@1.6.0/mammoth.browser.min.js" integrity="sha384-nFoSjZIoH3CCp8W639jJyQkuPHinJ2NHe7on1xvlUA7SuGfJAfvMldrsoAVm6ECz" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script type="module">
    // Suppress Babel warning
    const _warn = console.warn.bind(console);
    console.warn = (...args) => { if (args[0] && String(args[0]).includes("Babel")) return; _warn(...args); };

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCvEd4suOYsXYDKFZbfLj2NYaEojXfI2m0",
      authDomain: "costpilot-d0a8b.firebaseapp.com",
      projectId: "costpilot-d0a8b",
      storageBucket: "costpilot-d0a8b.firebasestorage.app",
      messagingSenderId: "153199935379",
      appId: "1:153199935379:web:0f29d1a81a0b16143cb266"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    // Expose to window so Babel script can use them
    window._firebase = { auth, db, signInWithEmailAndPassword, signOut, onAuthStateChanged, doc, getDoc, setDoc, onSnapshot, serverTimestamp };
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;

    // ── Firebase helpers ─────────────────────────────────────────────────────
    const getFirebase = () => window._firebase;

    // נתונים משותפים - נשמרים ב-shared/appdata
    const saveShared = async (key, data) => {
      try {
        const { db, doc, setDoc } = getFirebase();
        await setDoc(doc(db, "shared", key), { value: JSON.stringify(data) }, { merge: false });
      } catch(e) { console.error("save error", e); }
    };

    const loadShared = async (key) => {
      try {
        const { db, doc, getDoc } = getFirebase();
        const snap = await getDoc(doc(db, "shared", key));
        if (snap.exists()) return JSON.parse(snap.data().value);
      } catch(e) { console.error("load error", e); }
      return null;
    };

    // הרשאות משתמש
    const loadUserRole = async (uid) => {
      try {
        const { db, doc, getDoc } = getFirebase();
        const snap = await getDoc(doc(db, "userRoles", uid));
        if (snap.exists()) return snap.data();
      } catch(e) { console.error("role error", e); }
      return null;
    };

    const saveUserRole = async (uid, data) => {
      try {
        const { db, doc, setDoc } = getFirebase();
        await setDoc(doc(db, "userRoles", uid), data);
      } catch(e) { console.error("save role error", e); }
    };

    // כל הנתונים משותפים לכולם
    const SHARED_KEYS = ["projects", "allData", "suppliers", "companies", "milestones", "statsRows", "workScopes", "managers"];
    const saveToFirestore = (uid, key, data) => {
      const storageKey = SHARED_KEYS.includes(key) ? key : `${uid}_${key}`;
      return saveShared(storageKey, data);
    };
    const loadFromFirestore = async (uid, key) => {
      const storageKey = SHARED_KEYS.includes(key) ? key : `${uid}_${key}`;
      const data = await loadShared(storageKey);
      if (data !== null) return data;
      if (SHARED_KEYS.includes(key) && key !== "projects" && key !== "allData") {
        return loadShared(`${uid}_${key}`);
      }
      return null;
    };
    // מנוי real-time לעדכונים מ-Firestore
    const subscribeShared = (key, callback) => {
      const { db, doc, onSnapshot } = getFirebase();
      return onSnapshot(doc(db, "shared", key), snap => {
        try { callback(snap.exists() ? JSON.parse(snap.data().value) : null); } catch(e) {}
      }, err => console.error("subscribe error", key, err));
    };

    // ── Per-project Firestore helpers ─────────────────────────────────────────
    const saveProjectData = (projId, data) => {
      const { db, doc, setDoc } = getFirebase();
      return setDoc(doc(db, "shared", `proj_${projId}`), { value: JSON.stringify(data) }, { merge: false });
    };
    const loadProjectData = async (projId) => {
      const { db, doc, getDoc } = getFirebase();
      const snap = await getDoc(doc(db, "shared", `proj_${projId}`));
      return snap.exists() ? JSON.parse(snap.data().value) : null;
    };
    const subscribeProjectData = (projId, callback) => {
      const { db, doc, onSnapshot } = getFirebase();
      return onSnapshot(doc(db, "shared", `proj_${projId}`), snap => {
        try { callback(snap.exists() ? JSON.parse(snap.data().value) : null); } catch(e) {}
      }, err => console.error("proj sub error", projId, err));
    };


    // ── Login Screen ─────────────────────────────────────────────────────────
    function LoginScreen({ onLogin }) {
      const [email, setEmail]       = useState("");
      const [password, setPassword] = useState("");
      const [error, setError]       = useState("");
      const [loading, setLoading]   = useState(false);
      const [resetSent, setResetSent] = useState(false);
      const [showReset, setShowReset] = useState(false);
      const [resetEmail, setResetEmail] = useState("");

      const handleLogin = async () => {
        if (!email || !password) { setError("יש למלא מייל וסיסמה"); return; }
        setLoading(true); setError("");
        try {
          const { auth, signInWithEmailAndPassword } = getFirebase();
          const cred = await signInWithEmailAndPassword(auth, email, password);
          onLogin(cred.user);
        } catch(e) {
          setError("מייל או סיסמה שגויים");
        }
        setLoading(false);
      };

      const handleReset = async () => {
        if (!resetEmail) { setError("יש להזין מייל"); return; }
        setLoading(true); setError("");
        try {
          const { auth } = getFirebase();
          const { sendPasswordResetEmail } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js");
          await sendPasswordResetEmail(auth, resetEmail);
          setResetSent(true);
        } catch(e) {
          setError("מייל לא נמצא במערכת");
        }
        setLoading(false);
      };

      return (
        <div style={{ minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", background:"#F5F6F8", fontFamily:"'Heebo',sans-serif" }}>
          <style>{"@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800;900&display=swap');"}</style>
          <div style={{ background:"#fff", borderRadius:4, padding:"40px 44px", width:520, boxShadow:"0 4px 12px rgba(0,0,0,0.10)", border:"1px solid #E2E5EA" }}>
            <div style={{ display:"flex", justifyContent:"center", marginBottom:28 }}>
              <div style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:8 }}>
                <div style={{ display:"inline-flex", alignItems:"flex-end", gap:4, direction:"ltr" }}>
                  <div style={{ display:"flex", alignItems:"flex-end", gap:4, height:54 }}>
                    <span style={{ display:"block", width:11, height:22, borderRadius:1.5, background:"#0B1F3A", opacity:0.35 }} />
                    <span style={{ display:"block", width:11, height:38, borderRadius:1.5, background:"#0B1F3A", opacity:0.65 }} />
                    <span style={{ display:"block", width:11, height:54, borderRadius:1.5, background:"#0B1F3A" }} />
                  </div>
                  <div style={{ fontFamily:"'Heebo',sans-serif", fontSize:34, fontWeight:700, color:"#0B1F3A", whiteSpace:"nowrap", marginBottom:-3, lineHeight:1, letterSpacing:"-0.5px" }}>
                    Cost<span style={{ fontWeight:400 }}>Pilot</span>
                  </div>
                </div>
                <div style={{ fontSize:13, color:"#767676", fontFamily:"'Heebo',sans-serif", fontWeight:600 }}>ניהול תקציבי פרויקט</div>
              </div>
            </div>

            {!showReset ? (
              <form method="post" onSubmit={e=>{e.preventDefault();handleLogin();}} style={{ display:"flex", flexDirection:"column", gap:14 }}>
                <div>
                  <label htmlFor="username" style={{ fontSize:12, fontWeight:600, color:"#767676", display:"block", marginBottom:5 }}>כתובת מייל</label>
                  <input id="username" name="username" type="email" autoComplete="username" required
                    value={email} onChange={e=>setEmail(e.target.value)}
                    placeholder="name@company.com" dir="ltr"
                    style={{ width:"100%", padding:"10px 13px", border:"1px solid #E2E5EA", borderRadius:4, fontSize:13, fontFamily:"'Heebo',sans-serif", outline:"none", boxSizing:"border-box" }}
                    onFocus={e=>e.target.style.borderColor="#0B1F3A"} onBlur={e=>e.target.style.borderColor="#E2E5EA"} />
                </div>
                <div>
                  <label htmlFor="password" style={{ fontSize:12, fontWeight:600, color:"#767676", display:"block", marginBottom:5 }}>סיסמה</label>
                  <input id="password" name="password" type="password" autoComplete="current-password" required
                    value={password} onChange={e=>setPassword(e.target.value)}
                    placeholder="••••••••" dir="ltr"
                    style={{ width:"100%", padding:"10px 13px", border:"1px solid #E2E5EA", borderRadius:4, fontSize:13, fontFamily:"'Heebo',sans-serif", outline:"none", boxSizing:"border-box" }}
                    onFocus={e=>e.target.style.borderColor="#0B1F3A"} onBlur={e=>e.target.style.borderColor="#E2E5EA"} />
                </div>
                {error && <div style={{ color:"#5C2020", fontSize:13, textAlign:"center" }}>{error}</div>}
                <button type="submit" disabled={loading}
                  style={{ background:"#0B1F3A", color:"#fff", border:"none", borderRadius:4, padding:"11px", fontSize:14, fontWeight:600, cursor:"pointer", fontFamily:"'Heebo',sans-serif", marginTop:4, opacity:loading?0.7:1 }}>
                  {loading ? "מתחבר..." : "כניסה"}
                </button>
                <div style={{ textAlign:"center" }}>
                  <button type="button" onClick={() => { setShowReset(true); setResetEmail(email); setError(""); }}
                    style={{ background:"none", border:"none", color:"#163356", fontSize:12, cursor:"pointer", fontFamily:"'Heebo',sans-serif" }}>
                    שכחתי סיסמה
                  </button>
                </div>
              </form>
            ) : (
              <div style={{ display:"flex", flexDirection:"column", gap:14 }}>
                {resetSent ? (
                  <div style={{ textAlign:"center", color:"#0E7C6A", fontSize:14, fontWeight:600, lineHeight:1.7 }}>
                    ✅ נשלח מייל לאיפוס סיסמה!<br/>
                    <span style={{ fontSize:12, color:"#767676", fontWeight:400 }}>יש לבדוק את תיבת המייל שלך</span><br/>
                    <span style={{ fontSize:12, color:"#767676", fontWeight:400 }}>(ייתכן ויופיע בתיקיית דואר זבל)</span>
                  </div>
                ) : (
                  <>
                    <div style={{ fontSize:14, color:"#3A3A3A", textAlign:"center" }}>הזיני את המייל שלך ונשלח לך קישור לאיפוס סיסמה</div>
                    <input type="email" value={resetEmail} onChange={e=>setResetEmail(e.target.value)}
                      placeholder="name@company.com" dir="ltr"
                      style={{ width:"100%", padding:"10px 13px", border:"1px solid #E2E5EA", borderRadius:4, fontSize:14, fontFamily:"'Heebo',sans-serif", outline:"none", boxSizing:"border-box" }}
                      onFocus={e=>e.target.style.borderColor="#0B1F3A"} onBlur={e=>e.target.style.borderColor="#E2E5EA"} />
                    {error && <div style={{ color:"#5C2020", fontSize:13, textAlign:"center" }}>{error}</div>}
                    <button onClick={handleReset} disabled={loading}
                      style={{ background:"#0B1F3A", color:"#fff", border:"none", borderRadius:4, padding:"11px", fontSize:14, fontWeight:600, cursor:"pointer", fontFamily:"'Heebo',sans-serif", opacity:loading?0.7:1 }}>
                      {loading ? "שולח..." : "שלח קישור לאיפוס"}
                    </button>
                  </>
                )}
                <div style={{ textAlign:"center" }}>
                  <button onClick={() => { setShowReset(false); setResetSent(false); setError(""); }}
                    style={{ background:"none", border:"none", color:"#767676", fontSize:12, cursor:"pointer", fontFamily:"'Heebo',sans-serif" }}>
                    ← חזרה להתחברות
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ── App Wrapper ───────────────────────────────────────────────────────────
    
    // ── Add-project picker: שדה חיפוש שמציג רק פרויקטים שטרם אושרו ─────────────
    function AddProjectPicker({ projects, assigned, onAdd }) {
      const [query, setQuery] = useState("");
      const [open, setOpen]   = useState(false);
      const available = projects.filter(p => !assigned.includes(String(p.id)));
      const filtered = query
        ? available.filter(p => (p.name || "").includes(query.trim()))
        : available;
      return (
        <div style={{ position:"relative", width:260 }}>
          <input
            value={query}
            onChange={e => { setQuery(e.target.value); setOpen(true); }}
            onFocus={() => setOpen(true)}
            onBlur={() => setTimeout(() => setOpen(false), 150)}
            placeholder="+ הוסף פרויקט (חיפוש)..."
            style={{ width:"100%", padding:"6px 12px", border:"1.5px solid #E2E5EA", borderRadius:4, fontSize:13, fontFamily:"'Heebo',sans-serif", background:"#F7F8FA", outline:"none", boxSizing:"border-box" }} />
          {open && (
            <div style={{ position:"absolute", top:"100%", right:0, left:0, zIndex:20, background:"#fff", border:"1px solid #E2E5EA", borderRadius:4, marginTop:2, maxHeight:220, overflowY:"auto", boxShadow:"0 4px 12px rgba(0,0,0,0.08)" }}>
              {filtered.length === 0 && (
                <div style={{ padding:"8px 12px", fontSize:12, color:"#9A9A9A" }}>
                  {available.length === 0 ? "כל הפרויקטים כבר מאושרים" : "לא נמצא פרויקט מתאים"}
                </div>
              )}
              {filtered.map(p => (
                <div key={p.id}
                  onMouseDown={() => { onAdd(p.id); setQuery(""); setOpen(false); }}
                  style={{ padding:"7px 12px", fontSize:13, color:"#0D0D0D", cursor:"pointer", borderBottom:"1px solid #F0F2F5" }}
                  onMouseEnter={e => e.currentTarget.style.background = "#EAF1FA"}
                  onMouseLeave={e => e.currentTarget.style.background = "#fff"}>
                  {p.name}
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ── User Management Page (admin only) ───────────────────────────────────
    function UserManagementPage({ currentUser, projects, allData = {} }) {
      const [users, setUsers]   = useState([]);
      const [loading, setLoading] = useState(true);
      const [saving, setSaving]   = useState(null);

      // Load all users from Firestore
      useEffect(() => {
        const loadUsers = async () => {
          try {
            const { db } = getFirebase();
            const { collection, getDocs } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
            const snap = await getDocs(collection(db, "userRoles"));
            const list = [];
            snap.forEach(d => list.push({ uid: d.id, ...d.data() }));
            setUsers(list);
          } catch(e) { console.error(e); }
          setLoading(false);
        };
        loadUsers();
      }, []);

      const updateUser = async (uid, patch) => {
        setSaving(uid);
        const updated = users.map(u => u.uid === uid ? { ...u, ...patch } : u);
        setUsers(updated);
        const u = updated.find(x => x.uid === uid);
        await saveUserRole(uid, { role: u.role ?? "user", projects: u.projects || [], excludedProjects: u.excludedProjects || [], email: u.email || "" });
        setSaving(null);
      };

      const toggleProject = (uid, projId) => {
        const u = users.find(x => x.uid === uid);
        if (!u) return;
        const pid = String(projId);
        const current = u.projects || [];
        const updated = current.includes(pid) ? current.filter(p => p !== pid) : [...current, pid];
        updateUser(uid, { projects: updated });
      };

      // הסתרה/שחזור ידני של פרויקט שהוקצה אוטומטית (דרך תפקיד מנהל). מבטל רק את ההקצאה האוטומטית.
      const setExcluded = (uid, projId, hide) => {
        const u = users.find(x => x.uid === uid);
        if (!u) return;
        const pid = String(projId);
        const cur = (u.excludedProjects || []).map(String);
        const updated = hide ? [...new Set([...cur, pid])] : cur.filter(p => p !== pid);
        updateUser(uid, { excludedProjects: updated });
      };

      if (loading) return <div style={{ padding:40, textAlign:"right", fontFamily:"'Heebo',sans-serif" }}>טוען משתמשים...</div>;

      return (
        <div style={{ display:"flex", flexDirection:"column", flex:1, overflow:"hidden", fontFamily:"'Heebo',sans-serif", direction:"rtl" }}>
          <div style={{ flexShrink:0, padding:"30px 36px 0" }}>
            <div style={{ fontSize:24, fontWeight:900, color:"#0D0D0D", marginBottom:6 }}>👥 ניהול משתמשים</div>
            <div style={{ fontSize:13, color:"#767676", marginBottom:12 }}>הגדר הרשאות לכל משתמש</div>
          </div>
          <div style={{ flex:1, overflowY:"auto", minHeight:0, padding:"12px 36px 30px" }}>
          <div style={{ background:"#FAF2E6", border:"1px solid #F0D4B0", borderRadius:4, padding:"10px 16px", fontSize:13, color:"#5C3D10", marginBottom:20 }}>
            ℹ️ להוספת משתמש חדש יש להירשם דרך <strong>Firebase Console</strong> — Authentication → Add user. לאחר הכניסה הראשונה המשתמש יופיע כאן לעריכת הרשאות.
          </div>

          {users.length === 0 && (
            <div style={{ color:"#9A9A9A", fontSize:14 }}>
              אין משתמשים רשומים עדיין. משתמשים יופיעו כאן לאחר הכניסה הראשונה שלהם.
            </div>
          )}

          <div style={{ display:"flex", flexDirection:"column", gap:16 }}>
            {users.map(u => {
              // פרויקטים שמוקצים אוטומטית כי המשתמש רשום כמנהל תכנון/ביצוע בפתיחת הפרויקט (לפי מייל).
              const _uEmail = (u.email || "").trim().toLowerCase();
              const _uManual = (u.projects || []).map(String);
              const _uExcluded = (u.excludedProjects || []).map(String);
              const _autoEligible = _uEmail ? projects.filter(p => {
                const d = allData[p.id] || {};
                const _isMgr = (d.planningManagerEmail || "").trim().toLowerCase() === _uEmail
                            || (d.executionManagerEmail || "").trim().toLowerCase() === _uEmail;
                return _isMgr && !_uManual.includes(String(p.id));
              }) : [];
              const _autoProjs  = _autoEligible.filter(p => !_uExcluded.includes(String(p.id)));  // אוטומטי גלוי
              const _autoHidden = _autoEligible.filter(p =>  _uExcluded.includes(String(p.id)));  // הוסתר ידנית
              return (
              <div key={u.uid} style={{ background:"#fff", border:"1px solid #E2E5EA", borderRadius:8, padding:"18px 20px" }}>
                <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:14 }}>
                  <div>
                    <div style={{ fontWeight:700, color:"#0D0D0D", fontSize:15 }}>{u.email || u.uid}</div>
                    {u.uid === currentUser.uid && <span style={{ fontSize:11, color:"#163356", fontWeight:600 }}>את/ה</span>}
                  </div>
                  <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                    <span style={{ fontSize:12, color:"#767676" }}>תפקיד:</span>
                    <select value={u.role || "user"} onChange={e => updateUser(u.uid, { role: e.target.value })}
                      disabled={u.uid === currentUser.uid}
                      style={{ padding:"5px 10px", border:"1.5px solid #E2E5EA", borderRadius:4, fontSize:13, fontFamily:"'Heebo',sans-serif", background:"#F7F8FA", outline:"none", cursor:"pointer" }}>
                      <option value="admin">מנהל</option>
                      <option value="user">משתמש</option>
                    </select>
                    {saving === u.uid && <span style={{ fontSize:11, color:"#163356" }}>שומר...</span>}
                  </div>
                </div>

                {(u.role || "user") === "user" && (
                  <div>
                    <div style={{ fontSize:12, color:"#767676", fontWeight:600, marginBottom:8 }}>פרויקטים מורשים:</div>

const _bkpDB = (() => {
  let _db = null;
  const open = () => new Promise((res, rej) => {
    if (_db) return res(_db);
    const req = indexedDB.open("costpilot_fs", 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore("handles");
    req.onsuccess = e => { _db = e.target.result; res(_db); };
    req.onerror = () => rej(req.error);
  });
  return {
    save: async (handle) => {
      const d = await open();
      return new Promise((res, rej) => {
        const tx = d.transaction("handles", "readwrite");
        tx.objectStore("handles").put(handle, "backupDir");
        tx.oncomplete = res; tx.onerror = () => rej(tx.error);
      });
    },
    load: async () => {
      const d = await open();
      return new Promise(res => {
        const tx = d.transaction("handles", "readonly");
        const req = tx.objectStore("handles").get("backupDir");
        req.onsuccess = () => res(req.result || null);
        req.onerror = () => res(null);
      });
    },
    clear: async () => {
      const d = await open();
      return new Promise(res => {
        const tx = d.transaction("handles", "readwrite");
        tx.objectStore("handles").delete("backupDir");
        tx.oncomplete = res; tx.onerror = res;
      });
    },
  };
})();

// ניקוי ערך-מחרוזת: מסיר תווי פורמט/כיווניות/רוחב-אפס, מאחד רווחים, trim — משמר רישיות וטקסט גלוי.
// (קוד-תווים מספרי, בלי שום תו נסתר בקוד עצמו.)
const _cleanStr = (s) => {
  if (typeof s !== "string") return s;
  let out = "";
  for (const ch of s) {
    const cp = ch.codePointAt(0);
    if (cp === 0x00AD || cp === 0xFEFF || (cp >= 0x200B && cp <= 0x200F) || (cp >= 0x202A && cp <= 0x202E) || (cp >= 0x2066 && cp <= 0x2069)) continue;
    if (cp === 0x00A0 || cp === 0x202F || cp === 0x205F || cp === 0x3000 || (cp >= 0x2000 && cp <= 0x200A)) { out += " "; continue; }
    out += ch;
  }
  return out.replace(/\s+/g, " ").trim();
};
// payType מנוקה: ריק או "אחוזים" (אחרי ניקוי) → בדיוק "אחוזים" (עקבי עם דפוס c.payType||"אחוזים" בקוד).
const _cleanPayType = (pt) => {
  const c = _cleanStr(typeof pt === "string" ? pt : "");
  return (c === "" || c === "אחוזים") ? "אחוזים" : c;
};

// Sync project data loaded from any source (Firestore, backup, import) so it behaves
// as if all data was entered manually through the UI.
// 1. Migrates projectNumber / planningManager / executionManager from openingData → top-level
//    (the Python import script stored these inside openingData by mistake).
// 2. Syncs approved quotes consultants → consultants array (mirrors makeTabSetter quotes logic),
//    preserving existing increases/invoices via ...existing spread.
// 3. Deduplicates: old numeric-ID entries that are the same consultant as an approved quote
//    entry are removed; _fromQuote entries without a quotes counterpart are kept as-is.
function syncProjectData(projData) {
  if (!projData) return projData;
  let result = projData;
  let changed = false;

  // ── 0. ניקוי תווים נסתרים בערכי-מחרוזת — נתונים מיובאים יתנהגו בדיוק כמו ידניים ──
  // מנקה payType/שמות/תחומים/אומדנים כך שכל ההשוואות המדויקות בקוד (payType==="אחוזים",
  // milestones[companyId][fieldName], statsRows.find(field===), arch/PM detection) יצליחו.
  // ניקוי עקבי בכל המופעים שומר על קישורי חשבון↔יועץ↔תחום; משנה רק ג'אנק בלתי-נראה, לא מספרים.
  {
    let dirty = false;
    const od = { ...(result.openingData || {}) };
    ["contractorEst","municipalEst","archBase","buildingArea"].forEach(k => {
      if (typeof od[k] === "string") { const v = _cleanStr(od[k]); if (v !== od[k]) { od[k] = v; dirty = true; } }
    });
    const bs = { ...(result.budgetState || {}) };
    ["contractorEst","municipalEst"].forEach(k => {
      if (typeof bs[k] === "string") { const v = _cleanStr(bs[k]); if (v !== bs[k]) { bs[k] = v; dirty = true; } }
    });
    const cQuotes = (result.quotes || []).map(fg => {
      let fgDirty = false;
      const fieldName = _cleanStr(fg.fieldName); if (fieldName !== fg.fieldName) { fgDirty = true; dirty = true; }
      const consultants = (fg.consultants || []).map(c => {
        const name = _cleanStr(c.name), payType = _cleanPayType(c.payType);
        if (name !== c.name || payType !== c.payType) { fgDirty = true; dirty = true; return { ...c, name, payType }; }
        return c;
      });
      return fgDirty ? { ...fg, fieldName, consultants } : fg;
    });
    const cCons = (result.consultants || []).map(c => {
      const name = _cleanStr(c.name), role = _cleanStr(c.role), payType = _cleanPayType(c.payType);
      if (name !== c.name || role !== c.role || payType !== c.payType) { dirty = true; return { ...c, name, role, payType }; }
      return c;
    });
    const cAcc = (result.accounts || []).map(r => {
      const consultantName = _cleanStr(r.consultantName), fieldName = _cleanStr(r.fieldName);
      if (consultantName !== r.consultantName || fieldName !== r.fieldName) { dirty = true; return { ...r, consultantName, fieldName }; }
      return r;
    });
    if (dirty) {
      result = { ...result, openingData: od, budgetState: bs, quotes: cQuotes, consultants: cCons, accounts: cAcc };
      changed = true;
    }
  }

  // ── 1. Migrate top-level metadata fields out of openingData ──────────────────
  const o = projData.openingData || {};
  ["projectNumber","planningManager","executionManager"].forEach(key => {
    if (!result[key] && o[key]) {
      result = { ...result, [key]: o[key] };
      changed = true;
    }
  });

  // ── 2. Sync approved quotes → consultants ────────────────────────────────────
  const quotes   = result.quotes   || [];
  const existing = result.consultants || [];

  // Build the fresh _fromQuote list from approved quotes
  const approvedFromQuotes = [];
  const approvedQIds   = new Set(); // "q-{id}" IDs we are creating
  const approvedRawIds = new Set(); // original numeric/string IDs from quotes
  const approvedNames  = new Set(); // lowercase names

  quotes.forEach(fg => {
    (fg.consultants || []).forEach(c => {
      if (c.approved && c.name && c.name.trim()) {
        // Spread existing entry (either format) to preserve increases/invoices/etc.
        const prev = existing.find(e => e.id === "q-" + c.id) ||
                     existing.find(e => String(e.id) === String(c.id)) || {};
        approvedFromQuotes.push({
          ...prev,
          id:       "q-" + c.id,
          name:     c.name.trim(),
          role:     fg.fieldName || "",
          phone:    c.phone    || "",
          email:    c.email    || "",
          contract: c.contract || "",
          payType:  c.payType  || "אחוזים",
          value:    c.value    || "",
          subItems: c.subItems || [],
          _fromQuote: true,
        });
        approvedQIds.add("q-" + c.id);
        approvedRawIds.add(String(c.id));
        approvedNames.add(c.name.trim().toLowerCase());
      }
    });
  });

  // Build the retained list:
  // • Keep _fromQuote entries that we are NOT recreating from quotes
  //   (imported consultants that got _fromQuote:true via fix_duplicates.js but have no quotes entry)
  // • Keep non-_fromQuote entries that are NOT duplicates of approved quotes consultants
  //   (remove old-format numeric-ID entries for the same person)
  const retained = existing.filter(c => {
    if (c._fromQuote) {
      // Keep if we have no new version for it (neither "q-X" nor raw "X" is being recreated)
      return !approvedQIds.has(String(c.id)) && !approvedRawIds.has(String(c.id));
    } else {
      // Remove if it's a duplicate of an approved quotes consultant
      if (approvedQIds.has(String(c.id)))   return false; // same ID, new format
      if (approvedRawIds.has(String(c.id))) return false; // same numeric ID as quote consultant
      if (approvedNames.has((c.name || "").trim().toLowerCase())) return false; // same name
      return true;
    }
  });

  const merged = [...approvedFromQuotes, ...retained];
  if (merged.length !== existing.length ||
      merged.some((m, i) => m.id !== existing[i]?.id)) {
    result = { ...result, consultants: merged };
    changed = true;
  }

  // ── 3. ניקוי שורות חשבון יתומות של הגדלות שנמחקו ─────────────────────────────
  // מחיקת הגדלה מסירה אותה מהיועץ בלבד; שורות החשבון שלה (rowKey="i-"+id) נותרות
  // יתומות וממשיכות להופיע כתזכורות בלוח הבקרה. מסירים אותן בשכבת הנתונים.
  // ה-rowKey נחשב חוקי אם ה-id קיים בין ההגדלות (במיזוג הנוכחי או במקור) — כדי לא
  // למחוק בטעות נתוני חשבון של הגדלה שרק "הוזזה" בלוגיקת המיזוג.
  {
    const accts = result.accounts || [];
    if (accts.length > 0) {
      const validIncKeys = new Set();
      const collectInc = list => (list || []).forEach(c =>
        (c.increases || []).forEach(x => validIncKeys.add("i-" + x.id)));
      collectInc(result.consultants);
      collectInc(projData.consultants);
      const cleaned = accts.filter(r => {
        const rk = String(r.rowKey || "");
        return rk.startsWith("i-") ? validIncKeys.has(rk) : true;
      });
      if (cleaned.length !== accts.length) {
        result = { ...result, accounts: cleaned };
        changed = true;
      }
    }
  }

  return changed ? result : projData;
}

function App() {
      const [user, setUser]         = useState(undefined);
      const [userRole, setUserRole] = useState(null);  // { role: "admin"|"user", projects: [...] }
      const [checking, setChecking] = useState(true);

      useEffect(() => {
        let unsubscribe = null;
        const wait = setInterval(() => {
          if (window._firebase) {
            clearInterval(wait);
            const { auth, onAuthStateChanged } = window._firebase;
            unsubscribe = onAuthStateChanged(auth, async u => {
              if (u) {
                setUser(u);
                // טעינת הרשאות
                let roleData = null;
                try { roleData = await loadUserRole(u.uid); } catch(e) { console.warn("loadUserRole error", e); }
                if (roleData) {
                  // קיים - אל תדרוס, רק עדכן מייל אם חסר
                  if (!roleData.email && u.email) {
                    const updated = { ...roleData, email: u.email };
                    try { await saveUserRole(u.uid, updated); } catch(e) {}
                    setUserRole(updated);
                  } else {
                    setUserRole(roleData);
                  }
                } else if (roleData === null) {
                  // משתמש חדש בלבד (לא שגיאת רשת) - ברירת מחדל user
                  const newRole = { role: "user", projects: [], email: u.email || "" };
                  try { await saveUserRole(u.uid, newRole); } catch(e) {}
                  setUserRole(newRole);
                }
              } else {
                setUser(null);
                setUserRole(null);
              }
              setChecking(false);
            });
          }
        }, 100);
        const timeout = setTimeout(() => { clearInterval(wait); setChecking(false); }, 10000);
        return () => { clearInterval(wait); clearTimeout(timeout); if (unsubscribe) unsubscribe(); };
      }, []);

      if (checking) return (
        <div style={{ minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", fontFamily:"'Heebo',sans-serif", color:"#9A9A9A", flexDirection:"column", gap:12 }}>
          <div style={{ fontSize:32 }}>⏳</div>
          <div>טוען CostPilot...</div>
        </div>
      );

      if (!user) return <LoginScreen onLogin={u => { setUser(u); }} />;
      if (!userRole) return (
        <div style={{ minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", fontFamily:"'Heebo',sans-serif", color:"#9A9A9A" }}>
          טוען הרשאות...
        </div>
      );
      return <AppInner currentUser={user} userRole={userRole} setUserRole={setUserRole} />;
    }

// ── התאמת שם יועץ לספק הקנוני מרשימת הספקים (עמיד לתווים נסתרים ולווריאציות שם) ──
// normName מנקה תווי פורמט/כיווניות/רוחב-אפס ומאחד רווחים (קוד-תווים מספרי, בלי תווים נסתרים בקוד).
// ניקוי טקסט לצורת-תצוגה קנונית: מסיר תווים נסתרים, מכווץ רווחים (כולל רווחים נסתרים) וגוזם קצה. משמר אותיות.
const _cleanText = (s) => {
  let out = "";
  for (const ch of String(s || "")) {
    const cp = ch.codePointAt(0);
    if (cp === 0x00AD || cp === 0xFEFF || (cp >= 0x200B && cp <= 0x200F) || (cp >= 0x202A && cp <= 0x202E) || (cp >= 0x2066 && cp <= 0x2069)) continue;
    if (cp === 0x00A0 || cp === 0x202F || cp === 0x205F || cp === 0x3000 || (cp >= 0x2000 && cp <= 0x200A)) { out += " "; continue; }
    out += ch;
  }
  return out.replace(/\s+/g, " ").trim();
};
// מפתח השוואה: כמו _cleanText אך גם lowercase.
const _normSupName = (s) => _cleanText(s).toLowerCase();
const _supTokens = name => _normSupName(name).split(" ").filter(w => w.length >= 2);
// שני שמות שקולים: זהים אחרי נרמול, או שקבוצת המילים של אחד מוכלת באחר (≥2 מילים).
const namesEquivalent = (a, b) => {
  const na = _normSupName(a), nb = _normSupName(b);
  if (!na || !nb) return false;
  if (na === nb) return true;
  const ta = _supTokens(a), tb = _supTokens(b);
  if (ta.length < 2 || tb.length < 2) return false;
  const subset = (x, y) => x.every(w => y.includes(w));
  return subset(ta, tb) || subset(tb, ta);
};
// מחזיר את שם הספק הקנוני מרשימת הספקים שמתאים לשם הנתון, או את השם המקורי אם אין התאמה.
const canonicalSupplierName = (name, suppliers) => {
  const m = (suppliers || []).find(s => namesEquivalent(s.name, name));
  return m ? m.name : (name || "");
};

// התאמת שם-מקצוע/תחום: זהות (אחרי נרמול), או שאחד תחילית של השני (אדריכל↔אדריכלות),
// כדי שווריאציות שם-תחום מנתונים מיובאים יתאימו לתבניות אבני הדרך / גיליון הסטטיסטיקה.
const professionEquivalent = (a, b) => {
  const na = _normSupName(a), nb = _normSupName(b);
  if (!na || !nb) return false;
  if (na === nb) return true;
  const short = na.length <= nb.length ? na : nb;
  const long  = na.length <= nb.length ? nb : na;
  return short.length >= 4 && long.startsWith(short);
};
// מחזיר את תבנית אבני הדרך לחברה+תחום, עם סובלנות לווריאציות שם-תחום.
const findMilestoneTemplate = (milestones, companyId, fieldName) => {
  const company = milestones && milestones[companyId];
  if (!company) return null;
  if (company[fieldName]) return company[fieldName];
  const key = Object.keys(company).find(k => professionEquivalent(k, fieldName));
  return key ? company[key] : null;
};
// אחוז התחום מגיליון הסטטיסטיקה, עם סובלנות לווריאציות שם-תחום (אדריכל↔אדריכלות וכו').
const profStatPct = (statsRows, fieldName) => {
  const rows = statsRows || [];
  const exact = rows.find(r => r.field === fieldName);
  if (exact) return Number(exact.pct || 0);
  const m = rows.find(r => professionEquivalent(r.field, fieldName));
  return m ? Number(m.pct || 0) : 0;
};

// ── מדד "אחוז יועצים מאומדן קבלני": סכום היועצים ללא תחום "מכון בקרה" ──
// תחום "מכון בקרה" — סובלני לווריאציות שם ולתווים נסתרים; תומך גם בשדה מערך.
const _isInspectionInstituteField = (field) => {
  const f = Array.isArray(field) ? field.join(" ") : field;
  return _normSupName(f).includes(_normSupName("מכון בקרה"));
};
// סכום עלות שורת-יועץ (אותו ביטוי שחוזר בכל חישובי התקציב).
const consultantRowAmount = (r) =>

// סך היועצים למדד "אחוז יועצים מאומדן קבלני" — ללא מכון בקרה.
const consultantsUtilTotal = (rows) =>
  (rows || []).reduce((s, r) => _isInspectionInstituteField(r.field) ? s : s + consultantRowAmount(r), 0);

// ── Helper: פתיחת Outlook עם גוף RTL בקליפבורד ──────────────────────────────
const openOutlookEmail = (toEmail, subject, bodyText, bodyHtmlOverride) => {
  if (typeof window !== "undefined" && window.__costpilotReadOnly) return; // צפייה-בלבד: יוזר רגיל אינו שולח מיילים
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const html = bodyHtmlOverride || `<div dir="rtl" style="font-family:Arial,sans-serif;font-size:13px;direction:rtl;text-align:right">${
    bodyText.split("\n").map(l => l.trim() ? `<p style="margin:2px 0">${esc(l)}</p>` : `<p style="margin:5px 0"> </p>`).join("")
  }</div>`;
  const onCopy = e => { e.clipboardData.setData("text/html", html); e.clipboardData.setData("text/plain", bodyText); e.preventDefault(); };
  document.addEventListener("copy", onCopy);
  document.execCommand("copy");
  document.removeEventListener("copy", onCopy);
  window.location.href = `mailto:${encodeURIComponent(toEmail)}?subject=${encodeURIComponent(subject)}`;
};

const buildEmailHtml = (intro, tableHeaders, tableRows, outro, rowHighlights, highlightColor="#EFF7F3") => {
  const thStyle = `style="padding:7px 12px;background:#F0F2F5;border:1px solid #D0D5DD;font-weight:700;font-size:12px;text-align:right"`;
  const tdStyle = `style="padding:7px 12px;border:1px solid #E2E5EA;font-size:12px;text-align:right"`;
  const rows = tableRows.map((r, i) => {
    const trStyle = rowHighlights?.[i] ? ` style="background:${highlightColor}"` : "";
    return `<tr${trStyle}>${r.map(c=>`<td ${tdStyle}>${c}</td>`).join("")}</tr>`;
  }).join("");
  const headers = tableHeaders.map(h=>`<th ${thStyle}>${h}</th>`).join("");
  const table = `<table style="border-collapse:collapse;width:100%;direction:rtl;margin:12px 0">\n<thead><tr>${headers}</tr></thead>\n<tbody>${rows}</tbody></table>`;
  const esc = s => String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const p = t => t.split("\n").map(l => l.trim() ? `<p style="margin:3px 0">${esc(l)}</p>` : `<p style="margin:6px 0"> </p>`).join("");
  return `<div dir="rtl" style="font-family:Arial,sans-serif;font-size:13px;direction:rtl;text-align:right;max-width:700px">${p(intro)}${table}${outro ? p(outro) : ""}</div>`;
};

  const pct = Number(consultant.value || 0);
  if (!pct) return [];
  if (["אדריכל","אדריכלות","אדריכלים"].includes(role)) {
    const contractorEst = Number(String((openingData||{}).contractorEst||"").replace(/,/g,"")) || Number((budgetState||{}).contractorEst || 0);
    if (!contractorEst) return [];
    const devPct = (statsRows||[]).filter(r=>(r.field||"").includes("פיתוח")||(r.field||"").includes("נוף")).reduce((s,r)=>s+Number(r.pct||0),0);
    const manualArchBaseRaw = String((openingData||{}).archBase||"").replace(/[,\s]/g,"").replace(/[^\d.]/g,"");
    const manualArchBase = manualArchBaseRaw ? Number(manualArchBaseRaw) : 0;
    const archBase = manualArchBase > 0 ? manualArchBase : contractorEst - contractorEst * devPct / 100;
    return [
      `בסיס לחישוב אדריכלות: ${fmt(archBase)}`,
      `אחוז שכר טרחה: ${pct}%`,
      `שכר טרחה בסיסי לאדריכל: ${fmt(archBase * pct / 100)}`,
    ];
  }
  if (role.includes("מנהל פרויקט")) {
    const globalEst = Number((budgetState||{}).contractorEst || 0);
    if (!globalEst) return [];
    const hist = consultant.contractorEstHistory;
    const contractorEst = (hist?.length > 0) ? Number(hist[hist.length-1].amount) : globalEst;
    return [
      `אומדן קבלני (בסיס חישוב): ${fmt(contractorEst)}`,
      `אחוז שכר טרחה: ${pct}%`,
      `שכר טרחה בסיסי למנהל פרויקט: ${fmt(contractorEst * pct / 100)}`,
    ];
  }
  const contractorEst = Number((budgetState||{}).contractorEst || 0);
  if (!contractorEst) return [];
  const profPct = profStatPct(statsRows, consultant.role);
  if (!profPct) return [];
  const profBase = contractorEst * profPct / 100;
  return [
    `אומדן קבלני (בסיס): ${fmt(contractorEst)}`,
    `אחוז פרק ${consultant.role} (${profPct}%): ${fmt(profBase)}`,
    `אחוז שכר טרחה: ${pct}%`,
    `שכר טרחה בסיסי: ${fmt(profBase * pct / 100)}`,
  ];
};

// ── בונה נתוני טבלת הצעות מחיר למייל — sub-items כעמודות ────────────────────
// consultants: מערך יועצים של התחום (רק עם שם)
// calcFeeOrNull: פונקציה (c)=>number לחישוב שכ"ט %-ית, או null
// highlightFn: פונקציה (c)=>boolean להדגשת שורה
// returns: { headers, rows, rowHighlights }
const buildQuoteTableData = (consultants, calcFeeOrNull, highlightFn) => {
  const allDescs = [];
  const seen = new Set();
  consultants.forEach(c => (c.subItems||[]).forEach(it => {
    const d = it.description || "";
    if (d && !seen.has(d)) { seen.add(d); allDescs.push(d); }
  }));
  const hasAnySub = allDescs.length > 0;

  if (!hasAnySub) {
    const hasAnyPct = consultants.some(c => c.payType === "אחוזים");
    const rows = consultants.flatMap(c => {
      const fee = calcFeeOrNull ? calcFeeOrNull(c) : null;
      const hasSub = (c.subItems||[]).length > 0;
      const subTotal = hasSub ? (c.subItems||[]).reduce((s,it)=>s+Number(it.amount||0),0) : null;
      const pctVal = c.payType === "אחוזים" ? `${c.value||0}%` : "";
      const amtVal = fee ? fmt(fee) : (c.payType !== "אחוזים" ? fmt(hasSub ? subTotal : c.value) : "—");
      const mainRow = hasAnyPct
        ? [c.name||"—", c.payType||"—", pctVal, amtVal, c.notes||""]
        : [c.name||"—", c.payType||"—", amtVal, c.notes||""];
      if (!hasSub) return [mainRow];
      const subRows = c.subItems.map(it => hasAnyPct
        ? [`  ↳ ${it.description||""}`, "", "", fmt(it.amount), ""]
        : [`  ↳ ${it.description||""}`, "", fmt(it.amount), ""]);
      return [mainRow, ...subRows];
    });
    const rowHighlights = consultants.flatMap(c => [!!(highlightFn&&highlightFn(c)), ...(c.subItems||[]).map(()=>false)]);
    const headers = hasAnyPct
      ? ["יועץ", "סוג תשלום", "ערך", "סכום", "הערות"]
      : ["יועץ", "סוג תשלום", "סכום", "הערות"];
    return { headers, rows, rowHighlights };
  }

  // sub-items כעמודות
  const headers = ["יועץ", "סוג תשלום", ...allDescs, 'סה"כ', "הערות"];
  const rows = consultants.map(c => {
    const fee = calcFeeOrNull ? calcFeeOrNull(c) : null;
    const hasSub = (c.subItems||[]).length > 0;
    const subTotal = hasSub ? (c.subItems||[]).reduce((s,it)=>s+Number(it.amount||0),0) : null;
    const totalVal = hasSub ? fmt(subTotal) : fee ? fmt(fee) : (c.payType==="אחוזים" ? `${c.value||0}%` : fmt(c.value));
    const subCells = allDescs.map(d => {
      if (!hasSub) return "";
      const it = (c.subItems||[]).find(x => (x.description||"") === d);
      return it ? fmt(it.amount) : "";
    });
    return [c.name||"—", c.payType||"—", ...subCells, totalVal, c.notes||""];
  });
  const rowHighlights = consultants.map(c => !!(highlightFn&&highlightFn(c)));
  return { headers, rows, rowHighlights };
};

              return cEst * pp * pct;
            };
            const { headers: _mHeaders, rows: _mRows, rowHighlights } = buildQuoteTableData(consultants, calcFee, con => con.id === c.id);
            const subject = `פרויקט ${projectMeta.name} – תחום- ${field.fieldName}`;
            const intro = `שלום,\n\nבפרויקט ${projectMeta.name} תחום ${field.fieldName} מועבר לאישורכם ראו הצעות היועצים.\nהמלצתנו להתקשרות עם יועץ "${c.name}"`;
            const outro = "בברכה,";
            const body = `${intro}\n\n${outro}`;
            const _mEmptyRow = _mHeaders.map((_,i) => i===0?"אין יועצים":"");
            const htmlBody = buildEmailHtml(intro, _mHeaders, _mRows.length ? _mRows : [_mEmptyRow], outro, rowHighlights);
            setApprovalModal({ toEmail: "", toName: "", subject, body, htmlBody });
          }}
        />
      ))}
      </div>
      </div>
    </div>
  );
}

function FieldGroup({ field, onDelete, onUpdateConsultants, onRename, suppliers, onToggleReady, isHighlighted, budgetState, openingData, statsRows, projectName, projectNumber, companyName, companyId, workScopes, onUpdateWorkScope, onUpdateNote, onSentToMunicipality, onApproved, onRecommended }) {
  const emptyC = { id:0, name:"", payType:"אחוזים", value:"", notes:"", recommended:false, approved:false, sentToMunicipality:false,
                   contact:"", phone:"", phone2:"", email:"" };

  const updateSubItem = (cId, itemId, key, val) => updateC(cId, "subItems", (field.consultants.find(x=>x.id===cId)?.subItems||[]).map(it => it.id===itemId ? {...it,[key]:val} : it));
  const delSubItem = (cId, itemId) => updateC(cId, "subItems", (field.consultants.find(x=>x.id===cId)?.subItems||[]).filter(it=>it.id!==itemId));
  const cardRef = React.useRef(null);

  React.useEffect(() => {
    if (isHighlighted && cardRef.current) {
      setTimeout(() => {
        cardRef.current?.scrollIntoView({ behavior:"smooth", block:"center" });

    }
  }, [isHighlighted]);

  const addConsultant = () => {
    const newId = Date.now();
    onUpdateConsultants([...field.consultants, { ...emptyC, id: newId, createdAt: newId }]);
    setNewestId(newId);
  };

  const delConsultant = id => onUpdateConsultants(field.consultants.filter(c => c.id !== id));

  const updateC = (id, key, val) => {
    const ts = {};
    if (key === "recommended" && val) ts.recommendedAt = Date.now();
    if (key === "sentToMunicipality" && val) ts.sentToMunicipalityAt = Date.now();
    onUpdateConsultants(field.consultants.map(c => c.id === id ? { ...c, [key]: val, ...ts } : c));
  };


  const buildFieldMailData = () => {
    const bccEmails = [];
    (field.consultants||[]).forEach(c => {
      if (!c.recommended) {
        const sup = (suppliers||[]).find(s => s.name === c.name || (s.contacts||[]).some(ct => ct.email && ct.email === c.email));
        let email = c.email || "";
        if (!email && sup) { const ct = (sup.contacts||[]).find(ct => ct.email); if (ct) email = ct.email; }
        if (email && !bccEmails.includes(email)) bccEmails.push(email);
      }
    });
    const fmtNum = v => { const n = Number(String(v||"").replace(/,/g,"")); return n ? n.toLocaleString("en-US") : null; };
    const fmtDate = v => { if (!v) return null; const p = String(v).match(/^(\d{4})-(\d{2})-(\d{2})$/); return p ? `${p[3]}/${p[2]}/${p[1]}` : v; };
    const d = openingData || {};
    const val = v => (v && String(v).trim()) ? String(v).trim() : "—";
    const lines = [
      "שלום רב,",
      "",
      `אנו מזמינים אתכם להגיש הצעת מחיר עבור פרויקט ${val(projectName)}`,
      `כתובת: ${val(d.address)}`,
      `מהות העבודה: ${val(d.workDescription)}`,
      `תאריך התחלה: ${fmtDate(d.startDate) || "—"}`,
      `תאריך סיום: ${fmtDate(d.endDate) || "—"}`,
      `שטח החלקה: ${d.plotArea ? d.plotArea + ' מ"ר' : "—"}`,
      `שטח המבנה: ${d.buildingArea ? d.buildingArea + ' מ"ר' : "—"}`,
      `אומדן קבלני: ${fmtNum(d.contractorEst) ? fmtNum(d.contractorEst) + " ₪" : "—"}`,
      `כמות מעליות: ${val(d.elevators)}`,
      `כמות עצים: ${val(d.trees)}`,
      `שימוש ב-BIM: ${d.bim === false ? "לא" : "כן"}`,
      "",
      "יש להגיש הצעתכם עד תאריך: ",
      "",
      "בברכה,",
    ];
    const body = lines.join("\n");
    const subject = `הזמנה להגשת הצעת מחיר - ${projectName || "פרויקט"} - ${field.fieldName}`;
    const bcc = bccEmails.join(";");
    const mailtoLink = `mailto:?bcc=${encodeURIComponent(bcc)}&subject=${encodeURIComponent(subject)}`;
    return { bcc, bccEmails, subject, body, mailtoLink };
  };

  const getScopeText = () =>
    (((workScopes||{})[String(companyId||"")]||{})[field.fieldName] || field.workScope || "");

  const buildPdfBase64 = async (scopeText, consultants) => {
    if (!scopeText) return null;
    if (!window.html2canvas || !window.jspdf) { alert("ספריות PDF לא נטענו. רענן את הדף ונסה שנית."); return null; }
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation:"p", unit:"pt", format:"a4" });
    const pageW = pdf.internal.pageSize.getWidth();
    const pageH = pdf.internal.pageSize.getHeight();
    const pages = (consultants && consultants.length > 0) ? consultants : [null];
    for (let pi = 0; pi < pages.length; pi++) {
      const consultant = pages[pi];
      const consultantName = consultant ? (consultant.name || "") : "";
      const escaped = scopeText.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
      const escapedConsultant = consultantName.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
      const div = document.createElement("div");
      div.style.cssText = "position:absolute;top:0;left:-9999px;width:794px;padding:56px 60px;background:#fff;direction:rtl;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.9;color:#0D0D0D;box-sizing:border-box";
      div.innerHTML = `
        <h2 style="font-size:19px;font-weight:700;margin:0 0 6px">${field.fieldName} — תכולת עבודה</h2>
        ${companyName ? `<div style="font-size:13px;color:#767676;margin-bottom:4px">חברה עירונית: ${companyName}</div>` : ''}
        ${projectName ? `<div style="font-size:13px;color:#767676;margin-bottom:24px">פרויקט: ${projectName}</div>` : '<div style="margin-bottom:24px"></div>'}
        <div style="white-space:pre-wrap;margin-bottom:36px;font-size:13.5px">${escaped}</div>
        <div style="border-top:2px solid #0D0D0D;padding-top:20px">
          <div style="font-weight:700;font-size:15px;margin-bottom:14px">בקשה להגשת הצעת מחיר</div>
          <div style="margin-bottom:10px">שם החברה / היועץ: <span style="display:inline-block;border-bottom:1px solid #000;min-width:220px;padding:0 6px">${escapedConsultant || "&nbsp;"}</span></div>
          <div style="margin-bottom:10px">סכום הצעת המחיר: <span style="display:inline-block;border-bottom:1px solid #000;min-width:180px">&nbsp;</span>  (כולל מע&quot;מ)</div>
          <div style="margin-bottom:10px">תאריך הגשה: <span style="display:inline-block;border-bottom:1px solid #000;min-width:160px">&nbsp;</span></div>
          <div style="margin-bottom:10px">חתימה: <span style="display:inline-block;border-bottom:1px solid #000;min-width:200px">&nbsp;</span></div>
        </div>`;
      document.body.appendChild(div);
      try {
        const canvas = await window.html2canvas(div, { scale:2, useCORS:true, backgroundColor:"#fff", logging:false });
        document.body.removeChild(div);
        if (pi > 0) pdf.addPage();
        const imgData = canvas.toDataURL("image/png");
        const imgH = canvas.height * pageW / canvas.width;
        if (imgH <= pageH) {
          pdf.addImage(imgData, "PNG", 0, 0, pageW, imgH);
        } else {
          let yOffset = 0;
          while (yOffset < imgH) {
            if (yOffset > 0) pdf.addPage();
            pdf.addImage(imgData, "PNG", 0, -yOffset, pageW, imgH);
            yOffset += pageH;
          }
        }
      } catch(e) {
        if (document.body.contains(div)) document.body.removeChild(div);
        console.error("שגיאה ביצירת PDF:", e);
        return null;
      }
    }
    return pdf.output("datauristring").split(",")[1]; // raw base64
  };

  const toUtf8Base64 = str => {
    const bytes = new TextEncoder().encode(str);
    let binary = ""; bytes.forEach(b => binary += String.fromCharCode(b));
    return btoa(binary);
  };

  const downloadScopeEml = () => {
    if (typeof window !== "undefined" && window.__costpilotReadOnly) return; // צפייה-בלבד: יוזר רגיל אינו שולח הזמנות להצעת מחיר
    const { bccEmails, subject, body } = buildFieldMailData();
    const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    const html = `<div dir="rtl" style="font-family:Arial,sans-serif;font-size:13px;direction:rtl;text-align:right">${
      body.split("\n").map(l => l.trim() ? `<p style="margin:2px 0">${esc(l)}</p>` : `<p style="margin:5px 0"> </p>`).join("")
    }</div>`;
    const onCopy = e => { e.clipboardData.setData("text/html", html); e.clipboardData.setData("text/plain", body); e.preventDefault(); };
    document.addEventListener("copy", onCopy);
    document.execCommand("copy");
    document.removeEventListener("copy", onCopy);
    window.location.href = `mailto:?bcc=${encodeURIComponent(bccEmails.join(";"))}&subject=${encodeURIComponent(subject)}`;
    // Mark each invited (non-recommended) consultant as invited — preserve original date
    const _now = Date.now();
    onUpdateConsultants(field.consultants.map(c =>
      (!c.recommended && !c.quoteInvitedAt) ? { ...c, quoteInvitedAt: _now } : c
    ));

  const _fieldKey = _normSupName(field.fieldName);
  const fieldSuppliers = (suppliers||[]).filter(s => (Array.isArray(s.field) ? s.field : (s.field ? [s.field] : [])).some(f => _normSupName(f) === _fieldKey));

  return (
    <Card ref={cardRef} className={isHighlighted ? "field-highlight" : ""} style={{ padding:0, overflow:"hidden", transition:"box-shadow .3s, border-color .3s",

      {/* Field header */}
      <div style={{ padding:"12px 18px", background:"#F7F8FA", borderBottom:"1px solid #E2E5EA", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
        <div style={{ display:"flex", alignItems:"center", gap:10 }}>
          {editingName ? (
            <div style={{ display:"flex", gap:8, alignItems:"center" }}>
              <input value={tempName} onChange={e => setTempName(e.target.value)}
                onKeyDown={e => e.key==="Enter" && saveName()}
                style={{ fontSize:15, fontWeight:700, color:"#0D0D0D", border:"1.5px solid #0B1F3A", borderRadius:4, padding:"4px 10px", fontFamily:"'Heebo',sans-serif", outline:"none" }} autoFocus />
              <button onClick={saveName} style={{ background:"#0B1F3A", color:"#fff", border:"1.5px solid transparent", borderRadius:4, padding:"8px 12px", fontSize:13, cursor:"pointer", fontFamily:"'Heebo',sans-serif" }}>שמור</button>
            </div>
          ) : (
            <span onClick={() => setEditingName(true)} style={{ fontSize:16, fontWeight:800, color:"#0D0D0D", cursor:"pointer" }}>{field.fieldName}</span>
          )}
        </div>
        <div style={{ display:"flex", gap:8, alignItems:"center", flexShrink:0 }}>
          <label style={{ display:"flex", alignItems:"center", gap:5, fontSize:13, fontWeight:600, color: field.readyToRecommend ? "#3A3A3A" : "#767676", cursor:"pointer", background:"#F0F2F5", border:"1.5px solid #E2E5EA", borderRadius:4, padding:"8px 12px", whiteSpace:"nowrap", fontFamily:"'Heebo',sans-serif" }}>
            <input type="checkbox" checked={!!field.readyToRecommend} onChange={e => onToggleReady(e.target.checked)}
              style={{ width:13, height:13, accentColor:"#444444", cursor:"pointer" }} />
            הועבר להמלצה
          </label>
          <button onClick={addConsultant}
            style={{ background:"#F0F2F5", color:"#3A3A3A", border:"1.5px solid #E2E5EA", borderRadius:4, padding:"8px 12px", fontSize:13, cursor:"pointer", fontFamily:"'Heebo',sans-serif", fontWeight:600, whiteSpace:"nowrap" }}>
            + הוסף יועץ
          </button>
          <button onClick={() => { if (typeof window !== "undefined" && window.__costpilotReadOnly) return; setEmailCopied(false); setShowEmailModal(true); }}
            title="שלח הזמנה להגשת הצ״מ לכל היועצים בתחום זה"
            style={{ background:"#EAF1FA", color:"#163356", border:"1.5px solid #B8CEED", borderRadius:4, padding:"8px 12px", fontSize:13, cursor:"pointer", fontFamily:"'Heebo',sans-serif", fontWeight:700, whiteSpace:"nowrap" }}>

        <input value={field.fieldNote || ""} onChange={e => onUpdateNote?.(e.target.value)}

          style={{ flex:1, border:"none", outline:"none", fontSize:13, fontFamily:"'Heebo',sans-serif", color:"#3A3A3A", background:"transparent", padding:"4px 0", boxSizing:"border-box" }} />

      {/* Table */}
      <div style={{ overflowX:"auto" }}>
        {(() => {

                <th key={hi} style={{ padding:"9px 8px", textAlign:"right", color:"#767676", fontWeight:700, fontSize:11, whiteSpace:"normal", lineHeight:1.3, maxWidth:w, width:w, verticalAlign:"bottom" }}>{h}</th>

                {/* המלצה */}
                <td style={{ padding:"10px 12px", textAlign:"right" }}>
                  <input type="checkbox" checked={!!c.recommended} onChange={e => { updateC(c.id,"recommended",e.target.checked); if (e.target.checked) onRecommended?.(c); }}
                    style={{ width:16, height:16, cursor:"pointer", accentColor:"#444444" }} />
                </td>

                  <RatingBadge name={c.name} suppliers={suppliers} />

                {/* שם */}
                <td style={{ padding:"10px 12px", minWidth:180 }}>
                  <NameSearchInput
                    value={c.name}

                  />
                </td>

                <td style={{ padding:"10px 12px", minWidth:110 }}>
                  <select value={c.payType} onChange={e => updateC(c.id,"payType",e.target.value)}
                    style={{ background:"transparent", border:"1px solid #E2E5EA", borderRadius:4, padding:"5px 9px", fontSize:13, color:"#0D0D0D", fontFamily:"'Heebo',sans-serif", outline:"none", cursor:"pointer" }}>
                    {PAYMENT_TYPES.map(p => <option key={p}>{p}</option>)}

                <td style={{ padding:"10px 8px", width:175 }}>

                    <span style={{ color:"#767676", fontSize:12, fontWeight:600, flexShrink:0, width:12, textAlign:"center" }}>{c.payType==="אחוזים"?"%":""}</span>

                        style={{ background:"transparent", border:"1px solid #E2E5EA", borderRadius:4, padding:"5px 7px", fontSize:13, color:"#0D0D0D", fontFamily:"'Heebo',sans-serif", outline:"none", width:130, textAlign:"right", flexShrink:0 }}

                    const devPct = (statsRows||[]).filter(r=>(r.field||"").includes("פיתוח")||(r.field||"").includes("נוף")).reduce((s,r)=>s+Number(r.pct||0),0);

                    return fee ? <span style={{ fontSize:12, color:"#444444" }}>{fmt(fee)}</span> : <span style={{ fontSize:11, color:"#9A9A9A" }}>—</span>;
                  })()}
                </td>

                {/* הערות */}
                <td style={{ padding:"10px 12px", minWidth:160 }}>
                  <input value={c.notes} onChange={e => updateC(c.id,"notes",e.target.value)}
                    placeholder="הערות על הבחירה..."
                    style={{ background:"transparent", border:"1px solid #E2E5EA", borderRadius:4, padding:"5px 9px", fontSize:13, color:"#767676", fontFamily:"'Heebo',sans-serif", outline:"none", width:"100%" }}
                    onFocus={e => e.target.style.borderColor="#0B1F3A"}

                </td>

                <td style={{ padding:"10px 8px", textAlign:"center", width:60 }}>
                  <input type="checkbox" checked={!!c.sentToMunicipality} onChange={e => {
