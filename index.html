                    if (e.target.checked) onSentToMunicipality?.(c);
                  }}
                    style={{ width:16, height:16, cursor:"pointer", accentColor:"#444444" }} />
                </td>
                {/* אושר היועץ */}
                <td style={{ padding:"10px 8px", textAlign:"center", width:60 }}>
                  <input type="checkbox" checked={!!c.approved} onChange={e => { updateC(c.id,"approved",e.target.checked); if (e.target.checked) onApproved?.(c); }}
                    style={{ width:16, height:16, cursor:"pointer", accentColor:"#444444" }} />
                </td>
                {/* מחק */}
                <td style={{ padding:"10px 12px" }}>
                  <button onClick={() => delConsultant(c.id)}
                    style={{ background:"none", border:"none", cursor:"pointer", color:"#5C2020", fontSize:16, padding:"2px 4px" }}>🗑️</button>
                </td>
              </tr>
              {expandedSubs[c.id] && (<>
                {(c.subItems||[]).map(it => (
                  <tr key={it.id} style={{ background:"#F7F8FA", borderBottom:"1px solid #EAF1FA" }}>
                    <td style={{ padding:"6px 12px" }} />
                    <td />
                    <td style={{ padding:"6px 12px" }}>
                      <input value={it.description} onChange={e=>updateSubItem(c.id,it.id,"description",e.target.value)}
                        placeholder="תיאור סעיף..." style={{ width:"100%", border:"1px solid #E2E5EA", borderRadius:4, padding:"4px 8px", fontSize:12, fontFamily:"'Heebo',sans-serif", outline:"none", background:"#fff", color:"#3A3A3A" }}
                        onFocus={e=>e.target.style.borderColor="#0B1F3A"} onBlur={e=>e.target.style.borderColor="#E2E5EA"} />
                    </td>
                    <td style={{ padding:"6px 12px" }} />
                    <td style={{ padding:"6px 8px" }}>
                      <div style={{ display:"flex", alignItems:"center", gap:3, direction:"rtl" }}>
                        <span style={{ color:"#767676", fontSize:12 }}></span>
                        <input type="text" inputMode="decimal" value={it.amount} onChange={e=>updateSubItem(c.id,it.id,"amount",e.target.value)}
                          placeholder="0" style={{ width:65, border:"1px solid #E2E5EA", borderRadius:4, padding:"4px 7px", fontSize:12, fontFamily:"'Heebo',sans-serif", outline:"none", textAlign:"right", background:"#fff" }}
                          onFocus={e=>e.target.style.borderColor="#0B1F3A"} onBlur={e=>e.target.style.borderColor="#E2E5EA"} />
                      </div>
                    </td>
                    {showAmtCol && <td />}
                    <td /><td />
                    <td style={{ padding:"4px 8px", textAlign:"center" }}>
                      <label style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:2, cursor:"pointer", fontSize:10, color:"#767676", fontFamily:"'Heebo',sans-serif" }}>
                        <input type="checkbox" checked={!!it.planOnly} onChange={e=>updateSubItem(c.id,it.id,"planOnly",e.target.checked)} style={{ cursor:"pointer" }} />
                        <span>תכנון</span>
                      </label>
                    </td>
                    <td style={{ padding:"6px 12px" }}>
                      <button onClick={()=>delSubItem(c.id,it.id)} style={{ background:"none", border:"none", cursor:"pointer", color:"#5C2020", fontSize:14, padding:"2px 4px" }}>🗑️</button>
                    </td>
                  </tr>
                ))}
                <tr style={{ background:"#F7F8FA", borderBottom:"1px solid #B8CEED" }}>
                  <td /><td />
                  <td style={{ padding:"4px 12px" }}>
                    <button onClick={()=>addSubItem(c.id)}
                      style={{ background:"none", border:"1px dashed #D0D5DD", borderRadius:4, padding:"2px 10px", fontSize:11, color:"#767676", cursor:"pointer", fontFamily:"'Heebo',sans-serif" }}>
                      + הוסף סעיף
                    </button>
                  </td>
                  <td /><td />{showAmtCol && <td />}<td /><td /><td /><td />
                </tr>
              </>)}
              </React.Fragment>
            ))}
          </tbody>
        </table>
          );
        })()}
      </div>

      {/* מודל מייל לתחום */}
      {showEmailModal && (() => {
        const { bcc, bccEmails, subject, body, mailtoLink } = buildFieldMailData();
        const scopeText = getScopeText();
        return (
          <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.45)", zIndex:9999, display:"flex", alignItems:"center", justifyContent:"center" }}
               onClick={() => setShowEmailModal(false)}>
            <div style={{ background:"#fff", borderRadius:4, padding:28, maxWidth:620, width:"95%", maxHeight:"90vh", overflowY:"auto", boxShadow:"0 8px 40px rgba(0,0,0,0.18)", direction:"rtl", fontFamily:"'Heebo',sans-serif" }}
                 onClick={e => e.stopPropagation()}>
              <div style={{ fontWeight:800, fontSize:17, marginBottom:14, color:"#0D0D0D" }}>הזמנה להגשת הצ"מ — {field.fieldName}</div>

              <div style={{ marginBottom:8, fontSize:13 }}>
                <span style={{ fontWeight:700, color:"#444444" }}>BCC ({bccEmails.length} יועצים): </span>
                {bcc ? <span style={{ color:"#163356", wordBreak:"break-all" }}>{bcc}</span>
                     : <span style={{ color:"#5C2020", fontWeight:600 }}>לא נמצאו יועצים ללא המלצה עם כתובת מייל בתחום זה</span>}
              </div>

              <div style={{ marginBottom:12, fontSize:13 }}>
                <span style={{ fontWeight:700, color:"#444444" }}>נושא: </span>
                <span>{subject}</span>
              </div>

              <div style={{ marginBottom:4, fontSize:12, fontWeight:700, color:"#444444" }}>גוף המייל:</div>
              <div style={{ background:"#F7F8FA", border:"1.5px solid #E2E5EA", borderRadius:8, padding:"12px 14px", fontSize:13, whiteSpace:"pre-wrap", direction:"rtl", textAlign:"right", maxHeight:180, overflowY:"auto", color:"#0D0D0D", lineHeight:1.7, marginBottom:12 }}>
                {body}
              </div>

              <div style={{ display:"flex", gap:10, justifyContent:"flex-end", flexWrap:"wrap" }}>
                <button onClick={() => setShowEmailModal(false)}
                  style={{ padding:"8px 18px", borderRadius:4, border:"1.5px solid #E2E5EA", background:"#F7F8FA", fontSize:13, fontWeight:600, cursor:"pointer", fontFamily:"'Heebo',sans-serif", color:"#444444" }}>
                  סגור
                </button>
                <button onClick={downloadScopeEml}
                  style={{ padding:"8px 22px", borderRadius:4, border:"none", background:"#0B1F3A", fontSize:13, fontWeight:700, cursor:"pointer", fontFamily:"'Heebo',sans-serif", color:"#fff" }}>
                  📧 פתח ב-Outlook
                </button>
              </div>
              <div style={{ marginTop:8, padding:"8px 12px", background:"#FAF2E6", border:"1px solid #F0D4B0", borderRadius:4, fontSize:12, color:"#5C3D10", textAlign:"right" }}>
                לאחר פתיחת Outlook — הדבק את הגוף בשדה הטקסט (Ctrl+V)
              </div>
            </div>
          </div>
        );
      })()}
    </Card>
  );
}

// ── Tab: רשימת יועצים ─────────────────────────────────────────────────────────
function ConsultantModal({ consultant, onClose, onSave, budgetState, statsRows, scrollToIncreaseId, suppliers, openingData, setOpeningData, projectMeta, milestones, localMilestones, companyId, consultantUtilPct, managers, pendingBimAmount, onClearPendingBim }) {
  const [inc, setInc] = useState({ reason:"", amount:"", date:"", planOnly:false });
  const [increases, _setIncreases] = useState(consultant?.increases || []);
  const [approvalModal, setApprovalModal] = useState(null);
  const [showEstForm, setShowEstForm] = useState(false);
  const [newEstAmount, setNewEstAmount] = useState("");
  const [newSectAmount, setNewSectAmount] = useState("");
  const [estDate, setEstDate] = useState(new Date().toISOString().split("T")[0]);

  const initContacts = () => {
    if (consultant?.contacts?.length > 0) return consultant.contacts;
    const sm = (suppliers||[]).find(s => s.name === consultant?.name);
    if (sm && sm.contacts?.length > 0) return sm.contacts.map(c => ({ ...c, name: c.contact||c.name||"", isFromSupplier:true }));
    return [{ id:Date.now(), name:"", phone:"", phone2:"", email:"", isFromSupplier:false }];
  };
  const [contacts, _setContacts] = useState(initContacts);
  const [exportNotes, _setExportNotes] = useState(consultant?.exportNotes || "");
  const supplierMatch = (suppliers||[]).find(s => s.name === consultant?.name);

  // צפייה-בלבד: כל שינוי מקומי במודל היועץ (הגדלות/BIM/אישורים/אנשי קשר/הערות) חסום ליוזר רגיל.
  // סנכרון התצוגה משתמש ב-setter הגולמי כדי שהנתונים עדיין יוצגו לצפייה.
  const _roCM = () => typeof window !== "undefined" && window.__costpilotReadOnly;
  const setIncreases   = v => { if (_roCM()) return; _setIncreases(v); };
  const setContacts    = v => { if (_roCM()) return; _setContacts(v); };
  const setExportNotes = v => { if (_roCM()) return; _setExportNotes(v); };

  React.useEffect(() => { _setIncreases(consultant?.increases || []); }, [consultant?.id]);

  // Apply pending BIM increase from TenderTab "הוסף" button on first mount
  React.useEffect(() => {
    if (!pendingBimAmount || pendingBimAmount <= 0) return;
    const withoutBIM = (consultant?.increases||[]).filter(x => !x.isBIM);
    const bimInc = { id:"bim-"+Date.now(), reason:"הגדלה עבור BIM (15%)", amount:String(pendingBimAmount),
      date:new Date().toISOString().split("T")[0], planOnly:true, isBIM:true,
      sentToManager:false, sentToMunicipality:false, approvedIncrease:false, createdAt:Date.now() };
    const newInc = [...withoutBIM, bimInc];
    setIncreases(newInc);
    onSave({ ...consultant, increases: newInc, contacts: consultant?.contacts||[], exportNotes: consultant?.exportNotes||"" });
    if (onClearPendingBim) onClearPendingBim();
  }, []); // eslint-disable-line react-hooks/exhaustive-deps

  if (!consultant) return null;

  const saveContacts = (newContacts, patch={}) => {
    if (typeof window !== "undefined" && window.__costpilotReadOnly) return; // צפייה-בלבד
    setContacts(newContacts);
    onSave({ ...consultant, increases, contacts: newContacts, exportNotes, ...patch });
  };
  const addContact = () => saveContacts([...contacts, { id:Date.now(), name:"", phone:"", phone2:"", email:"", isFromSupplier:false }]);
  const delContact = id => saveContacts(contacts.filter(c => c.id !== id));
  const updContact = (id, key, val) => saveContacts(contacts.map(c => c.id===id ? {...c,[key]:val} : c));

  const saveIncreases = (newInc) => {
    if (typeof window !== "undefined" && window.__costpilotReadOnly) return; // צפייה-בלבד: אין אישור/הגדלה/מחיקה
    setIncreases(newInc);
    onSave({ ...consultant, increases: newInc, contacts, exportNotes });
  };

  const _subTotal = (consultant.subItems||[]).length > 0 ? (consultant.subItems||[]).reduce((s,it)=>s+Number(it.amount||0),0) : null;
  const baseVal   = _subTotal !== null ? _subTotal : (Number(consultant.value || 0) || Number(consultant.contractFee || 0) || consultant._liveFee || 0);
  // Only approved increases count toward totals
  const totalInc  = increases.filter(x => x.approvedIncrease).reduce((s,x) => s + Number(x.amount||0), 0);

  // BIM — 15% of planning-phase portion (milestones with planOnly=true)
  // _liveFee = actual ₪ fee (same as initialFee in ContractorTab); baseVal for % consultants is the % not ₪
  const baseFee = consultant._liveFee ?? baseVal;
  const consultantField = (consultant.field || consultant.role || "").trim();
  const effectiveMilestones = consultantField
    ? ((localMilestones||{})[consultantField] || findMilestoneTemplate(milestones, companyId, consultantField) || [])
    : [];
  const planningPct = effectiveMilestones.filter(m => m.planOnly).reduce((s,m) => s + Number(m.pct||0), 0);
  const bimAmount = Math.round(baseFee * planningPct / 100 * 0.15);
  const bimEnabled = increases.some(x => x.isBIM);
  const toggleBIM = (enabled) => {
    const withoutBIM = increases.filter(x => !x.isBIM);
    if (enabled) {
      const bimInc = { id: "bim-" + Date.now(), reason: "הגדלה עבור BIM (15%)", amount: String(bimAmount), date: new Date().toISOString().split("T")[0], planOnly: true, isBIM: true, sentToManager: false, sentToMunicipality: false, approvedIncrease: false, createdAt: Date.now() };
      const newInc = [...withoutBIM, bimInc];
      setIncreases(newInc);
      onSave({ ...consultant, increases: newInc, contacts, exportNotes });
    } else {
      setIncreases(withoutBIM);
      onSave({ ...consultant, increases: withoutBIM, contacts, exportNotes });
    }
  };

  React.useEffect(() => {
    if (scrollToIncreaseId) {
      setTimeout(() => {
        const el = document.getElementById("inc-" + scrollToIncreaseId);
        if (el) {
          el.scrollIntoView({ behavior:"smooth", block:"center" });
          el.classList.add("row-highlight");
          setTimeout(() => el.classList.remove("row-highlight"), 2000);
        }
      }, 350);
    }
  }, [scrollToIncreaseId]);

  // ── Architect calculation ───────────────────────────────────────────────────
  const isArchitect = ["אדריכל","אדריכלות","אדריכלים"].includes((consultant.role||"").trim()) && consultant.payType === "אחוזים";
  const archCalc = (() => {
    if (!isArchitect) return null;
    const contractorEst = Number(String((openingData||{}).contractorEst||"").replace(/,/g,"")) || Number((budgetState||{}).contractorEst || 0);
    if (!contractorEst) return null;
    const devPct    = (statsRows||[]).filter(r=>(r.field||"").includes("פיתוח")||(r.field||"").includes("נוף")).reduce((s,r)=>s+Number(r.pct||0),0);
    const devAmount = contractorEst * devPct / 100;
    const archBaseAuto = contractorEst - contractorEst * devPct / 100;
    // השתמש בערך ידני מפתיחת פרויקט אם קיים
    const manualArchBaseRaw = String(openingData?.archBase||"").replace(/[,\s]/g,"").replace(/[^\d.]/g,"");
    const manualArchBase = manualArchBaseRaw ? Number(manualArchBaseRaw) : 0;
    const archBase = manualArchBase > 0 ? manualArchBase : archBaseAuto;
    const archPct   = Number(consultant.value || 0);
    const archFee   = archBase * archPct / 100;
    return { contractorEst, devPct, devAmount, archBase, archBaseAuto, archPct, archFee, manualBase: manualArchBase > 0 };
  })();

  // ── Project Manager calculation ──────────────────────────────────────────────
  const isPM = (consultant.role||"").includes("מנהל פרויקט") && consultant.payType === "אחוזים";
  const pmCalc = (() => {
    if (!isPM) return null;
    const globalEst = Number((budgetState||{}).contractorEst || 0);
    if (!globalEst) return null;
    const pmPct = Number(consultant.value || 0);
    const hist = consultant.contractorEstHistory;
    const contractorEst = (hist?.length > 0) ? Number(hist[hist.length-1].amount) : globalEst;
    const pmFee = contractorEst * pmPct / 100;
    return { contractorEst, pmPct, pmFee };
  })();

  // ── Other consultants (pct, not arch/PM) calculation ────────────────────────
  const isOtherPct = consultant.payType === "אחוזים" && !isArchitect && !isPM;
  const otherCalc = (() => {
    if (!isOtherPct) return null;
    const contractorEst = Number((budgetState||{}).contractorEst || 0);
    if (!contractorEst) return null;
    const profPct    = profStatPct(statsRows, consultant.role);
    if (!profPct) return { contractorEst, profPct: 0, profBase: 0, conPct: Number(consultant.value||0), conFee: 0, noProfPct: true };
    const profBase   = contractorEst * profPct / 100;
    const conPct     = Number(consultant.value || 0);
    const conFee     = profBase * conPct / 100;
    return { contractorEst, profPct, profBase, conPct, conFee, noProfPct: false };
  })();

  // פירוט חישוב שכר הטרחה הבסיסי למיילי הגדלות — לוגיקה משותפת עם התזכורות
  const feeBreakdownLines = () => buildFeeBreakdownLines(consultant, openingData, budgetState, statsRows);

  const calcSupplement = (newEst) => {
    // הערך הישן = הערך האחרון בהיסטוריה, או הבסיס המקורי מפתיחת הפרויקט
    const getOldBase = (histKey, fallback) => {
      const hist = (consultant[histKey]||[]).length > 0 ? consultant[histKey] : (openingData?.[histKey] || []);
      return hist.length > 0 ? Number(hist[hist.length-1].amount) : fallback;
    };
    if (isArchitect && archCalc) {
      if (!newEst) return 0;
      const oldBase = getOldBase("archBaseHistory", archCalc.archBase);
      if (!oldBase) return 0;
      return (newEst - oldBase) * archCalc.archPct / 100;
    }
    if (isOtherPct && otherCalc && !otherCalc.noProfPct) {
      const newSect = Number(String(newSectAmount).replace(/[,\s]/g,"").replace(/[^\d.]/g,""));
      if (!newSect) return 0;
      const oldSect = getOldBase("sectionEstHistory", Math.round(otherCalc.profBase));
      if (!oldSect) return 0;
      return (newSect - oldSect) * otherCalc.conPct / 100;
    }
    if (!newEst) return 0;
    const oldEst = getOldBase("contractorEstHistory", Number(String(openingData?.contractorEst||"").replace(/,/g,"")));
    if (!oldEst) return 0;
    const diff = newEst - oldEst;
    if (!diff) return 0;
    if (isPM && pmCalc) return diff * pmCalc.pmPct / 100;
    return 0;
  };

  const saveNewEst = () => {
    if (typeof window !== "undefined" && window.__costpilotReadOnly) return; // צפייה-בלבד
    const newEst = Number(String(newEstAmount).replace(/[,\s]/g,"").replace(/[^\d.]/g,""));

    // אם ליועץ יש הגדלת BIM — עדכון האומדן פותח אוטומטית גם הגדלת BIM נוספת
    // על השינוי (זהה לחישוב בטאב מכרז: תוספת × planningPct/100 × 0.15).
    const buildBimSupplement = (supplement) => {
      if (!bimEnabled || planningPct <= 0) return null;
      const bimSupp = Math.round(supplement * planningPct / 100 * 0.15);
      if (!bimSupp) return null;
      return {
        reason: "תוספת הגדלה עבור BIM לאחר עדכון אומדן",
        amount: String(bimSupp), date: estDate, planOnly: true,
        id: "bim-" + Date.now(), createdAt: Date.now(),
        sentToManager: false, sentToMunicipality: false, approvedIncrease: false,
      };
    };

    // ─── isOtherPct: שמור אומדן פרק ישיר ב-sectionEstHistory ───
    if (isOtherPct && otherCalc && !otherCalc.noProfPct) {
      const newSect = Number(String(newSectAmount).replace(/[,\s]/g,"").replace(/[^\d.]/g,""));
      if (!newSect || !estDate) return;
      const histKey = "sectionEstHistory";
      const existingHist = (consultant[histKey]||[]).length > 0 ? consultant[histKey] : (openingData?.[histKey] || []);
      const origBase = Math.round(otherCalc.profBase);
      const oldBase = existingHist.length > 0 ? Number(existingHist[existingHist.length-1].amount) : origBase;
      const history = [...existingHist];
      if (history.length === 0 && origBase) history.push({ amount: origBase, effectiveDate: openingData?.contractorEstDate || "—", note:"ראשוני" });
      history.push({ amount: newSect, effectiveDate: estDate, note:"" });
      const currentFee = otherCalc.conFee || 0;
      const contractFee = consultant.contractFee || (currentFee > 0 ? currentFee : undefined);
      const supplement = calcSupplement(newEst);
      const reasonLabel = `${oldBase.toLocaleString("he-IL")} ← ${newSect.toLocaleString("he-IL")} `;
      const newIncrease = supplement !== 0 ? {
        reason: `עדכון אומדן פרק: ${reasonLabel}`,
        amount: supplement.toFixed(2), date: estDate, planOnly: false,
        id: Date.now(), createdAt: Date.now(),
        sentToManager:false, sentToMunicipality:false, approvedIncrease:false,
      } : null;
      const bimIncrease = newIncrease ? buildBimSupplement(supplement) : null;
      const newIncreases = [...increases,
        ...(newIncrease ? [newIncrease] : []),
        ...(bimIncrease ? [bimIncrease] : [])];
      if (newIncrease || bimIncrease) setIncreases(newIncreases);
      onSave({ ...consultant, increases: newIncreases, contacts, exportNotes, [histKey]: history, ...(contractFee ? { contractFee } : {}) });
      setShowEstForm(false); setNewEstAmount(""); setNewSectAmount("");
      return;
    }

    if (!newEst || !estDate) return;

    // ─── ערכי הבסיס בפתיחת פרויקט לא משתנים לעולם ───
    // ההיסטוריה נשמרת ברמת היועץ (לא ב-openingData)
    const histKey = isArchitect ? "archBaseHistory" : "contractorEstHistory";
    const existingHist = (consultant[histKey]||[]).length > 0 ? consultant[histKey] : (openingData?.[histKey] || []);

    // ערך ראשוני להיסטוריה (מפתיחת הפרויקט — לא משתנה)
    const origBase = (isArchitect && archCalc)
      ? archCalc.archBase
      : Number(String(openingData?.contractorEst||"").replace(/,/g,""));

    // הערך הישן לתיאור ההגדלה = האחרון בהיסטוריה, או הבסיס המקורי
    const oldBase = existingHist.length > 0
      ? Number(existingHist[existingHist.length-1].amount)
      : origBase;

    const history = [...existingHist];
    if (history.length === 0 && origBase) history.push({ amount: origBase, effectiveDate: openingData?.contractorEstDate || "—", note:"ראשוני" });
    history.push({ amount: newEst, effectiveDate: estDate, note:"" });

    // ההיסטוריה נשמרת ביועץ עצמו — openingData לא משתנה

    // קפא את סכום החוזה פעם אחת בלבד (בהגדרה הראשונה)
    const currentFee = (isArchitect && archCalc?.archFee) || (isPM && pmCalc?.pmFee) || (isOtherPct && otherCalc?.conFee) || 0;
    const contractFee = consultant.contractFee || (currentFee > 0 ? currentFee : undefined);

    const supplement = calcSupplement(newEst);
    const reasonLabel = isOtherPct && otherCalc?.profPct
      ? `${Math.round(oldBase * otherCalc.profPct / 100).toLocaleString("he-IL")} ← ${Math.round(newEst * otherCalc.profPct / 100).toLocaleString("he-IL")} `
      : `${oldBase.toLocaleString("he-IL")} ← ${newEst.toLocaleString("he-IL")} `;

    const newIncrease = supplement !== 0 ? {
      reason: `עדכון אומדן ${isOtherPct ? "פרק" : "קבלני"}: ${reasonLabel}`,
      amount: supplement.toFixed(2), date: estDate, planOnly: false,
      id: Date.now(), createdAt: Date.now(),
      sentToManager:false, sentToMunicipality:false, approvedIncrease:false,
    } : null;
    const bimIncrease = newIncrease ? buildBimSupplement(supplement) : null;
    const newIncreases = [...increases,
      ...(newIncrease ? [newIncrease] : []),
      ...(bimIncrease ? [bimIncrease] : [])];
    if (newIncrease || bimIncrease) setIncreases(newIncreases);
    onSave({ ...consultant, increases: newIncreases, contacts, exportNotes, [histKey]: history, ...(contractFee ? { contractFee } : {}) });

  const addIncrease = () => {

        const _bd = feeBreakdownLines();
        const _bdText = _bd.length ? `פירוט חישוב שכר הטרחה הבסיסי:\n${_bd.join("\n")}\n` : "";

        const _incOutro = "נא אישורכם להגדלה.\n\nבברכה,\nמערכת CostPilot";

        const htmlBody = buildEmailHtml(_incIntro, ["פרט", "סכום", "תאריך", "סטטוס"], tableRows, _incOutro, rowHighlights);
        setApprovalModal({ toEmail: _unitEmail, toName: _unitName, subject, body, htmlBody,

      }

    if (key === "sentToMunicipality" && val && projectMeta) {

        const approvedInc = updatedIncreases.filter(x => x.approvedIncrease).reduce((s,x) => s + Number(x.amount||0), 0);

        const subject = `פרויקט ${projectMeta.name||""} - אישור הגדלה ליועץ- ${_incField}`;

                { label:"סכום מאושר ("+(consultant.payType||"אחוזים")+")", val: (consultant.payType==="אחוזים" && _subTotal===null) ? (consultant.value ? consultant.value+"%" : "לא הוזן") : (baseVal ? fmt(baseVal) : "לא הוזן"), color:"#3A3A3A" },

                  { label:"בסיס לחישוב אדריכלות", val: fmt(archCalc.archBase), bold:true },
                  { label:`אחוז שכר טרחה אדריכל (${archCalc.archPct}%)`, val: `${archCalc.archPct}%`, sign:"×" },
                  { label:"שכר טרחה בסיסי לאדריכל", val: fmt(archCalc.archFee), bold:true, separator:true },

                  <div style={{ display:"flex", flexDirection:"column", gap:3, marginBottom: showEstForm?10:0 }}>
                    {hist.map((h,i) => (
                      <div key={i} style={{ display:"flex", gap:12, fontSize:12, color: i===(hist.length-1)?"#0D0D0D":"#9A9A9A", alignItems:"center" }}>
                        <button onClick={() => delHistEntry(i)} title="מחק שורה"
                          style={{ background:"none", border:"none", color:"#5C2020", cursor:"pointer", fontSize:12, padding:"0 2px", lineHeight:1, flexShrink:0 }}>✕</button>
                        <span>{fmtDate(h.effectiveDate)}</span>
                        <span style={{ fontWeight:700 }}>{Number(h.amount).toLocaleString("he-IL")}</span>
                        {h.note && <span>({h.note})</span>}
                        {i===hist.length-1 && <Badge color="#0E7C6A">נוכחי</Badge>}
                      </div>
                    ))}
                  </div>
                ) : (
                  <div style={{ fontSize:12, color:"#9A9A9A", marginBottom: showEstForm?10:0 }}>
                    אומדן נוכחי: <strong style={{color:"#0D0D0D"}}>{curVal.toLocaleString("he-IL")}</strong>
                  </div>
                );
              })()}
              {showEstForm && (() => {
                const newEst = Number(String(newEstAmount).replace(/[,\s]/g,"").replace(/[^\d.]/g,""));
                const newSect = Number(String(newSectAmount).replace(/[,\s]/g,"").replace(/[^\d.]/g,""));
                const supp = (isOtherPct ? newSect : newEst) ? calcSupplement(newEst) : 0;
                const showSect = isOtherPct && otherCalc && !otherCalc.noProfPct;
                const profPct = otherCalc?.profPct || 0;
                const handleContractorChange = e => {
                  const raw = e.target.value;
                  setNewEstAmount(raw);
                  if (showSect && profPct > 0) {
                    const num = Number(raw.replace(/[,\s]/g,"").replace(/[^\d.]/g,""));
                    setNewSectAmount(num > 0 ? Math.round(num * profPct / 100).toString() : "");
                  }
                };
                const handleSectChange = e => {
                  const raw = e.target.value;
                  setNewSectAmount(raw);
                  if (profPct > 0) {
                    const num = Number(raw.replace(/[,\s]/g,"").replace(/[^\d.]/g,""));
                    setNewEstAmount(num > 0 ? Math.round(num * 100 / profPct).toString() : "");
                  }
                };
                const cols = showSect ? "1fr 1fr 1fr" : "1fr 1fr";
                return (
                  <div style={{ background:"#EAF1FA", borderRadius:4, padding:"10px 12px", border:"1.5px dashed #B8CEED" }}>
                    <div style={{ display:"grid", gridTemplateColumns:cols, gap:8, marginBottom:8, alignItems:"end" }}>
                      <div>
                        <label style={{ fontSize:11, fontWeight:700, color:"#767676", display:"block", marginBottom:1 }}>
                          {isArchitect && archCalc?.manualBase ? "ערך מבנה חדש לאדריכל  *" : "אומדן קבלני חדש  *"}
                        </label>
                        {isArchitect && (
                          <div style={{ fontSize:10, color:"#767676", marginBottom:3 }}>הערך לא יכלול פרקי פיתוח</div>
                        )}
                        <input value={newEstAmount} onChange={handleContractorChange}
                          placeholder="0" autoFocus={!showSect}
                          style={{ width:"100%", padding:"5px 8px", border:"1px solid #D0D5DD", borderRadius:4, fontSize:12, fontFamily:"'Heebo',sans-serif", outline:"none", boxSizing:"border-box" }} />
                      </div>
                      {showSect && (
                        <div>
                          <label style={{ fontSize:11, fontWeight:700, color:"#163356", display:"block", marginBottom:3 }}>
                            {'אומדן פרק חדש'}
                          </label>
                          <input value={newSectAmount} onChange={handleSectChange}
                            placeholder={otherCalc?.profBase ? Math.round(otherCalc.profBase).toLocaleString("he-IL") : "0"}
                            autoFocus
                            style={{ width:"100%", padding:"5px 8px", border:"1.5px solid #B8CEED", borderRadius:4, fontSize:12, fontFamily:"'Heebo',sans-serif", outline:"none", boxSizing:"border-box", background:"#F7F8FA" }} />
                        </div>
                      )}
                      <div>
                        <label style={{ fontSize:11, fontWeight:700, color:"#767676", display:"block", marginBottom:3 }}>תאריך תחולה *</label>
                        <FlatpickrDate value={estDate} onChange={v=>setEstDate(v)}
                          style={{ width:"100%", padding:"5px 8px", border:"1px solid #D0D5DD", borderRadius:4, fontSize:12, fontFamily:"'Heebo',sans-serif", outline:"none" }} />
                      </div>
                    </div>
                    {newEst > 0 && supp !== 0 && (
                      <div style={{ fontSize:12, marginBottom:8, padding:"6px 10px", borderRadius:4, background: supp>0?"#EFF7F3":"#F8EDED" }}>
                        הגדלה שתיווצר אוטומטית: <strong style={{ color: supp>0?"#0E7C6A":"#5C2020" }}>{Math.round(supp).toLocaleString("he-IL")} </strong>
                      </div>
                    )}
                    <div style={{ display:"flex", gap:8 }}>
                      <button onClick={saveNewEst}
                        style={{ background:"#0B1F3A", color:"#fff", border:"none", borderRadius:4, padding:"6px 14px", fontSize:12, fontWeight:700, cursor:"pointer", fontFamily:"'Heebo',sans-serif" }}>
                        שמור{supp!==0?" + צור הגדלה":""}
                      </button>
                      <button onClick={()=>{ setShowEstForm(false); setNewSectAmount(""); }}
                        style={{ background:"#F0F2F5", color:"#767676", border:"none", borderRadius:4, padding:"6px 10px", fontSize:12, cursor:"pointer", fontFamily:"'Heebo',sans-serif" }}>
                        ביטול
                      </button>
                    </div>
                  </div>
                );
              })()}
            </div>
          )}

          {/* Increases list */}
          {increases.length > 0 && (
            <div>
              <div style={{ fontSize:12, fontWeight:700, color:"#9A9A9A", letterSpacing:1, marginBottom:8 }}>פירוט הגדלות</div>
              <div style={{ border:"1px solid #E2E5EA", borderRadius:10, overflow:"hidden", direction:"rtl" }}>
                {/* כותרות */}
                <div style={{ display:"grid", gridTemplateColumns:"1fr 160px 160px 80px", borderBottom:"2px solid #E2E5EA", background:"#F7F8FA" }}>
                  {["סיבת ההגדלה","סכום","תאריך","תכנון בלבד"].map((h,i) => (
                    <div key={i} style={{ padding:"8px 12px", fontSize:11, fontWeight:700, color:"#767676", textAlign:"right" }}>{h}</div>
                  ))}
                </div>
                {increases.map((x, ri) => (
                  <div key={x.id} id={"inc-" + x.id} style={{ display:"grid", gridTemplateColumns:"1fr 160px 160px 80px", borderBottom:ri<increases.length-1?"1px solid #E2E5EA":"none", background:"#fff" }}>
                    {/* עמודה 1: סיבה + הועבר לאישור מנהל */}
                    <div style={{ padding:"10px 12px", borderLeft:"1px solid #F0F2F5" }}>
                      <div style={{ display:"flex", alignItems:"center", direction:"rtl", gap:8, marginBottom:6 }}>
                        {!x.approvedIncrease && <DeleteButton onClick={() => delIncrease(x.id)} />}
                        <span style={{ fontWeight:600, fontSize:13, color:"#0D0D0D" }}>{x.reason}</span>
                      </div>
                      <label style={{ display:"flex", alignItems:"center", gap:5, fontSize:12, fontWeight:400, color: x.sentToManager ? "#3A3A3A" : "#9A9A9A", cursor:"pointer", display:"flex", alignItems:"center", gap:5, direction:"rtl" }}>
                        <input type="checkbox" checked={!!x.sentToManager} onChange={e => updateIncrease(x.id,"sentToManager",e.target.checked)}
                          style={{ width:13, height:13, accentColor:"#767676", cursor:"pointer", flexShrink:0 }} />
                        הועבר לאישור מנהל
                      </label>
                    </div>
                    {/* עמודה 2: סכום + הועבר לחברה העירונית */}
                    <div style={{ padding:"10px 12px", borderLeft:"1px solid #F0F2F5" }}>
                      <div style={{ fontWeight:700, fontSize:13, color:"#0D0D0D", textAlign:"right", marginBottom:6 }}>{fmt(x.amount)}</div>
                      <label style={{ display:"flex", alignItems:"center", gap:5, fontSize:12, fontWeight:400, color: x.sentToMunicipality ? "#3A3A3A" : "#9A9A9A", cursor:"pointer", display:"flex", alignItems:"center", gap:5, direction:"rtl" }}>
                        <input type="checkbox" checked={!!x.sentToMunicipality} onChange={e => updateIncrease(x.id,"sentToMunicipality",e.target.checked)}
                          style={{ width:13, height:13, accentColor:"#767676", cursor:"pointer", flexShrink:0 }} />
                        הועבר לחברה העירונית
                      </label>
                    </div>
                    {/* עמודה 3: תאריך + ההגדלה אושרה */}
                    <div style={{ padding:"10px 12px", borderLeft:"1px solid #F0F2F5" }}>
                      <div style={{ fontSize:12, color:"#767676", textAlign:"right", marginBottom:6 }}>{x.date ? fmtDate(x.date) : "—"}</div>
                      <label style={{ display:"flex", alignItems:"center", gap:5, fontSize:12, fontWeight:400, color: x.approvedIncrease ? "#0E7C6A" : "#9A9A9A", cursor:"pointer", display:"flex", alignItems:"center", gap:5, direction:"rtl" }}>
                        <input type="checkbox" checked={!!x.approvedIncrease} onChange={e => updateIncrease(x.id,"approvedIncrease",e.target.checked)}
                          style={{ width:13, height:13, accentColor:"#0E7C6A", cursor:"pointer", flexShrink:0 }} />
                        ההגדלה אושרה
                      </label>
                    </div>
                    {/* עמודה 4: תכנון בלבד */}
                    <div style={{ padding:"10px 12px", borderLeft:"1px solid #F0F2F5", display:"flex", justifyContent:"flex-start", alignItems:"flex-start", direction:"rtl" }}>
                      <input type="checkbox" checked={!!x.planOnly} onChange={e => updateIncrease(x.id,"planOnly",e.target.checked)}
                        style={{ width:14, height:14, cursor:"pointer", marginTop:2 }} />
                    </div>

                  </div>
                ))}
              </div>
            </div>
          )}

          {/* סה"כ הגדלות */}
          {totalInc !== 0 && (
            <div style={{ padding:"11px 16px", background:"#F7F8FA", borderRadius:10, border:"1px solid #E2E5EA", display:"grid", gridTemplateColumns:"230px 1fr", alignItems:"center" }}>
              <span style={{ fontWeight:700, fontSize:13, color: totalInc < 0 ? "#5C2020" : "#3A3A3A", flex:1, textAlign:"right" }}>סה״כ הגדלות</span>
              <span style={{ fontWeight:800, fontSize:16, color: totalInc < 0 ? "#5C2020" : "#0D0D0D", minWidth:120, flexShrink:0, textAlign:"right" }}>{fmt(totalInc)}</span>
            </div>
          )}

          {/* סה"כ שכר טרחה כולל הגדלות */}
          {totalInc !== 0 && (
            <div style={{ padding:"11px 16px", background:"#F7F8FA", borderRadius:10, border:"1px solid #E2E5EA", display:"grid", gridTemplateColumns:"230px 1fr", alignItems:"center" }}>
              <span style={{ fontWeight:700, fontSize:13, color:"#3A3A3A", flex:1, textAlign:"right" }}>סה״כ שכר טרחה כולל הגדלות</span>
              <span style={{ fontWeight:800, fontSize:16, color:"#3A3A3A", minWidth:120, flexShrink:0, textAlign:"right" }}>
                {isArchitect && archCalc ? fmt(archCalc.archFee + totalInc)
                  : isPM && pmCalc ? fmt(pmCalc.pmFee + totalInc)
                  : isOtherPct && otherCalc ? fmt(otherCalc.conFee + totalInc)
                  : fmt(baseVal + totalInc)}
              </span>
            </div>
          )}

          {/* הגדלה עבור BIM */}
          <div style={{ display:"flex", alignItems:"center", gap:12, padding:"10px 14px", background:"#F7F8FA", border:"1.5px solid #E2E5EA", borderRadius:8, direction:"rtl" }}>
            <label style={{ display:"flex", alignItems:"center", gap:8, cursor:"pointer", flex:1 }}>
              <input type="checkbox" checked={bimEnabled} onChange={e => toggleBIM(e.target.checked)}
                style={{ width:15, height:15, cursor:"pointer", accentColor:"#0B1F3A", flexShrink:0 }} />
              <span style={{ fontSize:13, fontWeight:700, color:"#0D0D0D" }}>הגדלה עבור BIM</span>
            </label>
            {bimAmount > 0 && (
              <span style={{ fontSize:12, color:"#767676", whiteSpace:"nowrap" }}>
                15% × {fmt(baseFee * planningPct / 100)} = <strong style={{ color:"#0D0D0D" }}>{fmt(bimAmount)}</strong>
              </span>
            )}
          </div>

          {/* הוסף הגדלה */}
          <div>
            <div style={{ fontSize:12, fontWeight:700, color:"#9A9A9A", letterSpacing:1, marginBottom:8 }}>הוסף הגדלה</div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 120px 150px 80px auto", gap:10 }}>
              {/* כותרות */}
              <div style={{ fontSize:12, color:"#767676", fontWeight:600, textAlign:"right" }}>סיבת ההגדלה</div>
              <div style={{ fontSize:12, color:"#767676", fontWeight:600, textAlign:"right" }}>סכום </div>
              <div style={{ fontSize:12, color:"#767676", fontWeight:600, textAlign:"right" }}>תאריך</div>
              <div style={{ fontSize:12, color:"#767676", fontWeight:600, textAlign:"right" }}>תכנון בלבד</div>
              <div />
              {/* שדות */}
              <input value={inc.reason} onChange={e=>setInc({...inc,reason:e.target.value})}
                placeholder="לדוגמה: תוספת תכנון"
                style={{ background:"#F7F8FA", border:"1.5px solid #E2E5EA", borderRadius:4, padding:"8px 11px", fontSize:14, color:"#0D0D0D", fontFamily:"'Heebo',sans-serif", outline:"none", direction:"rtl" }}
                onFocus={e=>e.target.style.borderColor="#444444"} onBlur={e=>e.target.style.borderColor="#E2E5EA"} />
              <input type="number" value={inc.amount} onChange={e=>setInc({...inc,amount:e.target.value})}
                style={{ background:"#F7F8FA", border:"1.5px solid #E2E5EA", borderRadius:4, padding:"8px 11px", fontSize:14, color:"#0D0D0D", fontFamily:"'Heebo',sans-serif", outline:"none", textAlign:"right" }}
                onFocus={e=>e.target.style.borderColor="#444444"} onBlur={e=>e.target.style.borderColor="#E2E5EA"} />
              <FlatpickrDate value={inc.date} onChange={v=>setInc({...inc,date:v})}
                style={{ background:"#F7F8FA", border:"1.5px solid #E2E5EA", borderRadius:4, padding:"8px 11px", fontSize:14, color:"#0D0D0D", fontFamily:"'Heebo',sans-serif", outline:"none" }} />
              <div style={{ display:"flex", justifyContent:"center", alignItems:"center" }}>
                <input type="checkbox" checked={!!inc.planOnly} onChange={e=>setInc({...inc,planOnly:e.target.checked})}
                  style={{ width:16, height:16, cursor:"pointer" }} />
              </div>
              <PrimaryButton onClick={addIncrease}>+ הוסף</PrimaryButton>
            </div>
          </div>
        </div>
      </div>
    </div>
    </>
  );
}

function ConsultantsTab({ rows, setRows, quotesRows, budgetState, statsRows, openConsultantId, scrollToIncreaseId, suppliers, projectName, openingData, setOpeningData, projectMeta, milestones, localMilestones, companyId, consultantUtilPct, managers, pendingBimAmount, onClearPendingBim }) {
  const [openId, setOpenId] = useState(openConsultantId || null);
  const [search, setSearch] = useState("");

  React.useEffect(() => {
    if (openConsultantId) setOpenId(openConsultantId);
  }, [openConsultantId]);

  // Always enrich consultant with live value/payType/fee from quotes
  const enrich = (consultant) => {
    if (!quotesRows) return consultant;
    for (const fg of quotesRows) {
      for (const c of (fg.consultants || [])) {
        if ("q-"+c.id === consultant.id) {
          // Compute live fee exactly like AccountsTab so contractFee email is always accurate
          const cEst = Number(String((openingData||{}).contractorEst||"").replace(/,/g,"").replace(/[^\d.]/g,"")) || Number((budgetState||{}).contractorEst || 0);
          const dPct = (statsRows||[]).filter(r=>(r.field||"").includes("פיתוח")||(r.field||"").includes("נוף")).reduce((s,r)=>s+Number(r.pct||0),0);
          const archBaseManual = Number(String((openingData||{}).archBase||"").replace(/[,\s]/g,"").replace(/[^\d.]/g,""));
          const aBase = archBaseManual > 0 ? archBaseManual : cEst - cEst * dPct / 100;
          const isPct = (c.payType||"אחוזים") === "אחוזים";
          const isArch = isPct && ["אדריכל","אדריכלות","אדריכלים"].includes((fg.fieldName||"").trim());
          const isPMRole = isPct && (fg.fieldName||"").includes("מנהל פרויקט");
          const pct = Number(c.value||0) / 100;
          let liveFee = 0;
          if (c.subItems?.length > 0) liveFee = c.subItems.reduce((s,it)=>s+Number(it.amount||0),0);
          else if (!isPct) liveFee = Number(c.value||0);
          else if (isArch && cEst) liveFee = aBase * pct;
          else if (isPMRole && cEst) liveFee = cEst * pct;
          else if (cEst) { const pp = profStatPct(statsRows, fg.fieldName)/100; liveFee = cEst * pp * pct; }
          return { ...consultant, value: c.value, payType: c.payType || "אחוזים", _liveFee: liveFee, field: fg.fieldName || "" };
        }
      }
    }
    return consultant;
  };

  const open = (() => { const r = rows.find(r => r.id === openId); return r ? enrich(r) : null; })();

  const saveConsultant = updated => {
    setRows(prev => prev.map(r => r.id === updated.id ? updated : r));
  };

  const exportToExcel = () => {
    const dataRows = [];
    rows.forEach(r => {
      const sm = (suppliers||[]).find(s => s.name === r.name);
      const cts = r.contacts?.length > 0
        ? r.contacts.map(c => ({ name: c.name||c.contact||"", phone: c.phone||"", phone2: c.phone2||"", email: c.email||"" }))
        : sm?.contacts?.length > 0
          ? sm.contacts.map(c => ({ name: c.contact||"", phone: c.phone||"", phone2: c.phone2||"", email: c.email||"" }))
          : [{ name: r.contact||"", phone: r.phone||"", phone2: r.phone2||"", email: r.email||"" }];
      cts.forEach(ct => {
        dataRows.push([
          r.role||"", r.name||"",
          ct.name||"", ct.phone||"", ct.phone2||"", ct.email||"",
        ]);
      });
    });
    const esc = s => String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    const headers = ["תחום","שם משרד / יועץ","שם איש קשר","טלפון","נייד","מייל"];
    const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="UTF-8"/>
<xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>
<x:Name>יועצים</x:Name>
<x:WorksheetOptions><x:DisplayRightToLeft/></x:WorksheetOptions>
</x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml>
</head><body>
<table dir="rtl" style="border-collapse:collapse;font-family:Arial;font-size:13px;">
<tr><td colspan="6" style="font-size:15px;font-weight:bold;padding:8px 10px;background:#EAF1FA;border:1px solid #B8CEED;">${esc(projectName||"פרויקט")}</td></tr>
<tr>${headers.map(h=>`<th style="background:#163356;color:#fff;font-weight:bold;padding:7px 10px;border:1px solid #0B1F3A;">${esc(h)}</th>`).join("")}</tr>
${dataRows.map((row,i)=>`<tr style="background:${i%2===0?"#fff":"#FAFBFC"}">${row.map(v=>`<td style="border:1px solid #E2E5EA;padding:6px 10px;">${esc(v)}</td>`).join("")}</tr>`).join("")}
</table></body></html>`;
    const b64 = btoa(unescape(encodeURIComponent(html)));
    const a = document.createElement("a");
    a.href = "data:application/vnd.ms-excel;base64," + b64;
    a.download = `יועצים_${projectName||"פרויקט"}.xls`;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
  };

  return (
    <div style={{ display:"flex", flexDirection:"column", flex:1, overflow:"hidden" }}>
      <div style={{ flexShrink:0, padding:"26px 30px 0", display:"flex", flexDirection:"column", gap:18 }}>
      {/* Info banner + export button */}
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", gap:12, flexWrap:"wrap" }}>
        <div style={{ background:"#F7F8FA", border:"1px solid #E2E5EA", borderRadius:4, padding:"8px 18px", display:"flex", alignItems:"center", gap:10, fontSize:13, color:"#3A3A3A", flex:1 }}>
          <span style={{ fontSize:16, lineHeight:1 }}>ℹ️</span>
          <span>רשימה זו מתעדכנת אוטומטית — יועצים שאושרו בלשונית <strong>הצעות מחיר יועצים</strong> יופיעו כאן. לחץ על כרטיסייה לפרטים.</span>
        </div>
        {rows.length > 0 && (
          <button onClick={exportToExcel} className="allow-readonly"
            style={{ background:"#EFF7F3", border:"1px solid #C6E8D4", borderRadius:4, padding:"8px 14px", fontSize:13, color:"#1C4532", cursor:"pointer", fontFamily:"'Heebo',sans-serif", fontWeight:600, whiteSpace:"nowrap" }}>
            📥 ייצוא רשימת יועצים
          </button>
        )}
      </div>

      {rows.length > 0 && (
        <div style={{ position:"relative" }}>
          <span style={{ position:"absolute", right:12, top:"50%", transform:"translateY(-50%)", color:"#9A9A9A", fontSize:15 }}>🔍</span>
          <input value={search} onChange={e => setSearch(e.target.value)}
            placeholder="חיפוש לפי שם יועץ או תחום..."
            style={{ width:"100%", padding:"8px 38px 8px 12px", border:"1.5px solid #0B1F3A", borderRadius:4, fontSize:13, fontFamily:"'Heebo',sans-serif", outline:"none", boxSizing:"border-box", direction:"rtl" }} />
        </div>
      )}
      </div>
      <div style={{ flex:1, overflowY:"auto", minHeight:0, padding:"16px 30px 26px" }}>
      {rows.length === 0 ? (
        <Card style={{ textAlign:"right", padding:48, color:"#9A9A9A" }}>
          <div style={{ fontSize:36, marginBottom:12 }}>👥</div>
          <div style={{ fontSize:15, fontWeight:600, color:"#767676" }}>אין יועצים מאושרים עדיין</div>
          <div style={{ fontSize:13, marginTop:6 }}>אשר יועצים בלשונית "הצעות מחיר יועצים" כדי שיופיעו כאן</div>
        </Card>
      ) : (
        <Card style={{ padding:0, overflow:"hidden" }}>
          <table style={{ width:"100%", borderCollapse:"collapse", fontSize:13, direction:"rtl" }}>
            <thead>
              <tr style={{ background:"#F7F8FA", borderBottom:"2px solid #E2E5EA" }}>

                      </td>

                      <td style={{ padding:"10px 12px", color:"#3A3A3A", direction:"ltr", textAlign:"right" }}>{ct.phone||dash}</td>
                      <td style={{ padding:"10px 12px", color:"#3A3A3A", direction:"ltr", textAlign:"right" }}>{ct.phone2||dash}</td>

      {open && (

// ── DatePickerCell: DD/MM/YYYY date input independent of browser locale ────────
function DatePickerCell({ value, onChange, style }) {
  // value stored as YYYY-MM-DD internally
  const toISO  = (d,m,y) => y && m && d ? `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}` : "";
  const fromISO = iso => { if (!iso) return {d:"",m:"",y:""}; const [y,m,d]=iso.split("-"); return {d:String(Number(d)),m:String(Number(m)),y}; };

  const parts = fromISO(value);
  const [d, setD] = React.useState(parts.d);
  const [m, setM] = React.useState(parts.m);
  const [y, setY] = React.useState(parts.y);

  React.useEffect(() => {
    const p = fromISO(value);
    setD(p.d); setM(p.m); setY(p.y);
  }, [value]);

  const commit = (nd,nm,ny) => {
    const iso = toISO(nd,nm,ny);
    if (iso) onChange(iso);
  };

  const inp = (val, setter, max, next) => ({
    value: val,
    onChange: e => {
      const v = e.target.value.replace(/\D/g,"").slice(0,next==="y"?2:2);
      setter(v);
      if (v.length === 2 && next) document.getElementById(next)?.focus();
    },
    onBlur: e => {
      const v = e.target.value;
      commit(setter===setD?v:d, setter===setM?v:m, setter===setY?v:y);
    }
  });

  const base = { width:28, border:"none", borderBottom:"1.5px solid #D0D5DD", padding:"2px 2px",
    fontSize:11, fontFamily:"'Heebo',sans-serif", outline:"none", textAlign:"right",
    background:"transparent", ...style };

  return (
    <div style={{ display:"flex", alignItems:"center", gap:1, background:"#F7F8FA",
      border:"1px solid #E2E5EA", borderRadius:4, padding:"3px 6px", width:"fit-content" }}>
      <input id={"dp-d"} placeholder="DD" maxLength={2} {...inp(d,setD,31,"dp-m")} style={{...base}} />
      <span style={{ color:"#9A9A9A", fontSize:11 }}>/</span>
      <input id={"dp-m"} placeholder="MM" maxLength={2} {...inp(m,setM,12,"dp-y")} style={{...base}} />
      <span style={{ color:"#9A9A9A", fontSize:11 }}>/</span>
      <input id={"dp-y"} placeholder="YYYY" maxLength={4} value={y}
        onChange={e=>{ const v=e.target.value.replace(/\D/g,"").slice(0,4); setY(v); }}
        onBlur={e=>commit(d,m,e.target.value)}
        style={{...base, width:38, borderBottom:"1.5px solid #D0D5DD"}} />
    </div>
  );
}

// ── FlatpickrDate: date picker with DD/MM/YYYY format ──────────────────────
function FlatpickrDate({ value, onChange, style }) {
  const ref = useRef(null);
  const fpRef = useRef(null);
  const onChangeRef = useRef(onChange);
  onChangeRef.current = onChange; // always keep latest, no stale closure

  useEffect(() => {
    // Load flatpickr CSS + JS dynamically
    const loadFlatpickr = () => {
      if (window.flatpickr) { initFp(); return; }
      const link = document.createElement("link");
      link.rel = "stylesheet";
      link.href = "https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.css";
      document.head.appendChild(link);
      const script = document.createElement("script");
      script.src = "https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js";
      script.onload = initFp;
      document.head.appendChild(script);
    };
    const initFp = () => {
      if (fpRef.current) fpRef.current.destroy();
      fpRef.current = window.flatpickr(ref.current, {
        dateFormat: "d/m/Y",
        allowInput: true,
        locale: { firstDayOfWeek: 0 },
        onChange: ([date]) => {
          if (!date) return;
          // store as YYYY-MM-DD internally
          const y = date.getFullYear();
          const m = String(date.getMonth()+1).padStart(2,"0");
          const d = String(date.getDate()).padStart(2,"0");
          onChangeRef.current(`${y}-${m}-${d}`); // always calls latest onChange
        }
      });
      // set initial value
      if (value) {
        const [y,m,d] = value.split("-");
        if (y&&m&&d) fpRef.current.setDate(`${d}/${m}/${y}`, false);
      }
    };
    loadFlatpickr();
    return () => { if (fpRef.current) fpRef.current.destroy(); };
  }, []);

  // sync external value changes
  useEffect(() => {
    if (fpRef.current && value) {
      const [y,m,d] = value.split("-");
      if (y&&m&&d) fpRef.current.setDate(`${d}/${m}/${y}`, false);
    } else if (fpRef.current && !value) {
      fpRef.current.clear();
    }
  }, [value]);

  return (
    <input ref={ref} type="text" placeholder="DD/MM/YYYY" readOnly
      style={{ padding:"3px 5px", border:"1px solid #E2E5EA", borderRadius:4,
        fontSize:11, fontFamily:"'Heebo',sans-serif", outline:"none",
        background:"#fff", cursor:"pointer", width:105, ...style }} />
  );
}

// ── NumericCell: uncontrolled input that allows free typing ─────────────────
function NumericCell({ value, baseAmt, mode, onCommit, style, placeholder }) {
  const [focused, setFocused] = React.useState(false);
  // raw = plain number string for editing; displayed = formatted with commas
  const rawRef  = React.useRef(String(value||""));
  const dirtyRef = React.useRef(false); // true only when user actually typed
  const [display, setDisplay] = React.useState(String(value||""));

  // format a number string with commas, up to 1 decimal place for display
  const fmtNum = v => {
    const n = parseFloat(v);
    if (isNaN(n)) return v;
    return n.toLocaleString("he-IL", { minimumFractionDigits: 0, maximumFractionDigits: 1 });
  };

  // sync external value changes (only when not focused)
  React.useEffect(() => {
    if (!focused) {
      rawRef.current = String(value||"");
      setDisplay(value ? fmtNum(String(value)) : "");
    }
  }, [value, focused]);

  const handleFocus = () => {
    setFocused(true);
    dirtyRef.current = false; // reset — user hasn't typed yet
    // show raw number without commas for editing
    setDisplay(rawRef.current);
  };

  const handleChange = e => {
    setDisplay(e.target.value);
    rawRef.current = e.target.value;
    dirtyRef.current = true; // user actually typed
  };

  const handleBlur = () => {
    setFocused(false);
    const num = parseFloat(rawRef.current);
    if (isNaN(num)) {
      setDisplay("");
      if (dirtyRef.current) onCommit("", "");
      return;
    }
    // אחוז לא יכול לחרוג מ-100% — חוסמים ומחזירים לערך הקודם
    if (mode === "pct" && num > 100) {
      alert("האחוז לא יכול לעלות על 100%");
      const prev = String(value||"");
      rawRef.current = prev;
      setDisplay(prev ? fmtNum(prev) : "");
      return;
    }
    // Store exact value — no rounding
    const stored = String(num);
    rawRef.current = stored;
    setDisplay(fmtNum(stored));
    // Only update sibling field when user actually edited this field
    if (!dirtyRef.current) return;
    if (mode === "amount") {
      const pct = baseAmt ? String(num / baseAmt * 100) : "";
      onCommit(stored, pct);
    } else {
      const amt = baseAmt ? String(num / 100 * baseAmt) : "";
      onCommit(stored, amt);
    }
  };

  return (
    <input
      type="text"
      inputMode="decimal"
      value={display}
      onChange={handleChange}
      onFocus={handleFocus}
      onBlur={handleBlur}
      placeholder={placeholder||""}
      style={{ padding:"3px 5px", border:"1px solid #E2E5EA", borderRadius:4, fontSize:11,
        fontFamily:"'Heebo',sans-serif", outline:"none", textAlign:"right", ...style }}
    />
  );
}

// ── Tab: ריכוז חשבונות ────────────────────────────────────────────────────────
// Local-state textarea to avoid stale-closure single-char bug
function ReasonCell({ value, onCommit }) {
  const [local, setLocal] = React.useState(value);
  React.useEffect(() => { setLocal(value); }, [value]);
  return (
    <textarea value={local} onChange={e => setLocal(e.target.value)} onBlur={() => onCommit(local)}
      placeholder="סיבה" rows={2}
      style={{ width:140, minWidth:100, maxWidth:300, padding:"3px 5px", border:"1px solid #E2E5EA",
        borderRadius:4, fontSize:11, fontFamily:"'Heebo',sans-serif", outline:"none",
        resize:"vertical", direction:"rtl", overflow:"auto", boxSizing:"border-box" }} />
  );
}

function AccountsTab({ rows, setRows, quotesRows, consultantsRows, setConsultantsRows, budgetState, statsRows, companyId, companyName, milestones, openInvoiceId, onNavigate, openingData, localMilestones, setLocalMilestones, projectMeta, managers }) {

  const [selConsultant, setSelConsultant] = useState(null);
  const [expanded, setExpanded]           = useState({});
  const [editingMs, setEditingMs]         = useState(false);
  const [draftMs, setDraftMs]             = useState([]);
  const [approvalModal, setApprovalModal] = useState(null);
  const [cSearch, setCSearch] = useState("");

  // Map: consultantName → first field they appear in (for backward-compat with old invoices without fieldName)
  const firstFieldByName = {};
  (quotesRows||[]).forEach(fg => {
    (fg.consultants||[]).forEach(c => {
      if (!c.approved || !c.name?.trim()) return;
      if (!firstFieldByName[c.name.trim()]) firstFieldByName[c.name.trim()] = fg.fieldName||"";
    });
  });
  const invMatchesField = (r, field, name) =>
    r.consultantName === name &&
    (r.fieldName ? r.fieldName === field : (firstFieldByName[name]||"") === field);

  // ── Compute fees ──────────────────────────────────────────────────────────
  const contractorEst = Number(String((openingData||{}).contractorEst||"").replace(/,/g,"").replace(/[^\d.]/g,"")) || Number((budgetState||{}).contractorEst || 0);
  const devPct        = (statsRows||[]).filter(r=>(r.field||"").includes("פיתוח")||(r.field||"").includes("נוף")).reduce((s,r)=>s+Number(r.pct||0),0);
  const archBaseManual = Number(String((openingData||{}).archBase||"").replace(/[,\s]/g,"").replace(/[^\d.]/g,""));
  const archBase      = archBaseManual > 0 ? archBaseManual : contractorEst - contractorEst * devPct / 100;

  const consultantFees = [];
  (quotesRows||[]).forEach(fg => {
    (fg.consultants||[]).forEach(c => {
      if (!c.approved || !c.name?.trim()) return;
      const isPct    = (c.payType||"אחוזים") === "אחוזים";
      const isArch   = isPct && ["אדריכל","אדריכלות","אדריכלים"].includes((fg.fieldName||"").trim());
      const isPMRole = isPct && (fg.fieldName||"").includes("מנהל פרויקט");
      const pct      = Number(c.value||0) / 100;
      let fee = 0;
      if (c.subItems && c.subItems.length > 0) {
        fee = c.subItems.reduce((s,it)=>s+Number(it.amount||0),0);
      } else if (!isPct)                          fee = Number(c.value||0);
      else if (isArch   && contractorEst)  fee = archBase * pct;
      else if (isPMRole && contractorEst)  fee = contractorEst * pct;
      else if (contractorEst) {
        const profPct = profStatPct(statsRows, fg.fieldName) / 100;
        fee = contractorEst * profPct * pct;
      }
      const consultantRow = (consultantsRows||[]).find(r => r.id === "q-"+c.id);
      const increases = consultantRow?.increases || c.increases || [];
      const noClaims  = !!consultantRow?.noClaims;
      // יועץ %-י: תמיד חשב מחדש (האחוז מתעדכן עם האומדן); סכום קבוע: השתמש בערך הקפוא
      const contractFee = isPct ? fee : (consultantRow?.contractFee ?? fee);
      const approvedIncreases = increases.filter(x => x.approvedIncrease);
      const totalInc  = approvedIncreases.reduce((s,x)=>s+Number(x.amount||0),0);
      consultantFees.push({
        field: fg.fieldName||"", name: c.name.trim(),
        fee, contractFee, increases: approvedIncreases, totalInc, totalFee: contractFee + totalInc, noClaims,
        contact: c.contact||"", phone: c.phone||"", phone2: c.phone2||"", email: c.email||"",
        _consultantRowId: "q-"+c.id, subItems: c.subItems||[],
      });    });
  });
  consultantFees.sort((a,b) => String(Array.isArray(a.field)?a.field[0]||"":a.field||"").localeCompare(String(Array.isArray(b.field)?b.field[0]||"":b.field||""), 'he'));

  const sel = selConsultant
    ? consultantFees.find(c=>c.name===selConsultant.name && c.field===selConsultant.field)
    : null;

  // Navigate to invoice from dashboard - runs after consultantFees is ready
  React.useEffect(() => {
    if (!openInvoiceId || consultantFees.length === 0) return;
    const inv = rows.find(r => r.id === openInvoiceId);
    if (!inv) return;
    const consultant = consultantFees.find(c => c.name === inv.consultantName && c.field === inv.fieldName)
      || consultantFees.find(c => c.name === inv.consultantName);
    if (consultant) setSelConsultant(consultant);
    setExpanded(prev => ({ ...prev, [inv.rowKey]: true }));
    setTimeout(() => {
      const el = document.getElementById("inv-row-" + openInvoiceId);
      if (el) {
        el.scrollIntoView({ behavior:"smooth", block:"center" });
        el.classList.add("row-highlight");
        setTimeout(() => el.classList.remove("row-highlight"), 2000);
      }
    }, 600);
  }, [openInvoiceId, consultantFees.length]);

  const selField = (sel?.field||"").trim();
  const templateMilestones = (sel && companyId) ? (findMilestoneTemplate(milestones, companyId, selField) || []) : [];
  const hasLocalMs = sel ? (((localMilestones||{})[selField]?.length || 0) > 0) : false;
  const fieldMilestones = hasLocalMs ? (localMilestones[selField]||[]) : templateMilestones;
  // האם הצילום המקומי שונה מהתבנית הנוכחית (עריכה ידנית) או זהה לה (הקפאה אוטומטית בלבד)
  const localDiffersFromTemplate = hasLocalMs && (() => {
    const loc = (localMilestones||{})[selField] || [];
    if (loc.length !== templateMilestones.length) return true;
    const byId = Object.fromEntries(templateMilestones.map(m => [String(m.id), m]));
    return loc.some(m => {
      const t = byId[String(m.id)];
      return !t || String(t.name) !== String(m.name) || String(t.pct) !== String(m.pct) || !!t.planOnly !== !!m.planOnly;
    });
  })();
  const selSubItems = sel?.subItems||[];
  const useSubItems = selSubItems.length > 0;

  const openMsEditor = () => {
    setDraftMs(fieldMilestones.map(m => ({ ...m })));
    setEditingMs(true);
  };
  const saveMsLocal = () => {
    if (draftMs.length === 0) {
      const updated = { ...(localMilestones||{}) };
      delete updated[selField];
      setLocalMilestones(updated);
    } else {
      setLocalMilestones({ ...(localMilestones||{}), [selField]: draftMs });
    }
    setEditingMs(false);
  };
  const resetToTemplate = () => {
    const updated = { ...(localMilestones||{}) };
    delete updated[selField];
    setLocalMilestones(updated);
    setEditingMs(false);
  };

  const getInvoices   = key => rows.filter(r => invMatchesField(r, sel?.field||"", sel?.name||"") && r.rowKey===key);
  const addInvoice = (milestoneKey) => {
    if (!sel?.name) return;
    if (sel?.noClaims) return;
    // הקפאת אבני הדרך של התחום בחשבון הראשון — שינוי עתידי בתבנית הגלובלית לא ישפיע על פרויקט זה
    if (String(milestoneKey).startsWith("m-") && !hasLocalMs && templateMilestones.length > 0) {
      setLocalMilestones({ ...(localMilestones||{}), [selField]: templateMilestones.map(m => ({ ...m })) });
    }
    const newRow = {
      id:Date.now(), createdAt: Date.now(), pmPendingSince: Date.now(),
      consultantName:sel.name, fieldName:sel.field||"", rowKey:milestoneKey,
      invoiceNum:"", receiptDate:"", amount:"", pct:"",
      toMunicipality:false, toConsultant:false, rejected:false,
      reason:"", pmApproved:false, unitManagerApproved:false, pmEmailShown:false,
    };
    setRows(prev => [...prev, newRow]);
  };
  const updateInvoice = (id, patch) => {
    const extra = {};
    if (patch.pmApproved === true) extra.umPendingSince = Date.now();
    if (patch.toConsultant === true) extra.returnedAt = Date.now();
    if (patch.toMunicipality === true) extra.toMunicipalityPendingSince = Date.now();

  const sendForApproval = (invNum, stage) => {
    if (typeof window !== "undefined" && window.__costpilotReadOnly) return; // צפייה-בלבד: אין שליחה לאישור / פתיחת מייל
    if (!projectMeta || !sel) return;

      ...fieldMilestones.map(m => "m-"+m.id),
      ...(sel.increases||[]).map(x => "i-"+x.id),
      ...selSubItems.map(it => "s-"+it.id),
    ]);

      r.consultantName === (sel.name||"") &&
      (!r.fieldName || r.fieldName === (sel.field||"")) &&
      String(r.invoiceNum||"").trim() === String(invNum).trim()
    );
    if (invRows.length === 0) return;
    const totalAmt = invRows.reduce((s,r) => s + Number(r.amount||0), 0);
    const rowKeySet = new Set(invRows.map(r => r.rowKey));
    const subject = `פרויקט ${projectMeta.name} - אישור חשבון ליועץ- ${sel.field||""}`;
    const headers = ["אבן דרך", "% מחוזה", "% מצטבר שולם", "% מבוקש בחשבון", "סכום בחוזה בש\"ח", "שולם ", "יתרה ", "סכום חשבון "];
    const outro = "נא אישורכם לחשבון.\n\nבברכה,\nמערכת CostPilot";
    // שורות אבני דרך רגילות
    const msRows = useSubItems ? [] : fieldMilestones.map(m => {
      const key = "m-"+m.id;
      const baseFromAlloc = milestoneAllocation[key]?.baseAmt;

      const paid = rowTotal(key);

      } else {

    />
  );
}

// ── Shared helper: build the exact rows shown in BudgetTab ───────────────────
// Used by BOTH BudgetTab (display) and exportProjectToExcel (export).
// Export reads these rows directly - NO re-computation.
function buildBudgetAllRows({ quotesRows, consultantsRows, budgetState, statsRows, accountsRows, planOnlyMap, openingData }) {
  const contractorEst = Number((budgetState||{}).contractorEst || 0);
  const devPct        = (statsRows||[]).filter(r=>(r.field||"").includes("פיתוח")||(r.field||"").includes("נוף")).reduce((s,r)=>s+Number(r.pct||0),0);
  const archBaseManualB = Number(String((openingData||{}).archBase||"").replace(/[,\s]/g,"").replace(/[^\d.]/g,""));
  const archBase      = archBaseManualB > 0 ? archBaseManualB : contractorEst - contractorEst * devPct / 100;
  const computeFee = (field, payType, value) => {
    if (payType !== "אחוזים") return Number(value || 0);
    const pct = Number(value || 0) / 100;
    if (["אדריכל","אדריכלות","אדריכלים"].includes((field||"").trim()))      return archBase      * pct;
    if ((field||"").includes("מנהל פרויקט")) return contractorEst * pct;
    if (contractorEst) {
      const profPct = profStatPct(statsRows, field) / 100;
      return contractorEst * profPct * pct;
    }
    return 0;
  };
  // For old invoices without fieldName: attribute only to the first field this consultant appears in
  const firstFieldMap = {};
  (quotesRows || []).forEach(fg => {
    (fg.consultants || []).forEach(c => {
      if (!c.approved || !c.name?.trim()) return;
      const n = c.name.trim();
      if (!firstFieldMap[n]) firstFieldMap[n] = fg.fieldName || "";
    });
  });
  // Compute paid exactly as AccountsTab does: only invoices for approved increases (i-*), any milestone (m-*)
  const paidByConsultant = (name, field, approvedIncIds) =>
    (accountsRows || []).filter(r => {
      if (r.consultantName !== name || !r.unitManagerApproved || r.rejected) return false;
      if (r.fieldName ? r.fieldName !== field : (firstFieldMap[name] || "") !== field) return false;
      // Invoices for increases are only counted when that increase is approved
      if (r.rowKey && r.rowKey.startsWith("i-") && !approvedIncIds.has(r.rowKey)) return false;
      return true;
    }).reduce((s,r) => s + Number(r.amount||0), 0);
  const rows = [];
  (quotesRows || []).forEach(fg => {
    (fg.consultants || []).forEach(c => {
      if (!c.approved || !c.name?.trim()) return;
      const consultantEntry = (consultantsRows || []).find(r => r.id === "q-"+c.id);
      const approvedIncs = (consultantEntry?.increases || []).filter(x => x.approvedIncrease);
      const totalInc    = approvedIncs.reduce((s,x) => s + Number(x.amount||0), 0);
      const pendingInc  = (consultantEntry?.increases || []).filter(x => !x.approvedIncrease).reduce((s,x) => s + Number(x.amount||0), 0);
      const approvedIncIds = new Set(approvedIncs.map(x => "i-"+x.id));
      const computedFee = (c.subItems && c.subItems.length > 0)
        ? c.subItems.reduce((s,it)=>s+Number(it.amount||0),0)
        : computeFee(fg.fieldName, c.payType || "אחוזים", c.value);
      const paid        = paidByConsultant(c.name.trim(), fg.fieldName||"", approvedIncIds);
      const planOnly    = (planOnlyMap||{})[(fg.fieldName||"") + "::" + c.name.trim()] || 0;
      const noClaims    = !!(consultantEntry?.noClaims);
      const notes       = consultantEntry?.notes || "";
      rows.push({
        field: fg.fieldName || "", name: c.name.trim(),
        payType: c.payType || "אחוזים", value: Number(c.value||0),
        increases: totalInc, pendingInc, computedFee, paid, planOnly, noClaims, notes,
        _consultantRowId: "q-"+c.id,
      });
    });
  });
  rows.sort((a,b) => String(Array.isArray(a.field)?a.field[0]||"":a.field||"").localeCompare(String(Array.isArray(b.field)?b.field[0]||"":b.field||""), 'he'));
  // Manual rows always appear at the end of the consultants section
  (budgetState?.extraConsultantRows || []).forEach(r => {
    rows.push({
      field: r.field||"", name: r.name||"",
      payType: "סכום קבוע", value: Number(r.contract||0),
      increases: 0, computedFee: Number(r.contract||0),
      paid: Number(r.paid||0), planOnly: Number(r.planOnly||0),
      noClaims: !!r.noClaims, notes: r.notes||"",
      _manualRow: true, _manualId: r.id,
    });
  });
  return rows;
}

function NegInput({ value, onCommit, placeholder, style }) {
  const isFocused = React.useRef(false);
  const [local, setLocal] = React.useState("");
  const [showRaw, setShowRaw] = React.useState(false);
  const numVal = v => {
    if (v===null||v===undefined||v==="") return null;
    const n = Number(String(v).replace(/,/g,""));
    return isNaN(n)?null:n;
  };
  const fmtNum = v => { const n=numVal(v); return n!==null?n.toLocaleString("en-US"):""; };
  React.useEffect(() => {
    if (!isFocused.current) { const n=numVal(value); setLocal(n!==null?String(n):""); }
  }, [value]);
  return (
    <input
      type="text"
      value={showRaw ? local : fmtNum(value)}
      onChange={e => setLocal(e.target.value.replace(/,/g,""))}
      onFocus={() => {
        isFocused.current = true;
        const n = numVal(value);
        setLocal(n!==null?String(n):"");
        setShowRaw(true);
      }}
      onBlur={() => {
        isFocused.current = false;
        setShowRaw(false);
        const clean = local.replace(/,/g,"");
        const n = Number(clean);
        onCommit(clean!==""&&!isNaN(n)?n:"");
      }}
      placeholder={placeholder||"0"}
      style={{ ...style, direction:"ltr" }}
    />
  );
}

const _fmtInput  = (val) => val ? Number(String(val).replace(/,/g,"")).toLocaleString("he-IL") : "";
const _parseInput = (val) => String(val).replace(/,/g,"");
function BudgetNumInput({ value, onChange, placeholder="0", style={} }) {
