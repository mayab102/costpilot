// ── Global page: תבניות אבני דרך ─────────────────────────────────────────────
function MilestonesPage({ companies, milestones, setMilestones, professions }) {
  const [selCompany,  setSelCompany]  = useState("");
  const [selProf,     setSelProf]     = useState("");
  const [customProf,  setCustomProf]  = useState("");
  const [addingProf,  setAddingProf]  = useState(false);
  const [newName,     setNewName]     = useState("");
  const [newPct,      setNewPct]      = useState("");
  const [newPlanOnly, setNewPlanOnly] = useState(false);
  const [editId,      setEditId]      = useState(null);
  const [editData,    setEditData]    = useState({});
  const [copyFromCompany, setCopyFromCompany] = useState("");
  const [copyFromProf,    setCopyFromProf]    = useState("");
  const [showCopy,        setShowCopy]        = useState(false);
  const [profFocused,     setProfFocused]     = useState(false);
  const [copyProfSearch,  setCopyProfSearch]  = useState("");
  const [copyProfFocused, setCopyProfFocused] = useState(false);

  // All professions = stats professions + any custom ones already used in this company
  const existingCompanyProfs = selCompany
    ? Object.keys(milestones[selCompany] || {})
    : [];
  const allProfs = [...new Set([...professions, ...existingCompanyProfs])];
  const profSearchOpts = allProfs.filter(p => !customProf || p.startsWith(customProf));

  const companyMilestones = selCompany && selProf
    ? (milestones[selCompany]?.[selProf] || [])
    : [];

  const upd = (list) => {
    const companyData = { ...(milestones[selCompany]||{}), [selProf]: list };
    if (list.length === 0) delete companyData[selProf];
    setMilestones({ ...milestones, [selCompany]: companyData });
  };

  const addCustomProf = () => {
    if (!customProf.trim()) return;
    setSelProf(customProf.trim());
    setCustomProf("");
    setAddingProf(false);
  };

  const add = () => {
    if (!newName.trim() || !newPct) return;
    upd([...companyMilestones, { id:Date.now(), name:newName, pct:newPct, planOnly:newPlanOnly }]);
    setNewName(""); setNewPct(""); setNewPlanOnly(false);
  };

  const del = id => upd(companyMilestones.filter(m => m.id !== id));

  const saveEdit = () => {
    upd(companyMilestones.map(m => m.id === editId ? { ...m, ...editData } : m));
    setEditId(null);
  };

  const totalPct = companyMilestones.reduce((s,m) => s + Number(m.pct||0), 0);

  return (
    <div className="fade" style={{ display:"flex", flexDirection:"column", flex:1, minHeight:0, overflow:"hidden" }}>
      <div style={{ flexShrink:0, padding:"34px 38px 0", display:"flex", flexDirection:"column", gap:22 }}>
        <div>
          <div style={{ fontSize:11, color:"#444444", fontWeight:700, letterSpacing:3, marginBottom:4 }}>גיליון גלובלי</div>
          <h1 style={{ fontSize:24, fontWeight:900, color:"#0D0D0D", margin:0 }}>תבניות אבני דרך</h1>
          <div style={{ fontSize:13, color:"#9A9A9A", marginTop:4 }}>ניהול אבני דרך סטנדרטיות לפי חברה עירונית ומקצוע</div>
        </div>

      {/* Selectors */}
      <Card>
        <div style={{ display:"flex", gap:20, flexWrap:"wrap", alignItems:"flex-end" }}>
          <div style={{ flex:1, minWidth:200 }}>
            <div style={{ fontSize:12, fontWeight:600, color:"#767676", marginBottom:6 }}>בחר חברה עירונית *</div>
            <select value={selCompany} onChange={e=>{ setSelCompany(e.target.value); setSelProf(""); }}
              style={{ width:"100%", padding:"9px 12px", border:"1.5px solid #0B1F3A", borderRadius:4, fontSize:14, fontFamily:"'Heebo',sans-serif", background:"#F7F8FA", outline:"none" }}>
              <option value="">-- בחר --</option>
              {companies.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          </div>
          {selCompany && (
            <div style={{ flex:1, minWidth:200 }}>
              <div style={{ fontSize:12, fontWeight:600, color:"#767676", marginBottom:6 }}>בחר מקצוע *</div>
              <div style={{ position:"relative" }}>
                <input value={selProf || customProf}
                  onChange={e => { setCustomProf(e.target.value); setSelProf(""); }}
                  onFocus={()=>setProfFocused(true)}
                  onBlur={()=>setTimeout(()=>setProfFocused(false),150)}
                  placeholder="הקלד לחיפוש תחום..."
                  style={{ width:"100%", padding:"9px 12px", border:"1.5px solid #0B1F3A", borderRadius:4, fontSize:14, fontFamily:"'Heebo',sans-serif", outline:"none", boxSizing:"border-box", background:"#F7F8FA" }} />
                {profFocused && profSearchOpts.length > 0 && (
                  <div style={{ position:"absolute", top:"100%", right:0, left:0, background:"#fff", border:"1.5px solid #E2E5EA", borderRadius:4, zIndex:200, boxShadow:"0 8px 24px #0002", maxHeight:220, overflowY:"auto", marginTop:2 }}>
                    {profSearchOpts.map(p => (
                      <div key={p} onMouseDown={() => { setSelProf(p); setCustomProf(""); setProfFocused(false); }}
                        style={{ padding:"9px 14px", cursor:"pointer", fontSize:14, color:"#0D0D0D", direction:"rtl", borderBottom:"1px solid #F0F2F5", background: p===selProf?"#EAF1FA":"#fff" }}
                        onMouseOver={e=>e.currentTarget.style.background="#EAF1FA"}
                        onMouseOut={e=>e.currentTarget.style.background=p===selProf?"#EAF1FA":"#fff"}>{p}</div>
                    ))}
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      </Card>
      </div>
      <div style={{ flex:1, overflowY:"auto", minHeight:0, padding:"16px 38px 34px" }}>

      {/* Milestones table */}
      {selCompany && selProf && (
        <>
          <Card style={{ padding:0, overflow:"hidden", marginBottom:22 }}>
            <div style={{ padding:"12px 20px", borderBottom:"1px solid #E2E5EA", display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:8 }}>
              <span style={{ fontWeight:700, color:"#0D0D0D" }}>
                {companies.find(c=>c.id==selCompany)?.name} — {selProf}
              </span>
              <div style={{ display:"flex", gap:8, alignItems:"center" }}>
                <Badge color="#0B1F3A">{companyMilestones.length} אבני דרך</Badge>
                <button onClick={()=>setShowCopy(!showCopy)}
                  style={{ background:"#EAF1FA", color:"#163356", border:"1.5px solid #E2E5EA", borderRadius:4, padding:"8px 12px", fontSize:13, cursor:"pointer", fontFamily:"'Heebo',sans-serif", fontWeight:600 }}>
                  📋 העתק מחברה אחרת
                </button>
              </div>
            </div>
            {showCopy && (
              <div style={{ padding:"12px 20px", background:"#EAF1FA", borderBottom:"1px solid #D4E4F4", display:"flex", gap:12, alignItems:"flex-end", flexWrap:"wrap" }}>
                <div>
                  <div style={{ fontSize:11, fontWeight:600, color:"#163356", marginBottom:4 }}>חברה עירונית</div>
                  <select value={copyFromCompany} onChange={e=>{ setCopyFromCompany(e.target.value); setCopyFromProf(""); }}
                    style={{ padding:"8px 12px", border:"1.5px solid #E2E5EA", borderRadius:4, fontSize:13, fontFamily:"'Heebo',sans-serif", background:"#fff", outline:"none" }}>
                    <option value="">-- בחר --</option>
                    {companies.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                  </select>
                </div>
                {copyFromCompany && (
                  <div>
                    <div style={{ fontSize:11, fontWeight:600, color:"#163356", marginBottom:4 }}>מקצוע</div>
                    <div style={{ position:"relative" }}>
                      <input value={copyFromProf || copyProfSearch}
                        onChange={e => { setCopyProfSearch(e.target.value); setCopyFromProf(""); }}
                        onFocus={()=>setCopyProfFocused(true)}
                        onBlur={()=>setTimeout(()=>setCopyProfFocused(false),150)}
                        placeholder="הקלד לחיפוש מקצוע..."
                        style={{ padding:"8px 12px", border:"1.5px solid #0B1F3A", borderRadius:4, fontSize:13, fontFamily:"'Heebo',sans-serif", background:"#fff", outline:"none", width:"100%", boxSizing:"border-box" }} />
                      {copyProfFocused && (() => {
                        const opts = Object.keys(milestones[copyFromCompany]||{}).filter(p => !copyProfSearch || p.startsWith(copyProfSearch));
                        return opts.length > 0 ? (
                          <div style={{ position:"absolute", top:"100%", right:0, left:0, background:"#fff", border:"1.5px solid #E2E5EA", borderRadius:4, zIndex:200, boxShadow:"0 8px 24px #0002", maxHeight:220, overflowY:"auto", marginTop:2 }}>
                            {opts.map(p => (
                              <div key={p} onMouseDown={() => {
                                const source = milestones[copyFromCompany]?.[p] || [];
                                const copied = source.map(m => ({ ...m, id: Date.now() + Math.random() }));
                                upd([...companyMilestones, ...copied]);
                                setShowCopy(false); setCopyFromCompany(""); setCopyFromProf(""); setCopyProfSearch("");
                              }}
                                style={{ padding:"9px 14px", cursor:"pointer", fontSize:13, color:"#0D0D0D", direction:"rtl", borderBottom:"1px solid #F0F2F5" }}
                                onMouseOver={e=>e.currentTarget.style.background="#EAF1FA"}
                                onMouseOut={e=>e.currentTarget.style.background="#fff"}>{p}</div>
                            ))}
                          </div>
                        ) : null;
                      })()}
                    </div>
                  </div>
                )}
                <button onClick={()=>{ setShowCopy(false); setCopyFromCompany(""); setCopyFromProf(""); }}
                  style={{ background:"#F0F2F5", color:"#767676", border:"1.5px solid #E2E5EA", borderRadius:4, padding:"8px 12px", fontSize:13, cursor:"pointer", fontFamily:"'Heebo',sans-serif" }}>ביטול</button>
              </div>
            )}
            <table style={{ width:"100%", borderCollapse:"collapse", fontSize:13 }}>
              <thead>
                <tr style={{ background:"#F7F8FA", borderBottom:"2px solid #E2E5EA" }}>
                  <th style={{ padding:"8px 16px", textAlign:"right", color:"#767676", fontWeight:700, fontSize:11, width:50 }}>סדר</th>
                  <th style={{ padding:"8px 16px", textAlign:"right", color:"#767676", fontWeight:700, fontSize:11 }}>שם אבן הדרך</th>
                  <th style={{ padding:"8px 16px", textAlign:"right", color:"#767676", fontWeight:700, fontSize:11, width:120 }}>אחוז שכר טרחה</th>
                  <th style={{ padding:"8px 16px", textAlign:"right", color:"#767676", fontWeight:700, fontSize:11, width:110 }}>תכנון בלבד</th>
                  <th style={{ padding:"8px 16px", textAlign:"right", color:"#767676", fontWeight:700, fontSize:11, width:80 }}>פעולות</th>

                  <tr key={m.id} style={{ borderBottom:"1px solid #F0F2F5", background:i%2===0?"#fff":"#FAFBFC" }}>

      )}

      {!selCompany && companies.length === 0 && (

          יש להוסיף חברות עירוניות תחילה בגיליון "חברות עירוניות"
        </div>
      )}
      </div>
    </div>
  );
}

// ── Minimal ZIP builder (stored, no compression) ─────────────────────────────
function buildZip(files) {
  const u32le = (n) => { const b=new Uint8Array(4); new DataView(b.buffer).setUint32(0,n,true); return b; };
  const u16le = (n) => { const b=new Uint8Array(2); new DataView(b.buffer).setUint16(0,n,true); return b; };
  const concat = (...arrays) => { const len=arrays.reduce((s,a)=>s+a.length,0); const r=new Uint8Array(len); let off=0; arrays.forEach(a=>{r.set(a,off);off+=a.length;}); return r; };
  const crc32 = (data) => {
    let c=0xFFFFFFFF;
    const t=new Uint32Array(256);
    for(let i=0;i<256;i++){let x=i;for(let j=0;j<8;j++)x=x&1?(x>>>1)^0xEDB88320:(x>>>1);t[i]=x;}
    for(let i=0;i<data.length;i++)c=t[(c^data[i])&0xFF]^(c>>>8);
    return (c^0xFFFFFFFF)>>>0;
  };
  const enc = new TextEncoder();
  const localHeaders = [];
  const centralDirs = [];
  let offset = 0;
  for (const [name, data] of Object.entries(files)) {
    const nameBytes = enc.encode(name);
    const crc = crc32(data);
    const local = concat(
      new Uint8Array([0x50,0x4B,0x03,0x04]), // sig
      u16le(20), u16le(0), u16le(0),          // version, flags, compression (stored)
      u16le(0), u16le(0),                      // mod time, mod date
      u32le(crc), u32le(data.length), u32le(data.length),
      u16le(nameBytes.length), u16le(0),       // name len, extra len
      nameBytes, data
    );
    const central = concat(
      new Uint8Array([0x50,0x4B,0x01,0x02]), // sig
      u16le(20), u16le(20), u16le(0), u16le(0),
      u16le(0), u16le(0),                      // compression stored
      u32le(crc), u32le(data.length), u32le(data.length),
      u16le(nameBytes.length), u16le(0), u16le(0), u16le(0), u16le(0),
      u32le(0), u32le(offset),
      nameBytes
    );
    localHeaders.push(local);
    centralDirs.push(central);
    offset += local.length;
  }
  const centralStart = offset;
  const centralData = concat(...centralDirs);
  const eocd = concat(
    new Uint8Array([0x50,0x4B,0x05,0x06]),
    u16le(0), u16le(0),
    u16le(centralDirs.length), u16le(centralDirs.length),
    u32le(centralData.length), u32le(centralStart),
    u16le(0)
  );
  return concat(...localHeaders, centralData, eocd);
}

// ── Persistence helpers ──────────────────────────────────────────────────────
const LS_PROJECTS = "proj_mgr_projects";
const LS_DATA     = "proj_mgr_data";

function loadProjects() {
  try {
    const raw = localStorage.getItem(LS_PROJECTS);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return SEED_PROJECTS;
}

function loadAllData(projects) {
  try {
    const raw = localStorage.getItem(LS_DATA);
    if (raw) {
      const saved = JSON.parse(raw);
      // ensure every project has an entry
      const d = {};
      projects.forEach(p => { d[p.id] = saved[p.id] || makeProjectData(); });
      return d;
    }
  } catch(e) {}
  const d = {};
  projects.forEach(p => { d[p.id] = makeProjectData(); });
  return d;
}

function saveProjects(projects) {
  try { localStorage.setItem(LS_PROJECTS, JSON.stringify(projects)); } catch(e) {}
}

function saveAllData(data) {
  try { localStorage.setItem(LS_DATA, JSON.stringify(data)); } catch(e) {}
}

const PROJ_STATUSES_MAIN = ["תכנון","ביצוע","נמסר","הוקפא","בוטל"];

function MainInfoPage({ allData, projects, companies, setAllData, setProjects, onNavigate, statsRows, managers, suppliers, setSuppliers }) {
  const openRatingEmail = (projId, oldStatus, newStatus) => {
    const freezeTargets = ["הוקפא","בוטל"];
    let managerType = null;
    if (oldStatus === "תכנון" && newStatus === "ביצוע") managerType = "planning";
    else if (oldStatus === "ביצוע" && newStatus === "נמסר") managerType = "execution";
    else if (freezeTargets.includes(newStatus)) managerType = oldStatus === "ביצוע" ? "execution" : "planning";
    if (!managerType) return;

    const projData = allData[projId] || {};
    const proj = projects.find(p => p.id === projId);
    if (!proj) return;

    let managerName = "", managerEmail = "";
    if (managerType === "planning") {
      managerName = projData.planningManager || "";
      managerEmail = projData.planningManagerEmail || "";
      if (!managerEmail && projData.planningManagerId) {
        const m = (managers||[]).find(m => m.id === projData.planningManagerId);
        managerEmail = m?.email || ""; managerName = managerName || m?.name || "";
      }
    } else {
      managerName = projData.executionManager || "";
      managerEmail = projData.executionManagerEmail || "";
      if (!managerEmail && projData.executionManagerId) {
        const m = (managers||[]).find(m => m.id === projData.executionManagerId);
        managerEmail = m?.email || ""; managerName = managerName || m?.name || "";
      }
    }

    const consultants = [];
    (projData.quotes || []).forEach(field => {
      (field.consultants || []).forEach(c => {
        if (c.approved && c.name?.trim()) consultants.push({ field: field.fieldName || "", name: c.name.trim() });
      });
    });
    if (consultants.length === 0) return;

    const phaseName = managerType === "planning" ? "תכנון" : "ביצוע";
    const subject = `דירוג יועצים — ${proj.name} — שלב ${phaseName}`;
    const intro = [
      `שלום${managerName ? " " + managerName : ""},`,
      "",
      `נבקש לדרג את יועצי הפרויקט "${proj.name}" עבור שלב ${phaseName}.`,
      `יש למלא לכל יועץ ניקוד מ-1 עד 5 בשתי העמודות (5 = הניקוד הגבוה ביותר) ולשלוח למנהלת המכרזים.`,
    ].join("\n");
    const outro = "בברכה,";
    const headers = ["תחום", "שם היועץ", "שירות/זמינות (1-5)", "מקצועיות (1-5)"];
    const tableRows = consultants.map(c => [c.field, c.name, "", ""]);
    const htmlBody = buildEmailHtml(intro, headers, tableRows, outro);
    const body = `${intro}\n\n${consultants.map(c => `${c.field} | ${c.name} | ___ | ___`).join("\n")}\n\n${outro}`;
    openOutlookEmail(managerEmail, subject, body, htmlBody);
  };

  const upd = (projId, key, val) => {
    if (key === "name" || key === "status") {
      setProjects(projects.map(p => p.id===projId ? {...p,[key]:val} : p));
      if (key === "status") {
        const oldStatus = projects.find(p => p.id === projId)?.status || "";
        openRatingEmail(projId, oldStatus, val);
      }
    } else if (key === "projectNumber" || key === "planningManager" || key === "executionManager" || key === "companyId") {
      const updated = { ...(allData[projId]||makeProjectData()), [key]: val };
      setAllData(prev => ({ ...prev, [projId]: updated }));
      saveProjectData(projId, updated);
    } else {
      const current = allData[projId] || makeProjectData();
      const updated = { ...current, openingData: { ...(current.openingData||{}), [key]: val } };
      setAllData(prev => ({ ...prev, [projId]: updated }));
      saveProjectData(projId, updated);
    }
  };

  // colFilters: { [fkey]: Set<string> } — undefined/null = no filter (all shown)
  const [colFilters, setColFilters] = React.useState({});
  const [openFilter, setOpenFilter]   = React.useState(null);
  const [filterSearch, setFilterSearch] = React.useState("");
  const [dropPos, setDropPos]         = React.useState({ top:0, left:0 });
  const [searchQuery, setSearchQuery] = React.useState("");
  const [page, setPage] = React.useState(0);
  const PAGE_SIZE = 30;

  const inp = (projId, key, val) => (
    <input value={val||""} onChange={e=>upd(projId,key,e.target.value)}
      style={{ width:"100%", border:"none", background:"transparent", textAlign:"right", direction:"rtl", fontSize:12, fontFamily:"'Heebo',sans-serif", outline:"none", color:"#0D0D0D", padding:"4px 4px" }}
      onFocus={e=>e.target.style.background="#EAF1FA"} onBlur={e=>e.target.style.background="transparent"} />
  );

  const cols = [
    { label:"מס׳ פרויקט",    w:90,  fkey:"projectNumber" },
    { label:"שם פרויקט",     w:160, fkey:"name" },
    { label:"חברה עירונית",  w:150, fkey:"company" },
    { label:"כתובת",         w:130, fkey:"address" },
    { label:"מהות הפרויקט", w:150, fkey:"workDescription" },
    { label:"מנהל תכנון",   w:100, fkey:"planningManager" },
    { label:"מנהל ביצוע",   w:100, fkey:"executionManager" },
    { label:"ניצול תקציבי", w:90,  fkey:null },
    { label:"% יועצים",     w:80,  fkey:null },
    { label:"סטטוס",         w:90,  fkey:"status" },
    { label:"תאריך התחלה",  w:110, fkey:"startDate" },
    { label:"תאריך סיום",   w:110, fkey:"endDate" },
    { label:"שטח (מ״ר)",    w:80,  fkey:"buildingArea" },
    { label:"עלות קבלנית",  w:110, fkey:"contractorEst" },
    { label:"עלות עירונית", w:110, fkey:"municipalEst" },
  ];

  const getVal = (p, fkey) => {
    const d = allData[p.id] || {};
    const o = d.openingData || {};
    const company = companies.find(c => String(c.id) === String(d.companyId));
    switch(fkey) {
      case "projectNumber":    return d.projectNumber||"";
      case "name":             return p.name||"";
      case "company":          return company?.name||"";
      case "address":          return o.address||"";
      case "workDescription":  return o.workDescription||"";
      case "planningManager":  return d.planningManager||"";
      case "executionManager": return d.executionManager||"";
      case "status":           return p.status||"";
      case "startDate":        return o.startDate ? o.startDate.split("-").reverse().join("/") : "";
      case "endDate":          return o.endDate   ? o.endDate.split("-").reverse().join("/")   : "";
      case "buildingArea":     return String(o.buildingArea||"");
      case "contractorEst":    return String(o.contractorEst||"");
      case "municipalEst":     return String(o.municipalEst||"");
      default: return "";
    }
  };

  // Projects filtered by all columns EXCEPT targetFkey (for dropdown options)
  // undefined = no filter (show all); Set = show only items in set
  const getFilteredExcept = (targetFkey) =>
    projects.filter(p => cols.every(({fkey}) => {
      if (!fkey || fkey === targetFkey) return true;
      const sel = colFilters[fkey];
      if (sel === undefined) return true;
      return sel.has(getVal(p, fkey));
    }));

  const searchLower = searchQuery.trim().toLowerCase();
  const filteredProjects = projects.filter(p => {
    if (!cols.every(({fkey}) => {
      if (!fkey) return true;
      const sel = colFilters[fkey];
      if (sel === undefined) return true;
      return sel.has(getVal(p, fkey).trim());
    })) return false;
    if (searchLower) {
      const haystack = ["projectNumber","name","company","address","workDescription","planningManager","executionManager","status"]
        .map(k => getVal(p, k)).join(" ").toLowerCase();
      if (!haystack.includes(searchLower)) return false;
    }
    return true;
  });

  const prevFilterKey = React.useRef("");
  const filterKey = searchLower + JSON.stringify(colFilters);
  if (filterKey !== prevFilterKey.current) { prevFilterKey.current = filterKey; if (page !== 0) setPage(0); }
  const totalPages = Math.ceil(filteredProjects.length / PAGE_SIZE);
  const pageProjects = filteredProjects.slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE);

  // Cache expensive per-project budget calculations — only for current page
  const projStats = React.useMemo(() => {
    const out = {};
    filteredProjects.forEach(p => {
      const d = allData[p.id] || {};
      const o = d.openingData || {};
      const cEst = Number(String(o.contractorEst||"").replace(/,/g,"")) || Number(d.budgetState?.contractorEst||0);
      const _rows = buildBudgetAllRows({ quotesRows:d.quotes||[], consultantsRows:d.consultants||[], budgetState:{...(d.budgetState||{}),contractorEst:cEst}, statsRows, accountsRows:d.accounts||[], planOnlyMap:{}, openingData:o });
      const _finalMeta = (d.contractor||[]).find(r=>r.key==="__meta__");
      const _finalBoq  = Number(String(_finalMeta?.finalBoq||"").replace(/[,\s]/g,"").replace(/[^\d.]/g,""));
      const _boqMeta   = (d.tender||[]).find(r=>r.key==="__meta__");
      const _boqVal    = Number(String(_boqMeta?.boq||"").replace(/[,\s]/g,"").replace(/[^\d.]/g,""));
      const _utilBase  = _finalBoq>0?_finalBoq:_boqVal>0?_boqVal:cEst;
      const utilPct    = _utilBase>0 ? consultantsUtilTotal(_rows)/_utilBase*100 : null; // ללא מכון בקרה
      const _bs = d.budgetState||{};
      const _feePaid  = [...(_bs.feeRows||[]),...(_bs.extraFeeRows||[])].reduce((s,r)=>s+Number(r.paid||0),0);
      const _conPaid  = [{paid:_bs.contractorPaid||""},...(_bs.extraContractorRows||[])].reduce((s,r)=>s+Number(r.paid||0),0);
      const _basePaid = _rows.reduce((s,r)=>s+(r.paid||0),0)+_feePaid+_conPaid;
      const _ohPaid   = Math.round(_basePaid*Number(_bs.overheadPct||4)/100);
      const _bcmPaid  = Math.round((_basePaid+_ohPaid)*Number(_bs.bcmPct||0)/100);
      const _vatPaid  = Math.round((_basePaid+_ohPaid+_bcmPaid)*Number(_bs.vatPct||18)/100);
      const _grandPaid = _basePaid+_ohPaid+_bcmPaid+_vatPaid;
      const _received  = (_bs.extraItems||[]).reduce((s,x)=>s+Number(x.amount||0),0);
      const budgetUtilPct = _received>0 ? _grandPaid/_received*100 : null;
      out[p.id] = { utilPct, budgetUtilPct };
    });
    return out;
  }, [filteredProjects, statsRows]); // eslint-disable-line react-hooks/exhaustive-deps

  const isFiltered = (fkey) => colFilters[fkey] !== undefined;
  const hasAnyFilter = cols.some(({fkey}) => fkey && isFiltered(fkey));

    setOpenFilter(fkey);
    setFilterSearch("");
  };

  const closeDropdown = () => setOpenFilter(null);

  const renderDropdown = () => {
    if (!openFilter) return null;
    const fkey = openFilter;
    const partial = getFilteredExcept(fkey);
    const allVals = [...new Set(partial.map(p => getVal(p, fkey).trim()))].sort((a,b)=>a.localeCompare(b,"he"));
    const sel = colFilters[fkey]; // undefined = no filter; Set = explicit selection
    const isAllSelected = sel === undefined;
    const searchTerm = filterSearch.trim();
    const visibleVals = allVals.filter(v => !searchTerm || v.includes(searchTerm));

    const toggle = (val) => {
      setColFilters(prev => {
        const curSel = prev[fkey];
        if (curSel === undefined) {
          // Was "all" — uncheck this one item
          const newSet = new Set(allVals.filter(v => v !== val));
          return { ...prev, [fkey]: newSet };
        }
        const cur = new Set(curSel);
        if (cur.has(val)) { cur.delete(val); } else { cur.add(val); }
        // If all vals re-selected, remove filter entirely
        if (cur.size >= allVals.length) { const n = {...prev}; delete n[fkey]; return n; }
        return { ...prev, [fkey]: cur };
      });
    };

    const selectAll = () => setColFilters(prev => { const n = {...prev}; delete n[fkey]; return n; });
    const clearAll  = () => setColFilters(prev => ({ ...prev, [fkey]: new Set() }));
    const isChecked = (v) => isAllSelected ? true : sel.has(v);

    return ReactDOM.createPortal(
      <>
        <div onClick={closeDropdown} style={{ position:"fixed", inset:0, zIndex:1999 }} />
        <div onClick={e=>e.stopPropagation()}
          style={{ position:"fixed", top:dropPos.top, left:dropPos.left, zIndex:2000,
            background:"#fff", border:"1px solid #D0D5DD", borderRadius:8,
            boxShadow:"0 6px 24px #0003", minWidth:200, maxWidth:280,
            display:"flex", flexDirection:"column", padding:10, gap:6, direction:"rtl",
            fontFamily:"'Heebo',sans-serif" }}>
          <input autoFocus value={filterSearch} onChange={e=>setFilterSearch(e.target.value)}
            placeholder="חיפוש..."
            style={{ border:"1px solid #E2E5EA", borderRadius:4, padding:"5px 8px", fontSize:12,
              outline:"none", textAlign:"right", direction:"rtl", fontFamily:"'Heebo',sans-serif", background:"#F7F8FA" }} />
          <div style={{ display:"flex", gap:6 }}>

          </div>

              <div key={val} onClick={()=>toggle(val)} style={{ display:"flex", alignItems:"center", gap:8, padding:"4px 6px", borderRadius:4, cursor:"pointer", fontSize:12 }}>
                <span style={{ width:14, height:14, flexShrink:0, border:"1.5px solid #9A9A9A", borderRadius:2, display:"flex", alignItems:"center", justifyContent:"center", background:"#fff", fontSize:11, color:"#0D0D0D", fontWeight:700 }}>{isChecked(val) ? "✓" : ""}</span>
                <span style={{ flex:1 }}>{val || "(ריק)"}</span>
              </div>
            ))}
          </div>
          <div style={{ borderTop:"1px solid #F0F2F5", paddingTop:6, display:"flex", justifyContent:"flex-end" }}>
            <button onClick={closeDropdown}
              style={{ background:"#0B1F3A", color:"#fff", border:"none", borderRadius:4, padding:"5px 14px", fontSize:12, cursor:"pointer", fontWeight:600 }}>אישור</button>
          </div>
        </div>
      </>,
      document.body
    );
  };

  const exportToExcel = () => {
    const esc = s => String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    const headers = ["מס׳ פרויקט","שם פרויקט","חברה עירונית","כתובת","מהות הפרויקט","מנהל תכנון","מנהל ביצוע","ניצול תקציבי","% יועצים","סטטוס","תאריך התחלה","תאריך סיום","שטח (מ״ר)","עלות קבלנית","עלות עירונית"];
    const rows = filteredProjects.map(p => {
      const d = allData[p.id] || {};
      const o = d.openingData || {};
      const company = companies.find(c => String(c.id) === String(d.companyId));
      const { utilPct, budgetUtilPct } = projStats[p.id] || {};
      const utilBg  = budgetUtilPct===null||budgetUtilPct===undefined?"":budgetUtilPct<75?"#EFF7F3":budgetUtilPct<85?"#FAF2E6":budgetUtilPct<95?"#FAF2E6":"#F8EDED";
      const utilBg2 = utilPct===null||utilPct===undefined?"":utilPct<10?"#EFF7F3":utilPct<12?"#FAF2E6":"#F8EDED";
      return {
        cells: [
          d.projectNumber||"", p.name||"", company?.name||"", o.address||"", o.workDescription||"",
          d.planningManager||"", d.executionManager||"",
          budgetUtilPct===null?"—":budgetUtilPct.toFixed(1)+"%",
          utilPct===null?"—":utilPct.toFixed(2)+"%",
          p.status||"", o.startDate||"", o.endDate||"",
          String(o.buildingArea||""), String(o.contractorEst||""), String(o.municipalEst||""),
        ],
        utilBg, utilBg2,
      };
    });
    const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="UTF-8"/>

// ── Global page: השוואת עלויות ───────────────────────────────────────────────
function CostsPage({ allData, projects, statsRows, suppliers }) {
  const [filterField, setFilterField] = React.useState("");
  const [myArea, setMyArea] = React.useState("");

  // Collect all approved consultants from all projects
  const rows = [];
  projects.forEach(proj => {
    const openingData = allData[proj.id]?.openingData || {};
    const area = Number(String(openingData.buildingArea||"").replace(/,/g,"")) || 0;
    const quotes = allData[proj.id]?.quotes || [];
    const budgetState = allData[proj.id]?.budgetState || {};
    const devPct = (statsRows||[]).filter(r=>(r.field||"").includes("פיתוח")||(r.field||"").includes("נוף")).reduce((s,r)=>s+Number(r.pct||0),0);
    const cEst = Number(String(openingData.contractorEst||"").replace(/,/g,"")) || Number(budgetState.contractorEst||0);
    const archBase = cEst - cEst * devPct / 100;

    quotes.forEach(field => {
      field.consultants.filter(c => c.approved && c.name?.trim()).forEach(c => {
        const isPct = (c.payType||"אחוזים") === "אחוזים";
        const pct = Number(c.value||0) / 100;
        let fee = 0;
        if (c.subItems && c.subItems.length > 0) {
          fee = c.subItems.reduce((s,it)=>s+Number(it.amount||0),0);
        } else if (!isPct) fee = Number(c.value||0);
        else if (["אדריכל","אדריכלות","אדריכלים"].includes((field.fieldName||"").trim()) && cEst) fee = archBase * pct;
        else if ((field.fieldName||"").includes("מנהל פרויקט") && cEst) fee = cEst * pct;
        else if (cEst) { const pp = profStatPct(statsRows, field.fieldName)/100; fee = cEst * pp * pct; }
        rows.push({
          projName: proj.name,
          field: field.fieldName || "",
          consultant: canonicalSupplierName(c.name, suppliers),
          payType: c.payType || "אחוזים",
          value: c.value || "",
          fee,
          area,
        });
      });
    });
  });

  // All unique fields
  const allFields = [...new Set(rows.map(r => r.field))].filter(Boolean).sort((a,b) => a.localeCompare(b,"he"));

  // Filter
  const myAreaNum = Number(String(myArea).replace(/,/g,"")) || 0;
  const filtered = rows.filter(r => {
    if (filterField && r.field !== filterField) return false;
    if (myAreaNum && r.area) {
      if (Math.abs(r.area - myAreaNum) > 4000) return false;
    }
    return true;
  }).sort((a,b) => (b.area||0) - (a.area||0));

  const fmt = n => n ? "" + Number(n).toLocaleString("en-US", {maximumFractionDigits:0}) : "—";

  return (
    <div className="fade" style={{ display:"flex", flexDirection:"column", flex:1, minHeight:0, overflow:"hidden" }}>
      <div style={{ flexShrink:0, padding:"34px 38px 0", display:"flex", flexDirection:"column", gap:22 }}>
        <div>
          <div style={{ fontSize:11, color:"#767676", fontWeight:700, letterSpacing:3, marginBottom:4 }}>גיליון גלובלי</div>
          <h1 style={{ fontSize:24, fontWeight:900, color:"#0D0D0D", margin:0 }}>השוואת עלויות</h1>
          <div style={{ fontSize:13, color:"#9A9A9A", marginTop:4 }}>השוואת עלויות יועצים בין פרויקטים</div>
        </div>

      {/* Filters */}
      <Card>
        <div style={{ display:"flex", gap:20, alignItems:"flex-end", direction:"rtl", flexWrap:"wrap" }}>
          <div>
            <div style={{ fontSize:12, fontWeight:600, color:"#767676", marginBottom:5 }}>סינון לפי תחום</div>
            <select value={filterField} onChange={e=>setFilterField(e.target.value)}
              style={{ padding:"8px 12px", border:"1.5px solid #0B1F3A", borderRadius:4, fontSize:13, fontFamily:"'Heebo',sans-serif", background:"#F7F8FA", color:"#0D0D0D", outline:"none", minWidth:180, direction:"rtl", height:37, boxSizing:"border-box" }}>
              <option value="">כל התחומים</option>
              {allFields.map(f => <option key={f} value={f}>{f}</option>)}
            </select>
          </div>
          <div>
            <div style={{ fontSize:12, fontWeight:600, color:"#767676", marginBottom:5 }}>שטח הפרויקט שלי (מ״ר)</div>
            <div style={{ display:"flex", alignItems:"center", gap:8 }}>
              <input type="text" inputMode="numeric" value={myArea} onChange={e=>setMyArea(e.target.value)}
                placeholder="לדוגמה: 2500"
                style={{ padding:"8px 12px", border:"1.5px solid #0B1F3A", borderRadius:4, fontSize:13, fontFamily:"'Heebo',sans-serif", background:"#F7F8FA", outline:"none", width:140, textAlign:"right", height:37, boxSizing:"border-box" }} />
              {myArea && <span style={{ fontSize:12, color:"#767676" }}>מציג ±4000 מ״ר</span>}
            </div>
          </div>
          {(filterField || myArea) && (
            <button onClick={()=>{setFilterField("");setMyArea("");}}
              style={{ padding:"8px 12px", border:"1.5px solid #E2E5EA", borderRadius:4, fontSize:13, color:"#767676", background:"#F7F8FA", cursor:"pointer", fontFamily:"'Heebo',sans-serif" }}>
              נקה סינון
            </button>
          )}
        </div>
      </Card>
      </div>
      <div style={{ flex:1, overflowY:"auto", minHeight:0, padding:"16px 38px 34px" }}>
      {/* Table */}
      <Card style={{ padding:0, overflow:"hidden" }}>
        <div style={{ padding:"12px 20px", borderBottom:"1px solid #E2E5EA", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
          <span style={{ fontWeight:700, color:"#0D0D0D" }}>{filtered.length} רשומות</span>
        </div>
        {filtered.length === 0 ? (
          <div style={{ padding:32, textAlign:"right", color:"#9A9A9A", fontSize:13 }}>
            {rows.length === 0 ? "אין יועצים מאושרים במערכת עדיין" : "אין תוצאות לסינון הנבחר"}
          </div>
        ) : (
          <table style={{ width:"100%", borderCollapse:"collapse", fontSize:13, direction:"rtl" }}>
            <thead>
              <tr style={{ background:"#F7F8FA", borderBottom:"2px solid #E2E5EA" }}>
                {["פרויקט","שטח (מ״ר)","תחום","שם יועץ","סכום"].map(h => (
                  <th key={h} style={{ padding:"9px 14px", textAlign:"right", color:"#767676", fontWeight:700, fontSize:11 }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {filtered.map((r, i) => (
                <tr key={i} style={{ borderBottom:"1px solid #F0F2F5", background:i%2===0?"#fff":"#FAFBFC" }}>
                  <td style={{ padding:"10px 14px", fontWeight:600, color:"#0D0D0D" }}>{r.projName}</td>
                  <td style={{ padding:"10px 14px", color:"#3A3A3A" }}>{r.area ? r.area.toLocaleString("en-US") : "—"}</td>
                  <td style={{ padding:"10px 14px", color:"#3A3A3A" }}>{r.field}</td>
                  <td style={{ padding:"10px 14px", color:"#3A3A3A" }}>{r.consultant}</td>
                  <td style={{ padding:"10px 14px", color:"#0D0D0D" }}>{fmt(r.fee)}</td>
                </tr>
              ))}
            </tbody>
            {filtered.filter(r => r.fee > 0).length > 0 && (
              <tfoot>
                <tr style={{ background:"#F7F8FA", borderTop:"2px solid #E2E5EA" }}>
                  <td colSpan={4} style={{ padding:"10px 14px", textAlign:"right", fontWeight:700, color:"#3A3A3A", fontSize:13 }}>
                    ממוצע ({filtered.filter(r=>r.fee>0).length} יועצים)
                  </td>
                  <td style={{ padding:"10px 14px", fontWeight:700, color:"#0D0D0D", fontSize:13 }}>
                    {fmt(filtered.filter(r=>r.fee>0).reduce((s,r)=>s+r.fee,0) / filtered.filter(r=>r.fee>0).length)}
                  </td>
                </tr>
              </tfoot>
            )}
          </table>
        )}
      </Card>
      </div>
    </div>
  );
}

// ── Global page: לוח בקרה ──────────────────────────────────────────────────
function DashboardPage({ allData, projects, onNavigate, milestones, onMarkEmailSent, managers, statsRows }) {
  const fmt = n => n ? Number(n).toLocaleString("he-IL",{maximumFractionDigits:0}) : "—";
  // אותו חישוב שמוצג בטבלת היועצים באפליקציה (FieldGroup, סוג תשלום "אחוזים")
  const calcConsultantFee = (c, fieldName, cEst) => {
    if (c.payType !== "אחוזים" || !cEst) return null;
    const pct = Number(c.value||0) / 100;
    const devPct = (statsRows||[]).filter(r=>(r.field||"").includes("פיתוח")||(r.field||"").includes("נוף")).reduce((s,r)=>s+Number(r.pct||0),0);
    const archBase = cEst - cEst * devPct / 100;
    const fn = (fieldName||"").trim();
    if (["אדריכל","אדריכלות","אדריכלים"].includes(fn)) return archBase * pct;
    if (fn.includes("מנהל פרויקט")) return cEst * pct;
    const pp = profStatPct(statsRows, fieldName)/100;
    return cEst * pp * pct;
  };
  const [highlightKey, setHighlightKey] = React.useState(null);
  const [tt, setTt] = React.useState({ visible:false, text:"", x:0, y:0 });
  const showTt = (text, e) => { if (text) setTt({ visible:true, text, x:e.clientX, y:e.clientY }); };
  const moveTt = (e) => setTt(t => t.visible ? { ...t, x:e.clientX, y:e.clientY } : t);
  const hideTt = () => setTt(t => ({ ...t, visible:false }));

  // Zone A: ממתין להמלצה על יועצים (מנהל מחלקה)
  // Zone B: ממתין לאישור מנהל פרויקט (חשבונות)
  // Zone C: הוחזר ליועץ לתיקון
  // Zone 2: ממתין להעברה לחברה העירונית
  // Zone 3: ממתין לאישור החברה העירונית
  const zoneA = [], zoneB = [], zoneC = [], zoneUM = [], zoneSend = [], zone2 = [], zone3 = [], zoneIncSend = [], zoneQuote = [];

  projects.forEach(proj => {
    // ── Consultant quotes ──
    const quotes = (allData[proj.id]?.quotes) || [];
    quotes.forEach(field => {
      const fieldApproved = field.consultants.some(c => c.name?.trim() && c.approved);
      if (field.readyToRecommend) {
        const namedConsultants = field.consultants.filter(c => c.name?.trim());
        const anyRecommended = namedConsultants.some(c => c.recommended);
        if (!anyRecommended && !fieldApproved && namedConsultants.length > 0) {
          const da = allData[proj.id] || {};
          zoneA.push({ projId: proj.id, projName: proj.name, fieldId: field.id, fieldName: field.fieldName,
            label: "—", value: null, type:"consultant", key: `z1-${proj.id}-${field.id}`, tab:"quotes",
            createdAt: Math.min(...namedConsultants.map(c => c.createdAt || c.id)),
            pendingSince: field.recommendPendingSince || field.createdAt || field.id,
            lastEmailAt: field.recommendLastEmailAt || null,
            reminderCount: field.recommendReminderCount || 0,
            managerEmail: (managers||[]).find(m=>m.role==="domain")?.email || da.domainManagerEmail || "",
            managerName:  (managers||[]).find(m=>m.role==="domain")?.name  || da.domainManager  || "",
            stage: "recommendation", savedEmail: field._lastRecommendEmail || null });
        }
      }
      // Zone Quote: ממתין לקבלת הצעת מחיר — נעלם כשיש המלצה כלשהי בתחום
      // Zone Quote: נעלם כולו כשיש המלצה בתחום; שורה בודדת נעלמת כשמתקבלת הצעה מאותו יועץ
      const fieldHasRecommendation = field.consultants.some(c => c.recommended) || !!field.readyToRecommend;
      if (!fieldHasRecommendation) {

      if (!fieldApproved) field.consultants.filter(c => c.name?.trim() && c.recommended && !c.sentToMunicipality && !c.approved).forEach(c =>
        zoneSend.push({ projId: proj.id, projName: proj.name, fieldId: field.id, fieldName: field.fieldName,
          label: c.name, value: c.value, payType: c.payType, type:"consultant", key: `z2-${proj.id}-${field.id}-${c.id}`, tab:"quotes",

          reminderCount: c.sendToMunicipalityReminderCount || 0,
          managerEmail: "", managerName: "",
          stage: "send_to_municipality" })

      if (!fieldApproved) field.consultants.filter(c => c.name?.trim() && c.sentToMunicipality && !c.approved).forEach(c => {
        zone3.push({ projId: proj.id, projName: proj.name, fieldId: field.id, fieldName: field.fieldName,
          label: c.name, value: c.value, payType: c.payType, type:"consultant", key: `z3-${proj.id}-${field.id}-${c.id}`, tab:"quotes",
          consultantId: c.id,
          createdAt: c.createdAt || c.id, pendingSince: c.sentToMunicipalityAt || c.createdAt || c.id,

    // ── Increases ──
    const consultants = (allData[proj.id]?.consultants) || [];

        if (x.approvedIncrease) return;
        const base = { projId: proj.id, projName: proj.name, fieldName: con.role || con.name,

          zoneIncSend.push({ ...base, key:`inca-${proj.id}-${con.id}-${x.id}`, pendingSince: x.createdAt || x.id });

            managerName:  (managers||[]).find(m=>m.role==="unit")?.name  || _d.unitManager  || "",
            stage: "increase_um", savedEmail: x._lastUmEmail || null });
        } else
          zone3.push({ ...base, key:`inc3-${proj.id}-${con.id}-${x.id}`, pendingSince: x.sentToMunicipalityAt || x.createdAt || x.id,
            lastEmailAt: x.municipalityLastEmailAt || null,
            reminderCount: x.municipalityReminderCount || 0,
            managerEmail: (managers||[]).find(m=>m.role==="unit")?.email || "",
            managerName: (managers||[]).find(m=>m.role==="unit")?.name || "",
            stage: "municipality_increase" });

    // ── Invoices ──
    const accounts = (allData[proj.id]?.accounts) || [];
    // Build consultant→field map from quotes (approved only)
    const consultantFieldMap = {};
    const approvedConsultantNames = new Set();
    (allData[proj.id]?.quotes || []).forEach(field => {
      (field.consultants || []).forEach(c => {
        if (c.name?.trim()) consultantFieldMap[c.name.trim()] = field.fieldName || "";
        if (c.approved && c.name?.trim()) approvedConsultantNames.add(c.name.trim());
      });
    });
    // Build rowKey→milestone name map
    const milestoneNameMap = {};
    const companyId = allData[proj.id]?.companyId || "";
    if (companyId && milestones?.[companyId]) {
      Object.values(milestones[companyId]).forEach(mList => {
        (mList || []).forEach(m => { milestoneNameMap["m-"+m.id] = m.name || ""; });
      });
    }
    // Increases as milestone-like rows
    (allData[proj.id]?.consultants || []).forEach(con => {
      (con.increases || []).forEach(x => { milestoneNameMap["i-"+x.id] = x.reason || "הגדלה"; });
    });
    accounts.forEach(inv => {
      // Skip if no meaningful amount (must be positive number)
      if (!inv.amount || Number(inv.amount) <= 0) return;
      // Skip if consultant no longer exists as approved in quotes
      if (!approvedConsultantNames.has((inv.consultantName||"").trim())) return;
      // Off dashboard if approved by unit manager or rejected
      if (inv.unitManagerApproved || inv.toMunicipality || inv.rejected) return;

        fieldId: null, tooltip: inv.reason || "", invoiceId: inv.id,
        createdAt: inv.createdAt || inv.id };
      const d = allData[proj.id] || {};
      if (inv.toConsultant)
        zoneC.push({ ...base, key:`invc-${proj.id}-${inv.id}`, pendingSince: inv.returnedAt || inv.createdAt || inv.id });
      else if (!inv.pmApproved) {
        const _isExec2 = proj.status === "ביצוע";
        // בביצוע: מנהל הביצוע; אם לא הוגדר — מנהל התכנון. בתכנון: מנהל התכנון. אחרת ריק (לעולם לא מנהל גלובלי אקראי).
        const _useExec2 = _isExec2 && (d.executionManager || d.executionManagerEmail);

        zoneB.push({ ...base, key:`inv1-${proj.id}-${inv.id}`, managerName,

            reminderCount: inv.umReminderCount || 0,
            managerEmail: (managers||[]).find(m=>m.role==="unit")?.email || d.unitManagerEmail || "",
            managerName:  (managers||[]).find(m=>m.role==="unit")?.name  || d.unitManager  || "",
            stage: "um", savedEmail: inv._lastUmEmail || null });
        else if (!inv.toMunicipality) {
          const _mIsExec = proj.status === "ביצוע";
          const _mUseExec = _mIsExec && (d.executionManager || d.executionManagerEmail);
          zone2.push({ ...base, key:`inv3-${proj.id}-${inv.id}`, pendingSince: inv.toMunicipalityPendingSince || inv.createdAt || inv.id,
            lastEmailAt: inv.municipalityLastEmailAt || null,
            reminderCount: inv.municipalityReminderCount || 0,
            managerEmail: (_mUseExec ? d.executionManagerEmail : d.planningManagerEmail) || "",
            managerName: (_mUseExec ? d.executionManager : d.planningManager) || "",
            stage: "municipality_invoice" });
        }
      }

  const handleClick = (item) => {

              {[["סוג",70],["פרויקט",130],["תחום",90],["יועץ",100],["פרטים",180],["סכום",90],["תאריך",85]].map(([h,w]) => (
                <th key={h} style={{ padding:"9px 10px", textAlign:"right", fontSize:11, fontWeight:700, color:"#9A9A9A", borderBottom:"1px solid #E2E5EA", width:w }}>{h}</th>

          </thead>
          <tbody>
            {items.map((item, i) => {

                    background: isHighlighted ? "#EAF1FA" : i%2===0?"#fff":"#FAFBFC", transition:"background .15s" }}
                  onMouseOver={e => { if(!isHighlighted) e.currentTarget.style.background="#EFF1F5"; }}
                  onMouseOut={e  => { if(!isHighlighted) e.currentTarget.style.background=i%2===0?"#fff":"#FAFBFC"; }}>

                  <td onMouseEnter={e=>showTt(item.label!=="—"?item.label:"",e)} onMouseMove={moveTt} onMouseLeave={hideTt}
                    style={{ padding:"11px 10px", fontSize:13, color:"#3A3A3A", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", maxWidth:120 }}>{item.label !== "—" ? item.label : "—"}</td>
                  <td onMouseEnter={e=>showTt(item.detail||item.tooltip||"",e)} onMouseMove={moveTt} onMouseLeave={hideTt}
                    style={{ padding:"11px 10px", fontSize:13, color:"#3A3A3A", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", maxWidth:110 }}>{item.detail || item.tooltip || "—"}</td>
                  <td style={{ padding:"11px 10px", fontSize:13, fontWeight:700, color, whiteSpace:"nowrap" }}>{fmtVal(item)}</td>
                  <td style={{ padding:"11px 10px", fontSize:12, color:"#9A9A9A", whiteSpace:"nowrap" }}>
                    {new Date(item.pendingSince || item.createdAt || Date.now()).toLocaleDateString("en-GB")}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      )}
    </Card>
    );
  };

  const COLS = [["סוג",80],["פרויקט",160],["תחום",100],["יועץ",110],["פרטים",220],["סכום",110],["תאריך",100],["תזכורת",90]];

  // ── Reminder button — כתום אחרי 3 ימים, אדום אחרי 5 ימים ─────────────────
  const DAY = 86400000;
  const urgencyLevel = (pendingSince) => {
    if (!pendingSince) return 0;
    const d = (Date.now() - pendingSince) / DAY;
    if (d >= 5) return 2; // red
    if (d >= 3) return 1; // orange
    return 0;
  };
  const ReminderButton = ({ item }) => {
    if (!item.pendingSince) return null;
    const level = urgencyLevel(item.pendingSince);
    if (level === 0) return null;
    const reminderLine = `! זוהי הודעה חוזרת - יש להעביר התייחסות בהקדם`;
    const greet = (name) => name ? `שלום ${name},\n${reminderLine}` : `שלום רב,\n${reminderLine}`;
    const subjectMap = {
      recommendation: `פרויקט ${item.projName} - אישור יועץ- ${item.fieldName||""}`,
      pm: `פרויקט ${item.projName} - אישור חשבון ליועץ- ${item.fieldName||""}`,
      um: `פרויקט ${item.projName} - אישור חשבון ליועץ- ${item.fieldName||""}`,
      increase_um: `פרויקט ${item.projName} - אישור הגדלה ליועץ- ${item.fieldName||""}`,
      municipality_invoice: `פרויקט ${item.projName} - אישור חשבון ליועץ- ${item.fieldName||""}`,
      municipality_consultant: `פרויקט ${item.projName} – תחום- ${item.fieldName||""}`,
      municipality_increase: `פרויקט ${item.projName} - אישור הגדלה ליועץ- ${item.fieldName||""}`,
      send_to_municipality: `פרויקט ${item.projName} – תחום- ${item.fieldName||""}`,
      quote_invite: `תזכורת: בקשה להגשת הצ"מ — ${item.projName} — ${item.fieldName||""}`,
    };
    const buildEmail = () => {
      const d = allData[item.projId] || {};
      const _unitMgrR   = (managers||[]).find(m => m.role === "unit");
      const _domainMgrR = (managers||[]).find(m => m.role === "domain");
      const _isExecR    = (d.status || item.projStatus || "") === "ביצוע";
      // מנהל הפרויקט מנתוני הפרויקט: בביצוע — מנהל הביצוע ואם אין, מנהל התכנון; בתכנון — מנהל התכנון; אחרת ריק (לעולם לא מנהל גלובלי אקראי).
      const _useExecR   = _isExecR && (d.executionManager || d.executionManagerEmail);
      const _pmNameR    = (_useExecR ? d.executionManager      : d.planningManager)      || "";
      const _pmEmailR   = (_useExecR ? d.executionManagerEmail : d.planningManagerEmail) || "";
      const toEmail = item.managerEmail || "";

      // ── increase_um: rebuild from consultant data ──────────────────────────
      if (item.stage === "increase_um") {
        const con = (d.consultants||[]).find(c => c.id === item.consultantId);
        if (con) {
          const incs = con.increases || [];
          const increase = incs.find(x => x.id === item.increaseId);
          if (increase) {
            const effectiveFee = Number(con.contractFee || con._liveFee || 0);
            const approvedInc = incs.filter(x => x.approvedIncrease).reduce((s,x) => s+Number(x.amount||0), 0);
            const approvedTotal = effectiveFee + approvedInc;
            const fmtDate = d => d ? new Date(d).toLocaleDateString("he-IL") : "—";
            const incStatus = x => x.approvedIncrease ? "אושר" : x.sentToMunicipality ? "הועבר לחברה העירונית" : x.sentToManager ? "הועבר לאישור מנהל" : "ממתין";
            const tableRows = [
              ["מסגרת התקשרות קיימת", fmt(effectiveFee), "—", "בתוקף"],
              ...incs.map(x => [x.reason||"—", fmt(x.amount), fmtDate(x.date), incStatus(x)])
            ];
            const rowHighlights = [false, ...incs.map(x => x.id === item.increaseId)];
            const _umName = _unitMgrR?.name  || "";
            const _umTo   = _unitMgrR?.email || "";
            const _incField = con.role || con.name || "";
            const outro = "נא אישורכם להגדלה.\n\nבברכה,\nמערכת CostPilot";
            const _bd = buildFeeBreakdownLines(con, d.openingData||{}, d.budgetState||{}, statsRows);
            const _bdText = _bd.length ? `פירוט חישוב שכר הטרחה הבסיסי:\n${_bd.join("\n")}\n` : "";
            const intro = `${greet(_umName)}\n\nבפרויקט ${item.projName||""} התקבלה בקשה להגדלה עבור ${_incField} – ${con.name||""}\nסה"כ מאושר עד כה: ${fmt(approvedTotal)}\n${_bdText}ההגדלה המבוקשת: ${fmt(increase.amount)} ₪.\nלהלן מסגרת ההתקשרות הקיימת ליועץ:`;
            const body = `${intro}\n\n${outro}`;
            const htmlBody = buildEmailHtml(intro, ["פרט","סכום","תאריך","סטטוס"], tableRows, outro, rowHighlights);
            return { body, htmlBody, toEmail: _umTo };
          }
        }
      }

      // ── pm / um: rebuild exact table from accounts + milestones ─────────────
      if (item.stage === "pm" || item.stage === "um") {
        const allAccounts = d.accounts || [];
        const invRow = allAccounts.find(r => r.id === item.invoiceId);
        if (invRow) {
          const invNum = invRow.invoiceNum;
          const invRows = allAccounts.filter(r => String(r.invoiceNum||"").trim() === String(invNum).trim());
          const totalAmt = invRows.reduce((s,r) => s+Number(r.amount||0), 0);
          const rowKeySet = new Set(invRows.map(r => r.rowKey));
          const invConsultantName = invRow.consultantName || "";
          const quotesRows = d.quotes || [];
          // Find consultant in quotes
          const firstFieldByName = {};
          quotesRows.forEach(fg => (fg.consultants||[]).forEach(c => { if (c.approved && c.name?.trim() && !firstFieldByName[c.name.trim()]) firstFieldByName[c.name.trim()] = fg.fieldName||""; }));
          const invFieldName = invRow.fieldName || firstFieldByName[invConsultantName] || "";
          const fieldGroup = quotesRows.find(fg => fg.fieldName === invFieldName || (fg.consultants||[]).some(c => c.name?.trim()===invConsultantName && c.approved));
          const cData = fieldGroup ? (fieldGroup.consultants||[]).find(c => c.name?.trim()===invConsultantName && c.approved) : null;
          const cRow = (d.consultants||[]).find(r => r.id === "q-"+(cData?.id||""));
          const selIncreases = ((cRow?.increases || cData?.increases || []).filter(x => x.approvedIncrease));
          const contractFee = cRow?.contractFee ?? (cData ? Number(cData.value||0) : 0);
          const selSubItems = cData?.subItems || [];
          const useSubItems = selSubItems.length > 0;
          // fieldMilestones
          const compId = String(d.companyId||"");
          const localMs = d.localMilestones || {};
          const hasLocalMs = (localMs[invFieldName]?.length || 0) > 0;
          const fieldMilestones = hasLocalMs ? (localMs[invFieldName]||[]) : (findMilestoneTemplate(milestones, compId, invFieldName) || []);
          // rowTotal — approved non-rejected invoices only
          const rowTotalFn = key => allAccounts.filter(r => r.rowKey===key && r.unitManagerApproved && !r.rejected).reduce((s,r)=>s+Number(r.amount||0),0);
          // milestoneAllocation
          const negInc = selIncreases.filter(x=>Number(x.amount||0)<0).reduce((s,x)=>s+Number(x.amount||0),0);
          const msAlloc = (() => {
            if (!negInc || fieldMilestones.length===0) return {};
            const newFee = contractFee + negInc; let excess=0; const res={};
            fieldMilestones.forEach(m => {
              const key="m-"+m.id; const paid=rowTotalFn(key); const maxAmt=Math.max(0,newFee*Number(m.pct||0)/100);
              if (paid>maxAmt) { excess+=(paid-maxAmt); res[key]={baseAmt:maxAmt,isOverpaid:true,isComplete:false}; }
              else { const sn=maxAmt-paid; if(excess>=sn){excess-=sn;res[key]={baseAmt:maxAmt,isOverpaid:false,isComplete:true};}
                else if(excess>0){excess=0;res[key]={baseAmt:maxAmt,isOverpaid:false,isComplete:false};}
                else{res[key]={baseAmt:maxAmt,isOverpaid:false,isComplete:false};} }
            }); return res;
          })();
          const headers = ["אבן דרך","% מחוזה","% מצטבר שולם","% מבוקש בחשבון","סכום בחוזה בש\"ח","שולם ","יתרה ","סכום חשבון "];
          // pm/um
          const msRows = useSubItems ? [] : fieldMilestones.map(m => {
            const key="m-"+m.id; const required=msAlloc[key]?.baseAmt??(contractFee*Number(m.pct||0)/100);
            const paid=rowTotalFn(key); const isCurrent=rowKeySet.has(key);
            const paidPct=required>0?(paid/required*100).toFixed(1):"0";
            const thisRow=invRows.find(r=>r.rowKey===key);
            return [m.name||"—",`${fmtPct(m.pct)}%`,`${paidPct}%`,isCurrent&&thisRow?.pct?`${fmtPct(thisRow.pct)}%`:"—",fmt(required),fmt(paid),fmt(Math.max(0,required-paid)),isCurrent?fmt(Number(thisRow?.amount||0)):"—"];
          });

          style={{ padding:"4px 10px", fontSize:11, fontWeight:700, borderRadius:4, border:"none", cursor:"pointer", fontFamily:"'Heebo',sans-serif", whiteSpace:"nowrap",
            background: isRed ? "#F8EDED" : "#FAF2E6",
            color: isRed ? "#5C2020" : "#5C3D10",
            animation: isRed ? "reminder-blink 1.2s ease-in-out infinite" : "none" }}>
          📧 {isRed ? "תזכורת!" : "תזכורת"}
        </button>
        {item.lastEmailAt && (
          <span style={{ fontSize:10, color:"#9A9A9A", whiteSpace:"nowrap" }}>
            {new Date(item.lastEmailAt).toLocaleDateString("en-GB")}
          </span>
        )}
      </div>
    );
  };

  const zones = [
    { title:"המתנה לקבלת הצעת מחיר", items:zoneQuote, color:"#163356", bg:"#EAF1FA", border:"#D4E4F4", icon:"📨", emptyText:"אין ספקים הממתינים להגשת הצעת מחיר" },
    { title:"ממתין להמלצה על יועצים", items:zoneA,  color:"#5C3D10", bg:"#FAF2E6", border:"#FAF2E6", icon:"⏳", emptyText:"אין פריטים ממתינים" },
    { title:"ממתין להעברה לאישור מנהל", items:zoneIncSend, color:"#5C3D10", bg:"#FAF2E6", border:"#FAF2E6", icon:"📨", emptyText:"אין הגדלות הממתינות להעברה למנהל" },
    { title:"ממתין לאישור מנהל פרויקט",                    items:zoneB,  color:"#163356", bg:"#EAF1FA", border:"#D4E4F4", icon:"👤", emptyText:"אין חשבונות הממתינים לאישור מנהל פרויקט", groupByManager:true },
    { title:"ממתין לאישור מנהל יחידה",                     items:zoneUM, color:"#163356", bg:"#EAF1FA", border:"#D4E4F4", icon:"👔", emptyText:"אין חשבונות הממתינים לאישור מנהל יחידה" },
    { title:"הוחזר ליועץ לתיקון",                           items:zoneC,  color:"#5C2020", bg:"#F8EDED", border:"#F0D8D8", icon:"↩️", emptyText:"אין חשבונות שהוחזרו ליועץ" },
    { title:"ממתין להעברה לחברה העירונית",                  items:zoneSend, color:"#163356", bg:"#EAF1FA", border:"#D4E4F4", icon:"📋", emptyText:"אין יועצים הממתינים להעברה" },
    { title:"ממתין לאישור מזמין",                           items:[...zone2, ...zone3], color:"#0C5749", bg:"#EEF9F7", border:"#D4F3EE", icon:"📤", emptyText:"אין פריטים הממתינים לאישור מזמין" },
  ];

  const visibleZones = zones.filter(z => z.items.length > 0);

  return (
    <div className="fade" style={{ display:"flex", flexDirection:"column", flex:1, minHeight:0, overflow:"hidden" }}>
      {tt.visible && (
        <div style={{ position:"fixed", left:tt.x+14, top:tt.y-36, zIndex:9999, background:"#0B1F3A", color:"#fff",
          padding:"5px 12px", borderRadius:4, fontSize:12, pointerEvents:"none", maxWidth:340,
          wordBreak:"break-word", boxShadow:"0 2px 8px rgba(0,0,0,.25)" }}>
          {tt.text}
        </div>
      )}
      <div style={{ flexShrink:0, padding:"28px 32px 0" }}>
        <div style={{ marginBottom:24 }}>
          <div style={{ fontSize:11, color:"#767676", fontWeight:600, letterSpacing:"0.06em", textTransform:"uppercase", marginBottom:4 }}>גיליון גלובלי</div>
          <h1 style={{ fontSize:24, fontWeight:900, color:"#0D0D0D", margin:0 }}>לוח בקרה</h1>
          <div style={{ fontSize:13, color:"#767676", marginTop:2 }}>מעקב סטטוס יועצים, הגדלות וחשבונות בכל הפרויקטים</div>
        </div>
      </div>
      <div style={{ flex:1, overflowY:"auto", minHeight:0, padding:"0 32px 32px" }}>
      {visibleZones.length === 0 ? (
        <Card style={{ padding:"52px 20px", textAlign:"center" }}>
          <div style={{ fontSize:34, marginBottom:12 }}>✓</div>
          <div style={{ fontSize:17, fontWeight:700, color:"#0D0D0D" }}>הכל מסודר</div>
          <div style={{ fontSize:13, color:"#767676", marginTop:6 }}>אין פריטים הממתינים לטיפול</div>
        </Card>
      ) : (
        <div style={{ display:"flex", flexDirection:"column", gap:22 }}>
          {visibleZones.map(zone => (
            <Card key={zone.title} style={{ padding:0, overflow:"hidden" }}>
              <div style={{ padding:"14px 20px", background:zone.bg, borderBottom:"2px solid "+zone.border, display:"flex", alignItems:"center", gap:10 }}>
                <span style={{ fontSize:20 }}>{zone.icon}</span>
                <div style={{ fontWeight:800, fontSize:15, color:zone.color }}>{zone.title}</div>
              </div>
              <table style={{ width:"100%", borderCollapse:"collapse", direction:"rtl", tableLayout:"fixed" }}>
                <colgroup>
                  {COLS.map(([,w]) => <col key={w} style={{ width:w }} />)}
                </colgroup>
                <thead>
                  <tr style={{ background:"#F7F8FA", borderBottom:"1px solid #E2E5EA" }}>
                    {COLS.map(([h]) => (
                      <th key={h} style={{ padding:"8px 18px", textAlign:"right", fontSize:11, fontWeight:700, color:"#767676" }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {(() => {
                    if (!zone.groupByManager) {
                      return zone.items.map((item, i) => {
                        const isHighlighted = highlightKey === item.key;
                        const _lvl = urgencyLevel(item.pendingSince);
                        const rowBg = isHighlighted ? "#EAF1FA" : _lvl===2 ? "#F8EDED" : _lvl===1 ? "#FAF2E6" : i%2===0?"#fff":"#FAFBFC";
                        const rowBgHover = _lvl===2 ? "#F0D8D8" : _lvl===1 ? "#F0E4CC" : "#EFF1F5";
                        return (
                          <tr key={item.key} onClick={() => handleClick(item)}
                            style={{ cursor:"pointer", borderBottom: i < zone.items.length-1 ? "1px solid #F0F2F5" : "none",
                              background: rowBg, transition:"background .15s" }}
                            onMouseOver={e => { if(!isHighlighted) e.currentTarget.style.background=rowBgHover; }}
                            onMouseOut={e  => { if(!isHighlighted) e.currentTarget.style.background=rowBg; }}>
                            <td style={{ padding:"11px 18px" }}><TypeBadge type={item.type} /></td>
                            <td style={{ padding:"11px 18px", fontSize:13, fontWeight:600, color:"#0D0D0D", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{item.projName}</td>
                            <td style={{ padding:"11px 18px", fontSize:13, color:"#3A3A3A", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{item.fieldName}</td>
                            <td style={{ padding:"11px 18px", fontSize:13, color:"#3A3A3A", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{item.label !== "—" ? item.label : "—"}</td>
                            <td onMouseEnter={e=>showTt(item.detail||item.tooltip||"",e)} onMouseMove={moveTt} onMouseLeave={hideTt} style={{ padding:"11px 18px", fontSize:13, color:"#3A3A3A", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{item.detail || item.tooltip || "—"}</td>
                            <td style={{ padding:"11px 18px", fontSize:13, fontWeight:700, color:zone.color, whiteSpace:"nowrap" }}>{fmtVal(item)}</td>
                            <td style={{ padding:"11px 18px", fontSize:12, color:"#767676", whiteSpace:"nowrap" }}>{new Date(item.pendingSince || item.createdAt || Date.now()).toLocaleDateString("en-GB")}</td>
                            <td style={{ padding:"6px 10px" }}><ReminderButton item={item} /></td>
                          </tr>
                        );
                      });
                    }
                    // Group by managerName
                    const groups = [];
                    const seen = {};
                    zone.items.forEach(item => {
                      const key = item.managerName || "ללא מנהל משויך";
                      if (!seen[key]) { seen[key] = true; groups.push({ mgr: key, items: [] }); }
                      groups.find(g => g.mgr === key).items.push(item);
                    });
                    return groups.map(group => (
                      <React.Fragment key={group.mgr}>
                        <tr>
                          <td colSpan={COLS.length} style={{ padding:"7px 18px", background:"#F0F2F5", borderTop:"1px solid #E2E5EA", borderBottom:"1px solid #E2E5EA", fontSize:12, fontWeight:700, color:"#163356" }}>
                            👤 {group.mgr}
                          </td>
                        </tr>
                        {group.items.map((item, i) => {
                          const isHighlighted = highlightKey === item.key;
                          const _lvl = urgencyLevel(item.pendingSince);
                          const rowBg = isHighlighted ? "#EAF1FA" : _lvl===2 ? "#F8EDED" : _lvl===1 ? "#FAF2E6" : i%2===0?"#fff":"#FAFBFC";
                          const rowBgHover = _lvl===2 ? "#F0D8D8" : _lvl===1 ? "#F0E4CC" : "#EFF1F5";
                          return (
                            <tr key={item.key} onClick={() => handleClick(item)}
                              style={{ cursor:"pointer", borderBottom: i < group.items.length-1 ? "1px solid #F0F2F5" : "none",
                                background: rowBg, transition:"background .15s" }}
                              onMouseOver={e => { if(!isHighlighted) e.currentTarget.style.background=rowBgHover; }}
                              onMouseOut={e  => { if(!isHighlighted) e.currentTarget.style.background=rowBg; }}>
                              <td style={{ padding:"11px 18px" }}><TypeBadge type={item.type} /></td>
                              <td style={{ padding:"11px 18px", fontSize:13, fontWeight:600, color:"#0D0D0D", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{item.projName}</td>
                              <td style={{ padding:"11px 18px", fontSize:13, color:"#3A3A3A", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{item.fieldName}</td>
                              <td style={{ padding:"11px 18px", fontSize:13, color:"#3A3A3A", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{item.label !== "—" ? item.label : "—"}</td>
                              <td onMouseEnter={e=>showTt(item.detail||item.tooltip||"",e)} onMouseMove={moveTt} onMouseLeave={hideTt} style={{ padding:"11px 18px", fontSize:13, color:"#3A3A3A", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{item.detail || item.tooltip || "—"}</td>
                              <td style={{ padding:"11px 18px", fontSize:13, fontWeight:700, color:zone.color, whiteSpace:"nowrap" }}>{fmtVal(item)}</td>
                              <td style={{ padding:"11px 18px", fontSize:12, color:"#767676", whiteSpace:"nowrap" }}>{new Date(item.pendingSince || item.createdAt || Date.now()).toLocaleDateString("en-GB")}</td>
                              <td style={{ padding:"6px 10px" }}><ReminderButton item={item} /></td>
                            </tr>
                          );
                        })}
                      </React.Fragment>
                    ));
                  })()}
                </tbody>
              </table>
            </Card>
          ))}
        </div>
      )}
      </div>
    </div>
  );
}

function ProjectNumber({ value, onChange, readOnly }) {
  const [editing, setEditing] = useState(false);
  const [val, setVal] = useState(value);
  React.useEffect(() => { setVal(value); }, [value]);
  const save = () => { onChange(val); setEditing(false); };
  if (!readOnly && editing) return (
    <input autoFocus value={val} onChange={e=>setVal(e.target.value)}
      onBlur={save} onKeyDown={e=>{if(e.key==="Enter")save();if(e.key==="Escape")setEditing(false);}}
      placeholder="מס׳ פרויקט"
      style={{ fontSize:12, color:"#444444", background:"#F7F8FA", border:"1.5px solid #163356", borderRadius:4, padding:"4px 8px", fontFamily:"'Heebo',sans-serif", outline:"none", width:120, textAlign:"right" }} />
  );
  return (
    <span onClick={readOnly ? undefined : ()=>{setVal(value);setEditing(true);}}
      style={{ fontSize:12, color: value?"#444444":"#9A9A9A", cursor: readOnly?"default":"pointer", padding:"4px 8px", border:"1.5px solid #E2E5EA", borderRadius:4, background:"#F7F8FA", fontFamily:"'Heebo',sans-serif", display:"inline-block", lineHeight:1.4, whiteSpace:"nowrap" }}
      title={readOnly ? undefined : "לחץ לעריכת מספר"}>
      {value || "מס׳ פרויקט"}
    </span>
  );
}

function EditableYear({ year, onChange, readOnly }) {
  const [editing, setEditing] = useState(false);
  const [val, setVal] = useState(year ?? "");
  React.useEffect(() => { setVal(year ?? ""); }, [year]);
  const save = () => {
    const trimmed = String(val).trim();
    if (trimmed === "") { onChange(null); }
    else if (trimmed.length === 4 && !isNaN(Number(trimmed))) { onChange(Number(trimmed)); }
    setEditing(false);
  };
  if (!readOnly && editing) return (
    <input autoFocus type="number" value={val}
      onChange={e => setVal(e.target.value)}
      onBlur={save}
      onKeyDown={e => { if(e.key==="Enter") save(); if(e.key==="Escape") setEditing(false); }}
      style={{ width:80, fontSize:12, color:"#444444", background:"#F7F8FA", border:"1.5px solid #163356", borderRadius:4, padding:"4px 8px", fontFamily:"'Heebo',sans-serif", outline:"none", textAlign:"center" }} />
  );
  return (
    <span onClick={readOnly ? undefined : () => { setVal(year ?? ""); setEditing(true); }}
      style={{ fontSize:12, color: year?"#444444":"#9A9A9A", cursor: readOnly?"default":"pointer", padding:"4px 8px", border:"1.5px solid #E2E5EA", borderRadius:4, background:"#F7F8FA", fontFamily:"'Heebo',sans-serif", display:"inline-block", lineHeight:1.4, whiteSpace:"nowrap" }}
      title={readOnly ? undefined : "לחץ לעריכת שנה"}>
      {year || "שנה"}
    </span>
  );
}

function EditableName({ name, onChange, readOnly }) {
  const [editing, setEditing] = useState(false);
  const [val, setVal] = useState(name);
  if (readOnly) return <span style={{ fontSize:24, fontWeight:900, color:"#0D0D0D" }}>{name}</span>;
  if (editing) return (
    <input autoFocus type="text" value={val}
      onChange={e => setVal(e.target.value)}
      onBlur={() => { if(val.trim()) onChange(val.trim()); setEditing(false); }}
      onKeyDown={e => { if(e.key==="Enter"){ if(val.trim()) onChange(val.trim()); setEditing(false); } if(e.key==="Escape") setEditing(false); }}
      style={{ fontSize:24, fontWeight:900, color:"#0D0D0D", background:"#F0F2F5", border:"1px solid #D0D5DD", borderRadius:4, padding:"2px 8px", fontFamily:"'Heebo',sans-serif", outline:"none", minWidth:200 }} />
  );
  return (
    <span onClick={() => { setVal(name); setEditing(true); }}
      style={{ fontSize:24, fontWeight:900, color:"#0D0D0D", cursor:"pointer" }}
      title="לחץ לעריכת שם הפרויקט">
      {name}
    </span>
  );
}

// ── Tab: פתיחת פרויקט ────────────────────────────────────────────────────────
function OpeningTab({ data, setData, budgetState, setBudgetState, statsRows, projectName, projectNumber, quotesRows, suppliers, companies, companyId, onCompanyChange, managers, planningManagerId, executionManagerId, unitManagerId, onManagerChange, isAdmin }) {
  const upd = (k, v) => setData(prev => ({ ...(prev||{}), [k]: v }));
  const updMulti = patch => setData(prev => ({ ...(prev||{}), ...patch }));
  const updBudget = (k, v) => setBudgetState(prev => ({ ...(prev||{}), [k]: v }));

  const contractorEst = Number(String(data?.contractorEst||"").replace(/,/g,""));
  const devPct = (statsRows||[]).filter(r=>(r.field||"").includes("פיתוח")||(r.field||"").includes("נוף")).reduce((s,r)=>s+Number(r.pct||0),0);
  const archBase = contractorEst ? contractorEst - contractorEst * devPct / 100 : 0;

  const planningMgrs  = (managers||[]).filter(m => m.role === "planning");
  const executionMgrs = (managers||[]).filter(m => m.role === "execution");
  const unitMgrs      = (managers||[]).filter(m => m.role === "unit");
  const legacyPM = !planningManagerId && data?.planningManager ? data.planningManager : null;
  const legacyEM = !executionManagerId && data?.executionManager ? data.executionManager : null;
  const selectStyle = { width:"100%", border:"1px solid #E2E5EA", background:"#fff", textAlign:"right", direction:"rtl", fontSize:13, fontFamily:"'Heebo',sans-serif", outline:"none", color:"#0D0D0D", borderRadius:4, padding:"5px 8px", boxSizing:"border-box", cursor: isAdmin ? "pointer" : "default" };

  const rows = [
    { key:"address",         label:"כתובת",                              type:"text" },
    { key:"workDescription", label:"מהות העבודה",                        type:"text" },
    { key:"startDate",       label:"תאריך התחלה מתוכנן",                 type:"date" },
    { key:"endDate",         label:"תאריך סיום מתוכנן",                  type:"date" },
    { key:"plotArea",        label:"שטח החלקה",                           type:"text" },
    { key:"buildingArea",    label:"שטח המבנה",                           type:"text" },
    { key:"devArea",         label:"שטח הפיתוח",                          type:"text" },
    { key:"municipalEst",    label:"אומדן עירוני לפרויקט (הערכה ראשונית)", type:"text" },
    { key:"contractorEst",   label:"עלות קבלנית (הערכה ראשונית)",         type:"text", linked:true },
    { key:"archBase",        label:"ערך מבנה לאדריכל",                   type:"calc" },
    { key:"elevators",       label:"כמות מעליות (הערכה)",                 type:"text" },
    { key:"trees",           label:"כמות עצים",                           type:"text" },
    { key:"bim",             label:"BIM",                                  type:"checkbox" },
  ];

  return (
    <div style={{ maxWidth:700 }}>
      <table style={{ width:"100%", borderCollapse:"collapse", border:"1px solid #E2E5EA", borderRadius:8, overflow:"hidden" }}>
        <tbody>
          {/* חברה עירונית */}
          <tr style={{ background:"#fff" }}>
            <td style={{ padding:"10px 16px", textAlign:"right", color:"#3A3A3A", fontSize:13, width:"50%", borderBottom:"1px solid #E2E5EA", borderLeft:"1px solid #E2E5EA", verticalAlign:"middle" }}>חברה עירונית</td>
            <td style={{ padding:"10px 16px", textAlign:"right", fontSize:13, width:"50%", borderBottom:"1px solid #E2E5EA", verticalAlign:"middle" }}>
              <select value={companyId||""} disabled={!isAdmin} onChange={isAdmin ? e => onCompanyChange(e.target.value) : undefined} style={selectStyle}>
                <option value="">בחר חברה עירונית</option>
                {(companies||[]).map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
            </td>
          </tr>
          {/* מנהל תכנון */}
          <tr style={{ background:"#F7F8FA" }}>
            <td style={{ padding:"10px 16px", textAlign:"right", color:"#3A3A3A", fontSize:13, width:"50%", borderBottom:"1px solid #E2E5EA", borderLeft:"1px solid #E2E5EA", verticalAlign:"middle" }}>מנהל תכנון</td>
            <td style={{ padding:"10px 16px", textAlign:"right", fontSize:13, width:"50%", borderBottom:"1px solid #E2E5EA", verticalAlign:"middle" }}>
              <select value={planningManagerId || (legacyPM ? "__legacy_pm__" : "")} disabled={!isAdmin} onChange={isAdmin ? e => { if (e.target.value !== "__legacy_pm__") onManagerChange("planning", e.target.value); } : undefined} style={selectStyle}>
                <option value="">בחר מנהל תכנון</option>
                {legacyPM && <option value="__legacy_pm__">{legacyPM}</option>}
                {planningMgrs.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
              </select>
            </td>
          </tr>
          {/* מנהל ביצוע */}
          <tr style={{ background:"#fff" }}>
            <td style={{ padding:"10px 16px", textAlign:"right", color:"#3A3A3A", fontSize:13, width:"50%", borderBottom:"1px solid #E2E5EA", borderLeft:"1px solid #E2E5EA", verticalAlign:"middle" }}>מנהל ביצוע</td>
            <td style={{ padding:"10px 16px", textAlign:"right", fontSize:13, width:"50%", borderBottom:"1px solid #E2E5EA", verticalAlign:"middle" }}>
              <select value={executionManagerId || (legacyEM ? "__legacy_em__" : "")} disabled={!isAdmin} onChange={isAdmin ? e => { if (e.target.value !== "__legacy_em__") onManagerChange("execution", e.target.value); } : undefined} style={selectStyle}>
                <option value="">בחר מנהל ביצוע</option>
                {legacyEM && <option value="__legacy_em__">{legacyEM}</option>}
                {executionMgrs.map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
              </select>
            </td>
          </tr>
          {rows.map((r, i) => (
            <tr key={r.key} style={{ background: (i+1)%2===0?"#fff":"#F7F8FA" }}>
              <td style={{ padding:"10px 16px", textAlign:"right", color:"#3A3A3A", fontSize:13, width:"50%", borderBottom:"1px solid #E2E5EA", borderLeft:"1px solid #E2E5EA", verticalAlign:"middle", fontWeight: r.key==="archBase"?400:400 }}>
                {r.label}
              </td>
              <td style={{ padding:"10px 16px", textAlign:"right", fontSize:13, width:"50%", borderBottom:"1px solid #E2E5EA", verticalAlign:"middle" }}>
                  {r.type === "checkbox" ? (
                    <label style={{ display:"flex", alignItems:"center", gap:8, cursor:"pointer", userSelect:"none" }}>
                      <input type="checkbox"
                        checked={data?.[r.key] !== false}
                        onChange={e => upd(r.key, e.target.checked)}
                        style={{ width:16, height:16, cursor:"pointer", accentColor:"#0B1F3A" }} />
                      <span style={{ fontSize:13, color: data?.[r.key] !== false ? "#0E7C6A" : "#9A9A9A", fontWeight:600 }}>
                        {data?.[r.key] !== false ? "כן — כולל חישובי BIM" : "לא — ללא חישובי BIM"}
                      </span>
                    </label>
                  ) : r.type === "date" ? (
                    <FlatpickrDate value={data?.[r.key]||""} onChange={v => upd(r.key, v)}
                      style={{ width:"100%", border:"1px solid #E2E5EA", background:"#fff", textAlign:"right", fontSize:13, fontFamily:"'Heebo',sans-serif", outline:"none", color:"#0D0D0D", borderRadius:4, padding:"5px 8px", boxSizing:"border-box" }} />
                  ) : r.type === "calc" ? (
                    <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                      <input type="text" value={data?.[r.key]||""}
                        onChange={e => upd(r.key, e.target.value)}
                        placeholder={archBase ? archBase.toLocaleString("he-IL", {minimumFractionDigits:0, maximumFractionDigits:0}) : ""}
                        style={{ flex:1, border:`1px solid ${data?.[r.key] ? "#F0D4B0" : "#E2E5EA"}`, background: data?.[r.key] ? "#FAF2E6" : "#fff", textAlign:"right", direction:"rtl", fontSize:13, fontFamily:"'Heebo',sans-serif", outline:"none", color:"#0D0D0D", borderRadius:4, padding:"5px 8px", boxSizing:"border-box" }}
                        onFocus={e=>e.target.style.borderColor="#444444"} onBlur={e=>e.target.style.borderColor= data?.[r.key] ? "#F0D4B0" : "#E2E5EA"} />
                      {data?.[r.key] ? (
                        <>
                          <span style={{ fontSize:11, fontWeight:700, color:"#5C3D10", background:"#FAF2E6", border:"1px solid #F0D4B0", borderRadius:10, padding:"2px 8px", whiteSpace:"nowrap" }}>ידני</span>
                          <button onClick={() => upd(r.key, "")} title="אפס לחישוב אוטומטי"
