                            style={{ background:"none", border:"none", color:"#5C2020", cursor:"pointer", fontSize:16, padding:"0 2px", lineHeight:1 }}>×</button>
                        </>
                      ) : archBase > 0 && (
                        <span style={{ fontSize:11, color:"#9A9A9A", whiteSpace:"nowrap" }}>אוטומטי</span>
                      )}
                    </div>
                  ) : (
                    <input type="text" value={data?.[r.key]||""}
                      onChange={e => { upd(r.key, e.target.value); if(r.linked) updBudget("contractorEst", e.target.value.replace(/,/g,"")); }}
                      onBlur={e => {
                        const raw = e.target.value.replace(/,/g,"");
                        const num = Number(raw);
                        if (!isNaN(num) && raw !== "") {
                          if (r.linked) updMulti({ [r.key]: num.toLocaleString("en-US"), contractorEstDate: new Date().toISOString().split("T")[0] });
                          else upd(r.key, num.toLocaleString("en-US"));
                        }
                      }}
                      onFocus={e => {
                        const raw = (data?.[r.key]||"").replace(/,/g,"");
                        upd(r.key, raw);
                      }}
                      placeholder=""
                      style={{ width:"100%", border:"1px solid #E2E5EA", background:"#fff", textAlign:"right", direction:"rtl", fontSize:13, fontFamily:"'Heebo',sans-serif", outline:"none", color:"#0D0D0D", borderRadius:4, padding:"5px 8px", boxSizing:"border-box" }}
                      onFocus2={e=>e.target.style.borderColor="#444444"} onBlur2={e=>e.target.style.borderColor="#E2E5EA"} />
                  )}
              </td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function AppInner({ currentUser, userRole, setUserRole }) {
  const uid = currentUser.uid;
  const isAdmin = (userRole?.role === "admin") || false;
  // צפייה-בלבד: דגל גלובלי שחוסם שליחת מיילים (openOutlookEmail) ליוזר שאינו admin
  useEffect(() => { window.__costpilotReadOnly = !isAdmin; }, [isAdmin]);

  const [projects, _setProjects] = useState([]);
  const setProjects = v => { if (!isAdmin) return; _setProjects(v); }; // צפייה-בלבד (הסנכרון משתמש ב-_setProjects)

  // Load SheetJS
  useEffect(() => {
    if (window.XLSX) return;
    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js";
    document.head.appendChild(script);
  }, []);

  const [allData, _setAllData] = useState({});
  const setAllData = v => { if (!isAdmin) return; _setAllData(v); }; // צפייה-בלבד: כל מוטציה לנתוני פרויקט חסומה ליוזר רגיל (הסנכרון משתמש ב-_setAllData)
  const [dataLoaded, setDataLoaded] = useState(false);

  // סינון פרויקטים לפי הרשאה - אחרי שה-state מוגדר.
  // קישור חד-כיווני: מנהל פרויקט (תכנון/ביצוע) הרשום בפתיחת הפרויקט רואה אוטומטית את הפרויקט,
  // לפי התאמת כתובת המייל שלו — מבלי לשנות הרשאות ידניות וללא כתיבה כלשהי (לא משפיע על שם המנהל).
  const _myEmail = (currentUser?.email || userRole?.email || "").trim().toLowerCase();
  const _myExcluded = ((userRole?.excludedProjects) || []).map(String);
  const _isManagedByMe = (p) => {
    if (!_myEmail) return false;
    const d = allData[p.id] || {};
    return (d.planningManagerEmail || "").trim().toLowerCase() === _myEmail
        || (d.executionManagerEmail || "").trim().toLowerCase() === _myEmail;
  };
  const visibleProjects = isAdmin
    ? projects
    : projects.filter(p => {
        const id = String(p.id);
        if (((userRole?.projects) || []).map(String).includes(id)) return true;  // הקצאה ידנית — תמיד גלוי
        return _isManagedByMe(p) && !_myExcluded.includes(id);                    // הקצאה אוטומטית — אלא אם הוסתרה ידנית
      });

  // מעקב גישה אחרונה לפרויקט (לצורך מיון)
  const [lastAccessed, setLastAccessed] = useState(() => {
    try { return JSON.parse(localStorage.getItem("cp_last_accessed")||"{}"); } catch(e) { return {}; }
  });
  const touchProject = (p) => {
    setLastAccessed(prev => {
      const updated = { ...prev, [p.id]: Date.now() };
      try { localStorage.setItem("cp_last_accessed", JSON.stringify(updated)); } catch(e) {}
      return updated;
    });
  };
  const ACTIVE_STATUSES = ["תכנון","ביצוע"];
  const sortedVisibleProjects = [...visibleProjects].sort((a,b) => {
    const ta = lastAccessed[a.id] || a.createdAt || a.id;
    const tb = lastAccessed[b.id] || b.createdAt || b.id;
    return tb - ta;
  });

  // real-time sync — מנוי לכל המסמכים המשותפים + per-project docs
  const fsReceived = React.useRef({});
  const projSubsRef = React.useRef({});
  useEffect(() => {
    let nonProjLoaded = 0;
    let projDataLoaded = false;
    const OTHER_KEYS = ["suppliers","companies","milestones","statsRows","workScopes","managers"];
    const setters = {
      suppliers:  d => _setSuppliers(migrateSuppliers(d)),
      companies:  d => _setCompanies(d),
      milestones: d => _setMilestones(d),
      statsRows:  d => _setStatsRows(d),
      workScopes: d => _setWorkScopes(d),
      managers:   d => _setManagers(d),
    };
    const checkDone = () => {
      if (nonProjLoaded >= OTHER_KEYS.length && projDataLoaded) setDataLoaded(true);
    };

    // מנויים למסמכים הכלליים (לא allData)
    const otherUnsubs = OTHER_KEYS.map(key => subscribeShared(key, async d => {
      if (d === null) d = await loadFromFirestore(uid, key);
      if (d !== null) { fsReceived.current[key] = true; setters[key](d); setTimeout(() => { fsReceived.current[key] = false; }, 200); }
      nonProjLoaded++; checkDone();
    }));

    // מנוי לרשימת הפרויקטים
    const projUnsub = subscribeShared("projects", async data => {
      if (data === null) data = [];
      fsReceived.current["projects"] = true;
      _setProjects(data);
      setTimeout(() => { fsReceived.current["projects"] = false; }, 200);

      // טיפול בפרויקטים חדשים — גם בטעינה ראשונה וגם בעדכונים עתידיים
      const newProjects = data.filter(p => !projSubsRef.current[p.id]);

      if (!projDataLoaded) {
        projDataLoaded = true;
        // טעינת נתוני כל פרויקט בנפרד (עם fallback ל-allData הישן)
        const oldData_ref = { value: null };
        const combined = {};
        await Promise.all(data.map(async p => {
          let d = await loadProjectData(p.id);
          if (d === null) {
            // מיגרציה מ-shared/allData
            if (oldData_ref.value === null) {
              const { db, doc, getDoc } = getFirebase();
              const s = await getDoc(doc(db, "shared", "allData"));
              oldData_ref.value = s.exists() ? JSON.parse(s.data().value) : {};
            }
            d = oldData_ref.value[p.id] || makeProjectData();
            saveProjectData(p.id, d); // שמור במבנה החדש
          }
          combined[String(p.id)] = d;
        }));
        // Sync: ensure approved quotes consultants appear in consultants array
        const synced = {};
        const toResave = [];
        Object.keys(combined).forEach(id => {
          const s = syncProjectData(combined[id]);
          synced[id] = s;
          if (s !== combined[id]) toResave.push(id);
        });
        _setAllData(synced);
        toResave.forEach(id => saveProjectData(id, synced[id]));
        checkDone();
      } else if (newProjects.length > 0) {
        // פרויקטים חדשים שנוספו אחרי הטעינה הראשונית — טען אותם
        const additions = {};
        await Promise.all(newProjects.map(async p => {
          const d = await loadProjectData(p.id);
          additions[String(p.id)] = syncProjectData(d || makeProjectData());
        }));
        _setAllData(prev => ({ ...prev, ...additions }));
      }

      // הירשם לעדכונים real-time לפרויקטים חדשים
      newProjects.forEach(p => {
        projSubsRef.current[p.id] = subscribeProjectData(p.id, newD => {
          if (newD !== null) {
            fsReceived.current["allData"] = true;
            _setAllData(prev => ({ ...prev, [p.id]: syncProjectData(newD) }));
            setTimeout(() => { fsReceived.current["allData"] = false; }, 200);
          }
        });
      });
    });

    return () => {
      otherUnsubs.forEach(u => u && u());
      projUnsub && projUnsub();
      Object.values(projSubsRef.current).forEach(u => u && u());
      projSubsRef.current = {};
    };
  }, [uid]);

  const [selectedProj, setSelectedProj] = useState(null);
  const [activeTab,    setActiveTab]    = useState("budget");
  const [highlightFieldId, setHighlightFieldId] = useState(null);
  const [openConsultantId, setOpenConsultantId] = useState(null);
  const [pendingBimAmount, setPendingBimAmount] = useState(0);
  const [scrollToIncreaseId, setScrollToIncreaseId] = useState(null);
  const [openInvoiceId, setOpenInvoiceId] = useState(null);
  const [showModal,    setShowModal]    = useState(false);
  const [projSearch,        setProjSearch]        = useState("");
  const [sidebarSearch,     setSidebarSearch]     = useState("");
  const [showSettings,      setShowSettings]      = useState(false);
  const [projStatusFilters, setProjStatusFilters] = useState([]);
  const [showStatusDrop,   setShowStatusDrop]   = useState(false);
  const statusDropRef = React.useRef(null);
  useEffect(() => {
    if (!showStatusDrop) return;
    const handler = (e) => {
      if (statusDropRef.current && !statusDropRef.current.contains(e.target)) {
        setShowStatusDrop(false);
      }
    };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [showStatusDrop]);
  const [deleteConfirmProj, setDeleteConfirmProj] = useState(null);
  const [newPForm,     setNewPForm]     = useState({ name:"", companyId:"", year:new Date().getFullYear() });
  const [toast,        setToast]        = useState(null);
  const [showStats,    setShowStats]    = useState(false);
  const [globalPage,   setGlobalPage]   = useState("dashboard");


  // ── Suppliers (global) ──────────────────────────────────────────────────────
  const [suppliers, _setSuppliers] = useState([]);
  const setSuppliers = v => { if (!isAdmin) return; _setSuppliers(v); }; // צפייה-בלבד: רק admin משנה נתונים גלובליים
  useEffect(() => { if (isAdmin && dataLoaded && !fsReceived.current["suppliers"]) saveToFirestore(uid, "suppliers", suppliers); }, [suppliers, dataLoaded]);

  // ── Municipal companies (global) ────────────────────────────────────────────
  const [companies, _setCompanies] = useState([]);
  const setCompanies = v => { if (!isAdmin) return; _setCompanies(v); }; // צפייה-בלבד
  useEffect(() => { if (isAdmin && dataLoaded && !fsReceived.current["companies"]) saveToFirestore(uid, "companies", companies); }, [companies, dataLoaded]);

  // ── Milestones per company per profession (global) ──────────────────────────
  // structure: { [companyId]: { [profession]: [ {id,name,pct,planOnly} ] } }
  const [milestones, _setMilestones] = useState({});
  const setMilestones = v => { if (!isAdmin) return; _setMilestones(v); }; // צפייה-בלבד
  useEffect(() => { if (isAdmin && dataLoaded && !fsReceived.current["milestones"]) saveToFirestore(uid, "milestones", milestones); }, [milestones, dataLoaded]);

  // ── Work scopes per field (global) ──────────────────────────────────────────
  const [workScopes, _setWorkScopes] = useState({});
  const setWorkScopes = v => { if (!isAdmin) return; _setWorkScopes(v); }; // צפייה-בלבד
  useEffect(() => { if (isAdmin && dataLoaded && !fsReceived.current["workScopes"]) saveToFirestore(uid, "workScopes", workScopes); }, [workScopes, dataLoaded]);

  // ── Managers (global) ────────────────────────────────────────────────────────
  // { id, name, role: "unit"|"planning"|"execution"|"domain", email, phone }
  const [managers, _setManagers] = useState([]);
  const setManagers = v => { if (!isAdmin) return; _setManagers(v); }; // צפייה-בלבד
  useEffect(() => { if (isAdmin && dataLoaded && !fsReceived.current["managers"]) saveToFirestore(uid, "managers", managers); }, [managers, dataLoaded]);

  // ── Statistics (global, persisted separately) ───────────────────────────
  const DEFAULT_STATS = [
    { id:1,  field:"אדריכלות" },
    { id:2,  field:"קונסטרוקציה" },
    { id:3,  field:"איטום" },
    { id:4,  field:"חשמל ותקשורת" },
    { id:5,  field:"מיזוג אוויר" },
    { id:6,  field:"מעליות" },
    { id:7,  field:"אינסטלציה" },
    { id:8,  field:"פיתוח" },
  ];
  const [statsRows, _setStatsRows] = useState(DEFAULT_STATS.map(s => ({ ...s, pct:"" })));
  const setStatsRows = v => { if (!isAdmin) return; _setStatsRows(v); }; // צפייה-בלבד
  useEffect(() => { if (isAdmin && dataLoaded && !fsReceived.current["statsRows"]) saveToFirestore(uid, "statsRows", statsRows); }, [statsRows, dataLoaded]);

  // After initial load: match imported manager TEXT names → IDs so OpeningTab dropdowns work
  useEffect(() => {
    if (!dataLoaded || managers.length === 0) return;
    const updates = {};
    Object.keys(allData).forEach(projId => {
      const d = allData[projId];
      if (!d) return;
      let upd = null;
      const tryMatch = (textKey, idKey, emailKey) => {
        if (d[textKey] && !d[idKey]) {
          const m = managers.find(m => m.name === d[textKey]);
          if (m) {
            if (!upd) upd = { ...d };
            upd[idKey]    = m.id;
            upd[emailKey] = m.email || "";
          }
        }
      };
      tryMatch("planningManager",  "planningManagerId",  "planningManagerEmail");
      tryMatch("executionManager", "executionManagerId", "executionManagerEmail");
      if (upd) updates[projId] = upd;
    });
    if (isAdmin && Object.keys(updates).length > 0) {
      setAllData(prev => {
        const next = { ...prev, ...updates };
        Object.keys(updates).forEach(id => saveProjectData(id, next[id]));
        return next;
      });
    }
  }, [dataLoaded, managers]); // eslint-disable-line react-hooks/exhaustive-deps

  const notify = msg => { setToast(msg); setTimeout(() => setToast(null), 2500); };

  const [showBackupModal,   setShowBackupModal]   = useState(false);
  const [showBackupConfirm, setShowBackupConfirm] = useState(false);
  const [backupText, setBackupText] = useState("");
  const [backupDirName, setBackupDirName] = useState("");
  const [pendingBackupData, setPendingBackupData] = useState(null);
  const [showRestoreModal, setShowRestoreModal] = useState(false);
  const [restoreStep, setRestoreStep] = useState("choice");
  const restoreModeRef = React.useRef("all");
  const restoreFileInputRef = React.useRef(null);
  const backupDirRef = React.useRef(null);

  // Load saved backup dir handle
  useEffect(() => {
    _bkpDB.load().then(async handle => {
      if (!handle) return;
      try {
        const perm = await handle.queryPermission({ mode: "readwrite" });
        if (perm === "granted" || perm === "prompt") {
          backupDirRef.current = handle;
          setBackupDirName(handle.name);
        } else { _bkpDB.clear(); }
      } catch(e) { _bkpDB.clear(); }
    }).catch(() => {});
  }, []);

  // Auto-save to Firestore - must be before any early return
  useEffect(() => { if (isAdmin && dataLoaded && !fsReceived.current["projects"]) saveToFirestore(uid, "projects", projects); }, [projects, dataLoaded]);
  const prevAllDataRef = React.useRef(null);
  useEffect(() => {
    if (!isAdmin || !dataLoaded || fsReceived.current["allData"]) return;
    const prev = prevAllDataRef.current;
    prevAllDataRef.current = allData;
    if (prev === null) return;
    Object.keys(allData).forEach(id => {
      if (allData[id] !== prev[id]) saveProjectData(id, allData[id]);
    });
  }, [allData, dataLoaded]);

  // הקפאה חד-פעמית: פרויקטים קיימים עם חשבונות בתחום וללא צילום מקומי — מקפיאים לתבנית הנוכחית,
  // כך ששינוי עתידי בתבנית הגלובלית לא ישנה אותם רטרואקטיבית. כל פרויקט מעובד פעם אחת בלבד.
  const freezeMigRef = React.useRef(new Set());
  useEffect(() => {
    if (!isAdmin || !dataLoaded) return;
    if (!milestones || Object.keys(milestones).length === 0) return; // ממתינים שהתבניות ייטענו
    Object.keys(allData).forEach(projId => {
      if (freezeMigRef.current.has(projId)) return;
      const d = allData[projId];
      if (!d) return;
      freezeMigRef.current.add(projId);
      const companyId = String(d.companyId || "");
      if (!companyId) return;
      const existingLocal = d.localMilestones || {};
      const accountedFields = new Set(
        (d.accounts || [])
          .filter(r => String(r.rowKey || "").startsWith("m-") && String(r.fieldName || "").trim())
          .map(r => String(r.fieldName).trim())
      );
      const frozen = {};
      accountedFields.forEach(field => {
        if (existingLocal[field]) return; // לא לדרוס צילום קיים
        const tpl = findMilestoneTemplate(milestones, companyId, field) || [];
        if (tpl.length > 0) frozen[field] = tpl.map(m => ({ ...m }));
      });
      if (Object.keys(frozen).length > 0) {
        setAllData(prev => ({
          ...prev,
          [projId]: {
            ...(prev[projId] || makeProjectData()),
            localMilestones: { ...((prev[projId] || {}).localMilestones || {}), ...frozen },
          },
        }));
      }
    });
  }, [allData, milestones, dataLoaded]);

  if (!dataLoaded) return (
    <div style={{ minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", fontFamily:"'Heebo',sans-serif", color:"#9A9A9A", fontSize:16 }}>
      ⏳ טוען נתונים...
    </div>
  );

  // ── project CRUD ─────────────────────────────────────────────────────────
  const addProject = () => {
    if (!isAdmin) return; // צפייה-בלבד
    if (!newPForm.name.trim()) return;
    const p = { ...newPForm, id: Date.now(), status:"", createdAt: Date.now() };
    const newProjData = { ...makeProjectData(), companyId: newPForm.companyId||"" };
    setProjects(prev => {
      const updated = [...prev, p];
      saveProjects(updated);
      return updated;
    });
    setAllData(prev => {
      const updated = { ...prev, [p.id]: newProjData };
      saveAllData(updated);
      return updated;
    });
    saveProjectData(p.id, newProjData);
    projSubsRef.current[p.id] = subscribeProjectData(p.id, newD => {
      if (newD !== null) {
        fsReceived.current["allData"] = true;
        _setAllData(prev => ({ ...prev, [p.id]: syncProjectData(newD) }));
        setTimeout(() => { fsReceived.current["allData"] = false; }, 200);
      }
    });
    setNewPForm({ name:"", companyId:"", year:new Date().getFullYear() });
    setShowModal(false);
    notify("פרויקט נוסף בהצלחה!");
  };

  const deleteProject = id => {
    if (!isAdmin) return; // צפייה-בלבד
    setProjects(prev => { const u = prev.filter(p => p.id !== id); saveProjects(u); return u; });
    setAllData(prev => { const u = {...prev}; delete u[id]; saveAllData(u); return u; });
    if (projSubsRef.current[id]) { projSubsRef.current[id](); delete projSubsRef.current[id]; }
    if (selectedProj?.id === id) setSelectedProj(null);
  };

  // ── Export project to Excel ──────────────────────────────────────────────
  const exportProjectToExcel = (proj, { returnBlob=false }={}) => {
    const XLSX = window.XLSX;
    if (!XLSX) { alert("ספריית Excel לא נטענה, נסה שוב"); return; }
    const d = allData[proj.id] || {};
    const o = d.openingData || {};
    const bs = d.budgetState || {};
    const company = companies.find(c => String(c.id) === String(d.companyId));
    const wb = XLSX.utils.book_new();
    wb.Workbook = { Views: [{ RTL: true }] };

    // Style palette
    const ST = {
      H:  { font:{bold:true,sz:11,color:{rgb:"FFFFFF"}},   fill:{fgColor:{rgb:"1E40AF"},patternType:"solid"}, alignment:{horizontal:"right",vertical:"center"} },
      S:  { font:{bold:true,sz:11,color:{rgb:"1E293B"}},   fill:{fgColor:{rgb:"BFDBFE"},patternType:"solid"}, alignment:{horizontal:"right"} },
      T:  { font:{bold:true,sz:11,color:{rgb:"78350F"}},   fill:{fgColor:{rgb:"FEF9C3"},patternType:"solid"}, alignment:{horizontal:"right"} },
      G:  { font:{bold:true,sz:12,color:{rgb:"7C2D12"}},   fill:{fgColor:{rgb:"FDE68A"},patternType:"solid"}, alignment:{horizontal:"right"} },
      I:  { font:{sz:10,color:{rgb:"334155"}},             fill:{fgColor:{rgb:"EFF6FF"},patternType:"solid"}, alignment:{horizontal:"right"} },
      D0: { font:{sz:10}, fill:{fgColor:{rgb:"FFFFFF"},patternType:"solid"}, alignment:{horizontal:"right"} },
      D1: { font:{sz:10}, fill:{fgColor:{rgb:"F0F9FF"},patternType:"solid"}, alignment:{horizontal:"right"} },
      E:  { fill:{fgColor:{rgb:"FFFFFF"},patternType:"solid"} },
    };
    const styleRow = (ws, r, style, maxC) => {
      for (let c=0; c<=maxC; c++) {
        const a = XLSX.utils.encode_cell({r,c});
        if (!ws[a]) ws[a] = {v:"",t:"s"};
        ws[a].s = style;
      }
    };
    const finalize = (ws, colW) => {
      ws['!views'] = [{rightToLeft:true}];
      if (colW) ws['!cols'] = colW.map(w=>({wch:w}));
    };
    const makeSimple = (rows, colW) => {
      const ws = XLSX.utils.aoa_to_sheet(rows);
      finalize(ws, colW);
      const rng = XLSX.utils.decode_range(ws['!ref']||"A1:A1");
      styleRow(ws, 0, ST.H, rng.e.c);
      for (let r=1; r<=rng.e.r; r++) styleRow(ws, r, r%2===1?ST.D0:ST.D1, rng.e.c);
      return ws;
    };

    // Pre-calculate exportAllRows (used in both sheet 3 and sheet 5)
    const cId = d.companyId || "";
    const exportBState = {
      ...bs,
      contractorEst: String(o.contractorEst||"").replace(/,/g,"") || bs.contractorEst || "",
      municipalEst:  String(o.municipalEst||"").replace(/,/g,"")  || bs.municipalEst  || "",
    };
    const exportPlanOnlyMap = {};
    (() => {
      const _cEst  = Number(exportBState.contractorEst||0);
      const _dPct  = (statsRows||[]).filter(r=>(r.field||"").includes("פיתוח")||(r.field||"").includes("נוף")).reduce((s,r)=>s+Number(r.pct||0),0);
      const _archBaseManualExp = Number(String(o.archBase||"").replace(/[,\s]/g,"").replace(/[^\d.]/g,""));
      const _aBase = _archBaseManualExp > 0 ? _archBaseManualExp : _cEst - _cEst * _dPct / 100;
      const _localMsMap = d.localMilestones || {};
      (d.quotes||[]).forEach(fg => {
        (fg.consultants||[]).forEach(c => {
          if (!c.approved||!c.name?.trim()) return;
          const key = (fg.fieldName||"") + "::" + c.name.trim();
          const ms = _localMsMap[(fg.fieldName||"").trim()] || (findMilestoneTemplate(milestones, cId, fg.fieldName||"") || []);
          if (c.subItems && c.subItems.length > 0) {
            exportPlanOnlyMap[key] = (exportPlanOnlyMap[key]||0) +
              c.subItems.filter(it=>it.planOnly).reduce((s,it)=>s+Number(it.amount||0),0);
          } else {
            const isPct = (c.payType||"אחוזים")==="אחוזים";
            const pct   = Number(c.value||0)/100;
            let fee = 0;
            if (!isPct)                                                          fee = Number(c.value||0);
            else if (["אדריכל","אדריכלות","אדריכלים"].includes((fg.fieldName||"").trim()) && _cEst)       fee = _aBase * pct;
            else if ((fg.fieldName||"").includes("מנהל פרויקט") && _cEst)       fee = _cEst * pct;
            else if (_cEst) { const pp = profStatPct(statsRows, fg.fieldName)/100; fee = _cEst*pp*pct; }
            exportPlanOnlyMap[key] = (exportPlanOnlyMap[key]||0) +
              ms.filter(m=>m.planOnly).reduce((s,m)=>s+fee*Number(m.pct||0)/100, 0);
          }
          // Add approved planOnly increases for this consultant
          const consultantEntry = (d.consultants||[]).find(con => con.id === "q-"+c.id);
          if (consultantEntry) {
            (consultantEntry.increases||[]).filter(x=>x.approvedIncrease&&x.planOnly).forEach(x=>{
              exportPlanOnlyMap[key] = (exportPlanOnlyMap[key]||0) + Number(x.amount||0);
            });
          }
        });
      });
    })();
    const exportAllRows = buildBudgetAllRows({
      quotesRows: d.quotes||[], consultantsRows: d.consultants||[],
      budgetState: exportBState, statsRows,
      accountsRows: d.accounts||[], planOnlyMap: exportPlanOnlyMap, openingData: o,
    });
    const toNum = (v) => { const n = Number(String(v||"").replace(/,/g,"").replace(/[^\d.\-]/g,"")); return isNaN(n) ? "" : n; };
    const fmtDate = d => {
      if (!d) return "";
      if (/^\d{2}\/\d{2}\/\d{4}$/.test(d)) return d;
      if (/^\d{4}-\d{2}-\d{2}/.test(d)) { const [y,m,day]=d.split(/[-T]/); return `${day}/${m}/${y}`; }
      return d;
    };

    // 1. פתיחת פרויקט
    const openingRows = [
      ["שדה","ערך"],
      ["שם פרויקט", proj.name],
      ["חברה עירונית", company?.name||""],
      ["מנהל תכנון", d.planningManager||""],
      ["מנהל ביצוע", d.executionManager||""],
      ["מספר פרויקט", d.projectNumber||""],
      ["כתובת", o.address||""],
      ["מהות העבודה", o.workDescription||""],
      ["תאריך התחלה", o.startDate||""],
      ["תאריך סיום", o.endDate||""],
      ["שטח מבנה (מ.ר)", o.buildingArea||""],
      ["אומדן עירוני", o.municipalEst||""],
      ["אומדן קבלני", o.contractorEst||""],
      ["כמות מעליות", o.elevators||""],
      ["כמות עצים", o.trees||""],
    ];
    XLSX.utils.book_append_sheet(wb, makeSimple(openingRows, [24,40]), "פתיחת פרויקט");

    // 2. הצעות מחיר יועצים
    const quotesRows = [["תחום","שם יועץ","סוג תשלום","ערך","המלצה","הועבר לחברה","אושר","הערות"]];
    (d.quotes||[]).forEach(field => {
      (field.consultants||[]).forEach(c => {
        quotesRows.push([field.fieldName||"", c.name||"", c.payType||"", c.value||"",
          c.recommended?"כן":"לא", c.sentToMunicipality?"כן":"לא", c.approved?"כן":"לא", c.notes||""]);
      });
    });
    XLSX.utils.book_append_sheet(wb, makeSimple(quotesRows, [16,22,14,10,10,14,10,28]), "הצעות מחיר יועצים");

    // 3. רשימת יועצים - פירוט פיננסי לפי יועץ
    const consRows = [["תחום","שם יועץ","סוג תשלום","ערך/אחוז","סכום התקשרות","הגדלות מאושרות","סה כ חוזה","סכום ששולם","יתרה לתשלום","סכום התקשרות לשלב התכנון","העדר תביעות","הערות"]];
    exportAllRows.forEach(r => {
      const isPct = r.payType === "אחוזים";
      const baseFee = r.computedFee || 0;
      const totalFee = baseFee + (r.increases||0);
      const remaining = totalFee - (r.paid||0);
      const hasCEst = !!Number(exportBState.contractorEst||0);
      const showFee = hasCEst || !isPct;
      consRows.push([
        r.field||"", r.name||"", r.payType||"",
        isPct ? ((r.value||0)+"%") : (r.value||""),
        showFee ? baseFee : "",
        r.increases||0,
        showFee ? totalFee : "",
        r.paid||0,
        showFee ? remaining : "",
        r.planOnly>0 ? r.planOnly : "",
        r.noClaims ? "כן" : "לא",
        r.notes||""
      ]);
    });
    XLSX.utils.book_append_sheet(wb, makeSimple(consRows, [16,22,12,12,16,16,16,16,16,14,12,24]), "רשימת יועצים");

    // 4. ריכוז חשבונות
    const milestoneNameMap = {};
    if (cId && milestones?.[cId]) {
      Object.values(milestones[cId]).forEach(mList => {
        (mList||[]).forEach(m => { milestoneNameMap["m-"+m.id] = { name: m.name||"", pct: m.pct||0, planOnly: !!m.planOnly }; });
      });
    }
    // Local milestones override company milestones
    Object.values(d.localMilestones||{}).forEach(mList => {
      (mList||[]).forEach(m => { milestoneNameMap["m-"+m.id] = { name: m.name||"", pct: m.pct||0, planOnly: !!m.planOnly }; });
    });
    // SubItems (keyed "s-")
    (d.quotes||[]).forEach(fg => {
      (fg.consultants||[]).forEach(c => {
        if (!c.approved || !c.name?.trim()) return;
        (c.subItems||[]).forEach(it => {
          milestoneNameMap["s-"+it.id] = { name: it.description||"", pct: 100, planOnly: !!it.planOnly };
        });
      });
    });
    (d.consultants||[]).forEach(con => {
      (con.increases||[]).forEach(x => { milestoneNameMap["i-"+x.id] = { name: x.reason||"הגדלה", pct: 100, planOnly: !!x.planOnly }; });
    });
    const validConsultantsByField = new Set(exportAllRows.map(r => r.name + "::" + r.field));
    const validConsultantNames    = new Set(exportAllRows.map(r => r.name));
    const accRows = [["יועץ","שם אבן הדרך","אחוז","מס חשבון","תאריך קבלה","סכום","אישור מנהל פרויקט","אישור מנהל יחידה","אישור מזמין","הוחזר ליועץ","נדחה","תכנון בלבד","הערות"]];
    (d.accounts||[]).filter(r => {
      if (!milestoneNameMap[r.rowKey]) return false;
      const name = r.consultantName||"";
      return r.fieldName
        ? validConsultantsByField.has(name + "::" + r.fieldName)
        : validConsultantNames.has(name);
    }).forEach(r => {
      const ms = milestoneNameMap[r.rowKey] || { name:"", pct:"" };
      accRows.push([r.consultantName||"", ms.name, ms.pct, r.invoiceNum||"", fmtDate(r.receiptDate||""), r.amount||"",
        r.pmApproved?"כן":"לא", r.unitManagerApproved?"כן":"לא", r.toMunicipality?"כן":"לא",
        r.toConsultant?"כן":"לא", r.rejected?"כן":"לא", ms.planOnly?"כן":"לא", r.reason||""]);
    });
    XLSX.utils.book_append_sheet(wb, makeSimple(accRows, [18,22,8,12,14,14,14,14,14,12,10,12,22]), "ריכוז חשבונות");

    // 5. תקציב הפרויקט
    const budgetRows = [], budgetTypes = [];
    const bPush = (row, type) => { budgetRows.push(row); budgetTypes.push(type); };

    bPush(["סעיף","ערך","","","","","",""], "hdr");
    bPush(["אומדן עירוני",       toNum(o.municipalEst  || bs.municipalEst),"","","","","",""], "info");
    bPush(["אומדן קבלני",        toNum(o.contractorEst || bs.contractorEst),"","","","","",""], "info");
    bPush(["כתב כמויות / מכרז", toNum(bs.tenderDocs),"","","","","",""], "info");
    bPush(["חשבון קבלן סופי",   toNum(bs.finalAccount),"","","","","",""], "info");
    bPush(["","","","","","","",""], "empty");
    bPush(["אישור פרויקט","","","","","","",""], "section");
    bPush(["אישור ממונה עירוני", toNum(bs.approvalActual),"","","","","",""], "info");
    bPush(["קיזוז דמי הקמה",    toNum(bs.setupOffset),"","","","","",""], "info");
    var xApprovalTotal = toNum(bs.approvalActual) + toNum(bs.setupOffset);
    bPush(["סה\"כ אישור פרויקט", xApprovalTotal,"","","","","",""], "total");
    bPush(["","","","","","","",""], "empty");
    bPush(["תקציב שהתקבל","","","","","","",""], "section");
    (bs.extraItems||[]).forEach(x => bPush([x.desc||"", toNum(x.amount),"","","","","",""], "info"));
    var xReceivedTotal = (bs.extraItems||[]).reduce((s,x)=>s+(toNum(x.amount)||0),0);
    bPush(["סה\"כ התקבל", xReceivedTotal,"","","","","",""], "total");
    var xNeeded = xApprovalTotal - xReceivedTotal;
    bPush([xNeeded<0?"עודף":"נדרש להשלמה", Math.abs(xNeeded),"","","","","",""], xNeeded<0?"total":"grand");
    bPush(["","","","","","","",""], "empty");
    bPush(["פירוט תקציב הפרויקט","","","","","","",""], "section");
    bPush(["שם המקצוע","שם היועץ","סכום התקשרות","סכום ששולם","יתרה לתשלום","סכום התקשרות לשלב התכנון","העדר תביעות","הערות"], "hdr");
    let dIdx = 0;
    exportAllRows.forEach(r => {
      const baseFee  = r.computedFee;
      const totalFee = baseFee + r.increases;
      const remaining= totalFee - r.paid;
      const hasBase  = !!Number(exportBState.contractorEst||0) || r.payType !== "אחוזים";
      bPush([r.field, r.name, !hasBase?(r.value+"%"):totalFee, r.paid, !hasBase?"":remaining, r.planOnly>0?r.planOnly:"", r.noClaims?"כן":"לא", r.notes], dIdx++%2===0?"d0":"d1");
    });
    var xConsTotal = 0, xConsPaid = 0;
    exportAllRows.forEach(r => { xConsTotal += r.computedFee + r.increases; xConsPaid += (r.paid||0); });
    bPush(["","","","","","","",""], "empty");
    bPush(["סה כ יועצים","",xConsTotal,xConsPaid,xConsTotal-xConsPaid,"","",""], "total");

    var xFixedFeeNames = ["פיצויי נופי","תאגיד המים - לא דמי הקמה","כיבוי אש","חח\"י","בזק","הוט","רשות העתיקות","תיק מידע"];
    var xFeeRows = bs.feeRows || xFixedFeeNames.map(function(name) { return { id:name, name:name, contract:"", paid:"", planOnly:"", noClaims:false, notes:"" }; });
    var xAllFees = xFeeRows.concat(bs.extraFeeRows||[]);
    var xFeeTot = 0, xFeePaid = 0;
    bPush(["","","","","","","",""], "empty");
    bPush(["אגרות","","","","","","",""], "section");
    xAllFees.forEach(function(r, i) {
      var c=Number(r.contract||0), p=Number(r.paid||0); xFeeTot+=c; xFeePaid+=p;
      bPush(["אגרות",r.name||"",c||"",p||"",r.noClaims?0:c-p,c||"",r.noClaims?"כן":"לא",r.notes||""], i%2===0?"d0":"d1");
    });
    bPush(["סה כ אגרות","",xFeeTot,xFeePaid,xFeeTot-xFeePaid,"","",""], "total");

    var xCC=Number(bs.contractorContract||0), xCP=Number(bs.contractorPaid||0);
    var xCNoClaims=!!bs.contractorNoClaims, xCPlanOnly=Number(bs.contractorPlanOnly||0), xCRem=xCNoClaims?0:xCC-xCP;
    bPush(["","","","","","","",""], "empty");
    bPush(["קבלן","","","","","","",""], "section");
    bPush(["קבלן","קבלן ראשי",xCC||"",xCP||"",xCRem,xCPlanOnly||"",xCNoClaims?"כן":"לא",bs.contractorNotes||""], "d0");
    bPush(["סה כ קבלן","",xCC,xCP,xCRem,"","",""], "total");

    var xBase=xConsTotal+xFeeTot+xCC;
    var xOP=Number(bs.overheadPct||4), xOA=xBase*xOP/100, xOPaid=Number(bs.overheadPaid||0), xOPlanOnly=Number(bs.overheadPlanOnly||0);
    var xBB=xBase+xOA, xBP=Number(bs.bcmPct||0), xBA=xBB*xBP/100, xBPaid=Number(bs.bcmPaid||0), xBPlanOnly=Number(bs.bcmPlanOnly||0);
    var xVP=Number(bs.vatPct||18), xVA=(xBB+xBA)*xVP/100, xVPaid=Number(bs.vatPaid||0), xVPlanOnly=Number(bs.vatPlanOnly||0);
    var xOhTot=xOA+xBA+xVA;
    bPush(["","","","","","","",""], "empty");
    bPush(["תקורות","","","","","","",""], "section");
    bPush(["תקורות חברה עירונית",xOP+"%",xOA,xOPaid,xOA-xOPaid,xOPlanOnly||"","",bs.overheadNotes||""], "d0");
    bPush(["בצמ",xBP+"%",xBA,xBPaid,xBA-xBPaid,xBPlanOnly||"","",bs.bcmNotes||""], "d1");
    bPush(["מעמ",xVP+"%",xVA,xVPaid,xVA-xVPaid,xVPlanOnly||"","",bs.vatNotes||""], "d0");
    bPush(["סה כ תקורות","",xOhTot,xOPaid+xBPaid+xVPaid,xOhTot-(xOPaid+xBPaid+xVPaid),"","",""], "total");

    var xGrand=xConsTotal+xFeeTot+xCC+xOhTot, xGrandPaid=xConsPaid+xFeePaid+xCP+xOPaid+xBPaid+xVPaid;
    bPush(["","","","","","","",""], "empty");
    bPush(["סה כ כללי","",xGrand,xGrandPaid,xGrand-xGrandPaid,"","",""], "grand");

    const budgetWs = XLSX.utils.aoa_to_sheet(budgetRows);
    finalize(budgetWs, [25,25,16,16,16,16,12,30]);
    budgetTypes.forEach((type, r) => {
      const s = type==="hdr" ? ST.H : type==="section" ? ST.S : type==="total" ? ST.T
              : type==="grand" ? ST.G : type==="info" ? ST.I : type==="d1" ? ST.D1 : type==="empty" ? ST.E : ST.D0;
      styleRow(budgetWs, r, s, 7);
    });
    XLSX.utils.book_append_sheet(wb, budgetWs, "תקציב הפרויקט");

    // 6. תוצאות מכרז
    (() => {
      const cEst6 = Number(String(o.contractorEst||"").replace(/,/g,"")) || 0;
      const devPct6 = (statsRows||[]).filter(r=>(r.field||"").includes("פיתוח")||(r.field||"").includes("נוף")).reduce((s,r)=>s+Number(r.pct||0),0);
      const archBaseM6 = Number(String(o.archBase||"").replace(/[,\s]/g,"").replace(/[^\d.]/g,""));
      const archBase6 = archBaseM6 > 0 ? archBaseM6 : cEst6 - cEst6 * devPct6 / 100;
      const tRows6 = d.tender || [];
      const boqMeta6 = tRows6.find(r=>r.key==="__meta__") || {};
      const card1 = [["תחום","שם יועץ","שכ\"ט %","אומדן פרק ראשוני","שכ\"ט ראשוני","שכ\"ט BIM"]];
      const card2 = [["תחום","שם יועץ","שכ\"ט %","תאריך","כתב כמויות","שכ\"ט מעודכן","הגדלה נדרשת","שכ\"ט BIM מעודכן","הגדלה נדרשת BIM"]];
      (d.quotes||[]).forEach(field => {
        (field.consultants||[]).filter(c=>c.approved&&c.name?.trim()&&(c.payType||"אחוזים")==="אחוזים").forEach(c => {
          const feePct = Number(c.value||0);
          const isArch = ["אדריכל","אדריכלות","אדריכלים"].includes((field.fieldName||"").trim());
          const isPM   = (field.fieldName||"").includes("מנהל פרויקט");
          const isArchOrPM = isArch || isPM;
          let sectionEst = 0;
          if (isArch && cEst6)    sectionEst = archBase6;
          else if (isPM && cEst6) sectionEst = cEst6;
          else if (cEst6) { const pp=profStatPct(statsRows, field.fieldName)/100; sectionEst=cEst6*pp; }
          const initialFee = sectionEst * feePct / 100;
          const consultantRow = (d.consultants||[]).find(r=>r.id==="q-"+c.id);
          const hasBIM = !!(consultantRow?.increases||[]).some(x=>x.isBIM);
          let bim = null; let planningPct = 0;
          if (!isArchOrPM && hasBIM) {
            const ems = cId ? ((d.localMilestones||{})[field.fieldName] || (milestones||{})[cId]?.[field.fieldName] || []) : [];
            planningPct = ems.filter(m=>m.planOnly).reduce((s,m)=>s+Number(m.pct||0),0);
            bim = initialFee * planningPct / 100 * 0.15;
          }
          card1.push([field.fieldName||"", c.name.trim(), feePct+"%",
            sectionEst||"—", initialFee ? Math.round(initialFee) : "—",
            bim!==null&&bim>0 ? Math.round(bim) : "—"]);
          const key = (field.fieldName||"")+"__"+(c.name.trim());
          const saved = tRows6.find(r=>r.key===key)||{};
          const doc1 = Number(saved.doc1||0);
          const updatedFee = doc1 ? doc1 * feePct/100 : null;
          const increase   = updatedFee!==null ? updatedFee - initialFee : null;
          const bimUpdated = (updatedFee!==null && hasBIM) ? updatedFee * planningPct/100 * 0.15 : null;
          const bimIncrease= (bimUpdated!==null && bim!==null) ? bimUpdated - bim : null;
          card2.push([field.fieldName||"", c.name.trim(), feePct+"%",
            fmtDate(saved.date||""), doc1||"—",
            updatedFee!==null ? Math.round(updatedFee) : "—",
            increase!==null ? Math.round(increase) : "—",
            bimUpdated!==null ? Math.round(bimUpdated) : "—",
            bimIncrease!==null ? Math.round(bimIncrease) : "—"]);
        });
      });
      const tenderAoa = [["מצב קיים","","","","",""],...card1,
        [],["אומדן מעודכן לפי מכרז","","","","","","","",""],
        ...card2];
      if (boqMeta6.boq) tenderAoa.unshift(["כתב כמויות קבלני", boqMeta6.boq, fmtDate(boqMeta6.boqDate||""),"","","","","",""]);
      const tenderWs = XLSX.utils.aoa_to_sheet(tenderAoa);
      finalize(tenderWs, [16,22,10,14,14,14,14,14,14]);
      tenderWs['!views'] = [{rightToLeft:true}];
      XLSX.utils.book_append_sheet(wb, tenderWs, "תוצאות מכרז");
    })();

    // 7. חשבון קבלן סופי
    (() => {
      const cEst = Number(String(o.contractorEst||"").replace(/,/g,"")) || 0;
      const devPct = (statsRows||[]).filter(r=>(r.field||"").includes("פיתוח")||(r.field||"").includes("נוף")).reduce((s,r)=>s+Number(r.pct||0),0);
      const archBaseManualC = Number(String(o.archBase||"").replace(/[,\s]/g,"").replace(/[^\d.]/g,""));
      const archBase = archBaseManualC > 0 ? archBaseManualC : cEst - cEst * devPct / 100;
      const contractorSaved = d.contractor || [];
      const tRows = d.tender || [];
      const fmt = n => { const v=Number(n); return (!n&&n!==0)||isNaN(v)?"—":v.toLocaleString("he-IL"); };
      const conRows = [["תחום","שם יועץ","% שכ\"ט","שכ\"ט ראשוני","בסיס מכרז","שכ\"ט מכרז","חשבון סופי","תאריך","הפרש"]];
      (d.quotes||[]).forEach(field => {
        (field.consultants||[]).filter(c=>c.approved&&c.name?.trim()&&(c.payType||"אחוזים")==="אחוזים").forEach(c => {
          const feePct  = Number(c.value||0);
          const isArch  = ["אדריכל","אדריכלות","אדריכלים"].includes((field.fieldName||"").trim());
          const isPM    = (field.fieldName||"").includes("מנהל פרויקט");
          let sectionEst = 0;
          if (isArch && cEst)      sectionEst = archBase;
          else if (isPM && cEst)   sectionEst = cEst;
          else if (cEst) { const pp=profStatPct(statsRows, field.fieldName)/100; sectionEst=cEst*pp; }
          const initialFee = sectionEst ? sectionEst * feePct / 100 : null;
          const key = (field.fieldName||"")+"__"+(c.name.trim());
          const tSaved = tRows.find(r=>r.key===key)||{};
          const tBase = Number(tSaved.doc2||0) || Number(tSaved.doc1||0);
          const tenderFee = tBase ? tBase * feePct/100 : null;
          const cSaved = contractorSaved.find(r=>r.key===key)||{};
          const finalAmt = cSaved.finalAmt !== undefined ? Number(cSaved.finalAmt||0) : null;
          const diff = (finalAmt !== null && tenderFee !== null) ? finalAmt - tenderFee : null;
          conRows.push([
            field.fieldName||"", c.name.trim(), feePct+"%",
            initialFee !== null ? initialFee : "—",
            tBase || "—",
            tenderFee !== null ? tenderFee : "—",
            finalAmt !== null ? finalAmt : "—",
            cSaved.date||"",
            diff !== null ? diff : "—",
          ]);
        });
      });
      const metaC = contractorSaved.find(r=>r.key==="__meta__")||{};
      if (metaC.finalBoq || metaC.finalAccount) {
        conRows.push([]);
        conRows.push(["חשבון קבלן סופי (כולל)","","","","","",metaC.finalAccount||"","",""]);
      }
      XLSX.utils.book_append_sheet(wb, makeSimple(conRows, [18,22,10,16,16,16,16,14,14]), "חשבון קבלן סופי");
    })();

    // 8. דירוג יועצים
    (() => {
      const ratingRows = [["תחום","יועץ","שירות/זמינות","מקצועיות","ממוצע בפרויקט","ממוצע כללי"]];
      (d.quotes||[]).forEach(field => {
        (field.consultants||[]).filter(c=>c.approved&&c.name?.trim()).forEach(c => {
          const nm = c.name.trim();
          const sup = (suppliers||[]).find(s => namesEquivalent(s.name, nm));
          const entry = (sup?.ratings||[]).find(r => r.projectName === proj.name);
          const overall = getSupplierAvg(sup?.name || nm, suppliers);
          ratingRows.push([
            field.fieldName||"", nm,
            entry?.service ?? "—",
            entry?.professionalism ?? "—",
            entry?.avg != null ? Number(entry.avg) : "—",
            overall != null ? Number(overall.toFixed(1)) : "—",
          ]);
        });
      });
      XLSX.utils.book_append_sheet(wb, makeSimple(ratingRows, [16,22,14,12,16,14]), "דירוג יועצים");
    })();

    // ── ביטוח: כל טאב באפליקציה מקבל גיליון, כך שעמוד חדש לא יישמט מהייצוא ──
    const TAB_SHEET_NAMES = {
      opening:"פתיחת פרויקט", quotes:"הצעות מחיר יועצים", consultants:"רשימת יועצים",
      accounts:"ריכוז חשבונות", budget:"תקציב הפרויקט", tender:"תוצאות מכרז",
      contractor:"חשבון קבלן סופי", ratings:"דירוג יועצים",
    };
    TABS.forEach(t => {
      const sheetName = (TAB_SHEET_NAMES[t.id] || t.label || t.id).slice(0,31);
      if (!wb.SheetNames.includes(sheetName)) {
        XLSX.utils.book_append_sheet(wb, makeSimple([[t.label||t.id],["עמוד זה עדיין ללא ייצוא מפורט"]], [40]), sheetName);
      }
    });

    const wbout = XLSX.write(wb, { bookType:"xlsx", type:"array" });
    const blob = new Blob([wbout], { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
    if (returnBlob) return blob;
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = blobUrl;
    a.download = (proj.name || "פרויקט").replace(/[\/\\:*?"<>|]/g, "_") + ".xlsx";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(blobUrl), 1000);
  };

  // ── Backup all data to JSON ──────────────────────────────────────────────
  const exportBackup = () => setShowBackupConfirm(true);

  const doBackup = async () => {
    const backup = { projects, allData, suppliers, companies, milestones, statsRows, exportedAt: new Date().toISOString() };
    const json = JSON.stringify(backup, null, 2);
    try { localStorage.setItem("proj_backup_latest", json); } catch(e) {}
    const handle = backupDirRef.current;
    if (handle) {
      try {
        const perm = await handle.requestPermission({ mode: "readwrite" });
        if (perm === "granted") {
          setShowBackupConfirm(false);
          const ts = new Date().toISOString().slice(0,19).replace(/:/g,"-");
          const jFh = await handle.getFileHandle(`costpilot-backup-${ts}.json`, { create: true });
          const jW = await jFh.createWritable();
          await jW.write(json); await jW.close();
          const XLSX = window.XLSX;
          if (XLSX && projects.length > 0) {
            for (const proj of projects) {
              try {
                const blob = exportProjectToExcel(proj, { returnBlob: true });
                if (!blob) continue;
                const safeName = (proj.name||"פרויקט").replace(/[\/\\:*?"<>|]/g,"_");
                const xFh = await handle.getFileHandle(`${safeName}.xlsx`, { create: true });
                const xW = await xFh.createWritable();
                await xW.write(blob); await xW.close();
              } catch(e) {}
            }
          }
          notify(`✅ גיבוי + אקסל נשמרו ב: ${handle.name}`);
          return;
        }
      } catch(e) {}
    }
    setShowBackupConfirm(false);
    setBackupText(json);
    setShowBackupModal(true);
  };

  const chooseBackupDir = async () => {
    try {
      const handle = await window.showDirectoryPicker({ mode: "readwrite", startIn: "documents" });
      await _bkpDB.save(handle);
      backupDirRef.current = handle;
      setBackupDirName(handle.name);
      notify(`✅ תיקיית גיבוי הוגדרה: ${handle.name}`);
    } catch(e) {}
  };

  const doRestoreAll = (b) => {
    if (b.projects)  { setProjects(b.projects);   saveProjects(b.projects); }
    if (b.allData)   {
      const synced = {};
      Object.keys(b.allData).forEach(id => { synced[id] = syncProjectData(b.allData[id]); });
      setAllData(synced);
      saveAllData(synced);
    }
    if (b.suppliers) { setSuppliers(migrateSuppliers(b.suppliers)); }
    if (b.companies) { setCompanies(b.companies); }
    if (b.milestones){ setMilestones(b.milestones); }
    if (b.statsRows) { setStatsRows(b.statsRows); }
    setShowRestoreModal(false);
    setRestoreStep("choice");
    setPendingBackupData(null);
    notify("✅ הנתונים שוחזרו בהצלחה!");
  };

  const doRestoreProject = (b, projId) => {
    const proj = (b.projects||[]).find(p => String(p.id) === String(projId));
    if (!proj) return;
    setProjects(prev => {
      const exists = prev.find(p => String(p.id) === String(projId));
      const updated = exists ? prev.map(p => String(p.id)===String(projId) ? proj : p) : [...prev, proj];
      saveProjects(updated);
      return updated;
    });
    if (b.allData?.[projId]) {
      setAllData(prev => {
        const synced = syncProjectData(b.allData[projId]);
        const updated = { ...prev, [projId]: synced };
        saveAllData(updated);
        return updated;
      });
    }
    setShowRestoreModal(false);
    setRestoreStep("choice");
    setPendingBackupData(null);
    notify(`✅ הפרויקט "${proj.name}" שוחזר בהצלחה!`);
  };

  const handleRestoreFileChange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    e.target.value = "";
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const b = JSON.parse(ev.target.result);
        if (restoreModeRef.current === "all") {
          doRestoreAll(b);
        } else {
          setPendingBackupData(b);
          setRestoreStep("projects");
          setShowRestoreModal(true);
        }
      } catch { notify("קובץ לא תקין"); }
    };
    reader.readAsText(file);
  };

  const restoreFromStorage = () => {
    try {
      const json = localStorage.getItem("proj_backup_latest");
      if (!json) { notify("לא נמצא גיבוי שמור"); return; }
      const b = JSON.parse(json);
      setPendingBackupData(b);
      setRestoreStep("projects");
      setShowRestoreModal(true);
    } catch(e) { notify("שגיאה בשחזור: " + e.message); }
  };


  // ── tab data updater ─────────────────────────────────────────────────────
  // Each tab receives its own rows array and a setter for that array only.
  const makeTabSetter = (projId, tabKey) => newRowsOrFn => {
    if (!isAdmin) return; // צפייה-בלבד: יוזר רגיל אינו משנה נתוני פרויקט (אישורים/הגדלות/עריכות/מחיקות)
    setAllData(prev => {
      const projData = prev[projId] || makeProjectData();
      const currentRows = projData[tabKey] || [];
      let newRows = typeof newRowsOrFn === "function" ? newRowsOrFn(currentRows) : newRowsOrFn;
      // Clean increases with no amount
      if (tabKey === "consultants") {
        newRows = newRows.map(con => ({
          ...con,
          increases: (con.increases || []).filter(x => x.approvedIncrease || x.isBIM || (x.reason?.trim() && x.amount !== "" && x.amount !== undefined))
        }));
      }
      const updated  = { ...projData, [tabKey]: newRows };

      // When quotes change, sync approved consultants to the consultants tab
      if (tabKey === "quotes") {
        const approvedFromQuotes = [];
        newRows.forEach(fieldGroup => {
          (fieldGroup.consultants || []).forEach(c => {
            if (c.approved && c.name && c.name.trim()) {
              const existing = (projData.consultants || []).find(ex => ex.id === "q-"+c.id) || {};
              approvedFromQuotes.push({
                ...existing,
                id:         "q-" + c.id,
                name:       c.name.trim(),
                role:       fieldGroup.fieldName || "",
                phone:      c.phone    || "",
                email:      c.email    || "",
                contract:   c.contract || "",
                payType:    c.payType  || "אחוזים",
                value:      c.value    || "",
                _fromQuote: true,
              });
            }
          });
        });
        const manualConsultants = (projData.consultants || []).filter(c => !c._fromQuote);
        updated.consultants = [...approvedFromQuotes, ...manualConsultants];
      }

      return { ...prev, [projId]: updated };
    });
  };

  // Safe accessor
  const getData = (projId, tabKey) => {
    const pd = allData[projId];
    if (!pd) return [];
    return pd[tabKey] || [];
  };

  const sc = s => statusColor(s);

  return (
    <div dir="rtl" lang="he-IL" style={{ height:"100vh", background:"#F5F6F8", fontFamily:"'Heebo',sans-serif", color:"#0D0D0D", display:"flex", overflow:"hidden" }}>
      <style>{css}</style>

      {/* ── Sidebar ── */}
      <aside style={{ width:232, minWidth:232, maxWidth:232, background:"#fff", borderRight:"1px solid #E2E5EA", display:"flex", flexDirection:"column", position:"sticky", top:0, height:"100vh", overflow:"hidden", flexShrink:0 }}>

        {/* Logo */}
        <div style={{ padding:"14px 16px", borderBottom:"1px solid #E2E5EA", display:"flex", alignItems:"center", justifyContent:"flex-start" }}>
          <div style={{ display:"inline-flex", alignItems:"flex-end", gap:4, direction:"ltr" }}>
            <div style={{ display:"flex", alignItems:"flex-end", gap:4, height:34 }}>
              <span style={{ display:"block", width:7, height:14, borderRadius:1.5, background:"#0B1F3A", opacity:0.35 }} />
              <span style={{ display:"block", width:7, height:24, borderRadius:1.5, background:"#0B1F3A", opacity:0.65 }} />
              <span style={{ display:"block", width:7, height:34, borderRadius:1.5, background:"#0B1F3A" }} />
            </div>
            <div style={{ fontFamily:"'Heebo',sans-serif", fontSize:22, fontWeight:700, color:"#0B1F3A", whiteSpace:"nowrap", marginBottom:-3, lineHeight:1, letterSpacing:"-0.4px" }}>
              Cost<span style={{ fontWeight:400 }}>Pilot</span>
            </div>
          </div>
        </div>

        {/* Global nav items */}
        <div style={{ padding:"12px 10px 4px", display:"flex", flexDirection:"column", gap:2 }}>
          {[
            { label:"לוח בקרה",      icon:"📊", action:()=>{ setGlobalPage("dashboard"); setSelectedProj(null); setShowStats(false); }, active: !selectedProj && globalPage==="dashboard" },
            { label:"פרויקטים",      icon:"📁", action:()=>{ setSelectedProj(null); setGlobalPage(null); setShowStats(false); },       active: !selectedProj && !globalPage && !showStats },
            { label:"מידע ראשי",     icon:"📋", action:()=>{ setGlobalPage("maininfo"); setSelectedProj(null); setShowStats(false); }, active: globalPage==="maininfo" },
            { label:"רשימת ספקים",   icon:"🗂️", action:()=>{ setGlobalPage("suppliers"); setSelectedProj(null); setShowStats(false); }, active: globalPage==="suppliers" },
            { label:"השוואת עלויות", icon:"⚖️", action:()=>{ setGlobalPage("costs"); setSelectedProj(null); setShowStats(false); },   active: globalPage==="costs" },
          ].map(({label, icon, action, active}) => (
            <div key={label} className="hov-side" onClick={action}
              style={{ display:"flex", alignItems:"center", gap:9, padding:"8px 12px", borderRadius:0, cursor:"pointer",
                fontSize:13, fontWeight:active?600:400,
                color:active?"#0B1F3A":"#767676",
                background:active?"#EAF1FA":"transparent",
                borderRight:active?"2px solid #0E7C6A":"2px solid transparent",
                borderLeft:"none", borderTop:"none", borderBottom:"none",
                transition:"all .15s" }}>
              <span style={{ fontSize:16 }}>{icon}</span> {label}
            </div>
          ))}

          {/* הגדרות — מתקפל */}
          {(() => {
            const settingsActive = ["companies","managers","milestones","users"].includes(globalPage) || showStats;
            return (<>
              <div className="hov-side" onClick={() => setShowSettings(v => !v)}
                style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"8px 12px", borderRadius:0, cursor:"pointer",
                  fontSize:13, fontWeight:settingsActive?600:400,
                  color:settingsActive?"#0B1F3A":"#767676",
                  background:settingsActive?"#EAF1FA":"transparent",
                  borderRight:settingsActive?"2px solid #0E7C6A":"2px solid transparent",
                  borderLeft:"none", borderTop:"none", borderBottom:"none",
                  transition:"all .15s" }}>
                <div style={{ display:"flex", alignItems:"center", gap:9 }}>
                  <span style={{ fontSize:16 }}>⚙️</span> הגדרות
                </div>
                <span style={{ fontSize:11, color:"#9A9A9A" }}>{showSettings ? "▴" : "▾"}</span>
              </div>
              {showSettings && [
                { label:"חברות עירוניות",  icon:"🏛️", action:()=>{ setGlobalPage("companies");  setSelectedProj(null); setShowStats(false); }, active: globalPage==="companies" },
                { label:"מנהלים",          icon:"👔", action:()=>{ setGlobalPage("managers");   setSelectedProj(null); setShowStats(false); }, active: globalPage==="managers" },
                { label:"תבניות אבני דרך", icon:"🚩", action:()=>{ setGlobalPage("milestones"); setSelectedProj(null); setShowStats(false); }, active: globalPage==="milestones" },
                { label:"גיליון סטטיסטיקה",icon:"📈", action:()=>{ setShowStats(true); setSelectedProj(null); setGlobalPage(null); },          active: showStats },
                ...(isAdmin ? [{ label:"ניהול משתמשים", icon:"👥", action:()=>{ setGlobalPage("users"); setSelectedProj(null); setShowStats(false); }, active: globalPage==="users" }] : []),
              ].map(({label, icon, action, active}) => (
                <div key={label} className="hov-side" onClick={action}
                  style={{ display:"flex", alignItems:"center", gap:9, padding:"7px 12px 7px 26px", borderRadius:0, cursor:"pointer",
                    fontSize:12, fontWeight:active?600:400,
                    color:active?"#0B1F3A":"#767676",
                    background:active?"#EAF1FA":"transparent",
                    borderRight:active?"2px solid #0E7C6A":"2px solid transparent",
                    borderLeft:"none", borderTop:"none", borderBottom:"none",
                    transition:"all .15s" }}>
                  <span style={{ fontSize:14 }}>{icon}</span> {label}
                </div>
              ))}
            </>);
          })()}
        </div>

        {/* User info + logout */}
        <div style={{ padding:"8px 12px", borderBottom:"1px solid #E2E5EA", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
          <div style={{ display:"flex", flexDirection:"column", gap:1, overflow:"hidden" }}>
            <span style={{ fontSize:11, color:"#767676", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", maxWidth:130 }}>{currentUser.email}</span>
            <span style={{ fontSize:10, color: isAdmin ? "#0E7C6A" : "#9A9A9A", fontWeight:600 }}>{isAdmin ? "מנהל" : "משתמש"}</span>
          </div>
          <button onClick={() => { const { auth, signOut } = window._firebase; signOut(auth); }}
            style={{ background:"none", border:"1px solid #E2E5EA", borderRadius:4, padding:"3px 8px", fontSize:11, color:"#767676", cursor:"pointer", fontFamily:"'Heebo',sans-serif", whiteSpace:"nowrap" }}>
            יציאה
          </button>
        </div>

        {/* Project list header + search — fixed, does not scroll */}
        <div style={{ flexShrink:0, padding:"10px 10px 6px" }}>
          <div style={{ fontSize:10, color:"#9A9A9A", fontWeight:600, letterSpacing:"0.06em", textTransform:"uppercase", padding:"0 8px 6px" }}>רשימת פרויקטים</div>
          <div style={{ position:"relative" }}>
            <span style={{ position:"absolute", right:8, top:"50%", transform:"translateY(-50%)", color:"#9A9A9A", fontSize:13, pointerEvents:"none" }}>🔍</span>
            <input value={sidebarSearch} onChange={e => setSidebarSearch(e.target.value)}
              placeholder="חיפוש פרויקט..."
              style={{ width:"100%", padding:"6px 28px 6px 8px", border:"1px solid #E2E5EA", borderRadius:4, fontSize:12, fontFamily:"'Heebo',sans-serif", outline:"none", boxSizing:"border-box", direction:"rtl" }}
              onFocus={e => e.target.style.borderColor="#0B1F3A"}
              onBlur={e => e.target.style.borderColor="#E2E5EA"} />
          </div>
        </div>

        {/* Scrollable project list */}
        <div style={{ flex:1, overflowY:"auto", padding:"4px 10px 10px" }}>
          {sortedVisibleProjects.filter(p => !sidebarSearch.trim() || p.name.toLowerCase().includes(sidebarSearch.trim().toLowerCase())).map(p => (
            <div key={p.id} className="hov-side"
              onClick={() => { setSelectedProj(p); setActiveTab("budget"); setGlobalPage(null); touchProject(p); }}
              style={{ display:"flex", alignItems:"center", gap:8, padding:"9px 12px", borderRadius:0, cursor:"pointer", marginBottom:0,
                background:selectedProj?.id===p.id?"#EAF1FA":"transparent",
                borderRight:selectedProj?.id===p.id?"2px solid #0E7C6A":"2px solid transparent",
                borderLeft:"none", borderTop:"none", borderBottom:"none",
                transition:"all .15s" }}>
              <div style={{ width:8, height:8, borderRadius:"50%", background:sc(p.status), flexShrink:0 }} />
              <span style={{ fontSize:13, fontWeight:selectedProj?.id===p.id?600:400, color:selectedProj?.id===p.id?"#0B1F3A":"#3A3A3A", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", flex:1 }}>
                {p.name}
              </span>
            </div>
          ))}

        </div>

        <div style={{ padding:"10px 16px", borderTop:"1px solid #E2E5EA", fontSize:11, color:"#9A9A9A", textAlign:"right" }}>
          {projects.length} פרויקטים
        </div>
        {isAdmin && (
        <div style={{ padding:"10px 12px", borderTop:"1px solid #E2E5EA", display:"flex", gap:6 }}>
          <button onClick={exportBackup}
            style={{ flex:1, padding:"6px 8px", background:"#F0F2F5", border:"1px solid #E2E5EA", borderRadius:4, fontSize:11, color:"#3A3A3A", cursor:"pointer", fontFamily:"'Heebo',sans-serif", fontWeight:600 }}>
            💾 גיבוי
          </button>
          <button onClick={() => { setRestoreStep("choice"); setShowRestoreModal(true); }}
            style={{ flex:1, padding:"6px 8px", background:"#F7F8FA", border:"1px solid #E2E5EA", borderRadius:4, fontSize:11, color:"#767676", cursor:"pointer", fontFamily:"'Heebo',sans-serif", textAlign:"center", fontWeight:600 }}>
            📂 שחזור
          </button>
          <input ref={restoreFileInputRef} type="file" accept=".json" style={{ display:"none" }} onChange={handleRestoreFileChange} />
        </div>
        )}
      </aside>

      {/* ── Main ── */}
      <main className={isAdmin?"":"view-only"} style={{ flex:1, minWidth:0, minHeight:0, display:"flex", flexDirection:"column", overflow:"hidden" }}>

        {/* Global pages: dashboard / suppliers / companies / milestones */}
        {!selectedProj && globalPage === "users" && isAdmin && (
          <UserManagementPage currentUser={currentUser} projects={projects} allData={allData} />
        )}
        {!selectedProj && globalPage === "dashboard" && (
          <DashboardPage
            allData={allData}
            projects={visibleProjects}
            milestones={milestones}
            managers={managers}
            statsRows={statsRows}
            onMarkEmailSent={item => {
              const now = Date.now();
              setAllData(prev => {
                const pd = prev[item.projId] || {};
                if (item.stage === "pm" && item.invoiceId)
                  return { ...prev, [item.projId]: { ...pd, accounts: (pd.accounts||[]).map(r => r.id===item.invoiceId ? {...r, pmLastEmailAt:now, pmReminderCount:(r.pmReminderCount||0)+1} : r) } };
                if (item.stage === "um" && item.invoiceId)
                  return { ...prev, [item.projId]: { ...pd, accounts: (pd.accounts||[]).map(r => r.id===item.invoiceId ? {...r, umLastEmailAt:now, umReminderCount:(r.umReminderCount||0)+1} : r) } };
                if (item.stage === "recommendation" && item.fieldId)

                style={{ background:"#F0F2F5", border:"none", borderRadius:4, width:30, height:30, fontSize:15, cursor:"pointer", color:"#767676" }}>✕</button>
            </div>
            <div style={{ fontSize:12, fontWeight:700, color:"#767676", marginBottom:6, display:"flex", alignItems:"center", gap:8, flexWrap:"wrap" }}>
              <span>מיקום שמירה</span>
              <span style={{ fontSize:11, fontWeight:400, color:"#9A9A9A", direction:"ltr" }}>Projects – Documents → ניהול יועצים → AI → backup COSTPILOT</span>
            </div>
            <div style={{ display:"flex", alignItems:"center", gap:10, background:"#F7F8FA", border:"1.5px solid #E2E5EA", borderRadius:4, padding:"10px 14px", marginBottom:20 }}>
              <span style={{ fontSize:18 }}>📁</span>
              <span style={{ flex:1, fontSize:13, color: backupDirName?"#0D0D0D":"#9A9A9A", fontWeight: backupDirName?600:400, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>
                {backupDirName || "לא הוגדרה תיקייה"}
              </span>
              <button onClick={chooseBackupDir}
                style={{ fontSize:11, padding:"4px 10px", borderRadius:4, border:"1.5px solid #B8CEED", background:"#EAF1FA", color:"#163356", cursor:"pointer", fontFamily:"'Heebo',sans-serif", fontWeight:600, whiteSpace:"nowrap" }}>
                שנה
              </button>
            </div>
            <button onClick={doBackup}
              style={{ width:"100%", padding:"11px", borderRadius:4, border:"none", background:"#0B1F3A", color:"#fff", fontSize:14, fontWeight:700, cursor:"pointer", fontFamily:"'Heebo',sans-serif" }}>
              {backupDirName ? "שמור גיבוי לתיקייה" : "שמור גיבוי (ידני)"}
            </button>
          </div>
        </div>
      )}

      {/* ── Backup Modal ── */}
      {showBackupModal && (
        <div style={{ position:"fixed", inset:0, background:"#00000070", display:"flex", alignItems:"center", justifyContent:"center", zIndex:3000 }}
          onClick={() => setShowBackupModal(false)}>
          <div className="fade" onClick={e => e.stopPropagation()}
            style={{ background:"#fff", borderRadius:8, padding:28, width:580, maxHeight:"80vh", display:"flex", flexDirection:"column", gap:16, boxShadow:"0 24px 64px #0004" }}>
            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between" }}>
              <div>
                <div style={{ fontSize:17, fontWeight:800, color:"#0D0D0D" }}>💾 גיבוי נתונים</div>
                <div style={{ fontSize:12, color:"#767676", marginTop:3 }}>
                  סמני הכל ← העתיקי ← פתחי פנקס רשימות ← הדביקי ← שמרי כקובץ גיבוי.json
                </div>
              </div>
              <button onClick={() => setShowBackupModal(false)}
                style={{ background:"#F0F2F5", border:"none", borderRadius:4, width:32, height:32, fontSize:16, cursor:"pointer", color:"#767676" }}>✕</button>
            </div>
            <button
              onClick={() => {
                const el = document.getElementById("backup-textarea");
                el.select();
                document.execCommand("copy");
                notify("✅ הועתק! כעת הדביקי בפנקס רשימות ושמרי");
              }}
              style={{ background:"#0B1F3A", color:"#fff", border:"1.5px solid transparent", borderRadius:4, padding:"8px 18px", fontSize:13, fontWeight:600, cursor:"pointer", fontFamily:"'Heebo',sans-serif" }}>
              📋 העתק הכל
            </button>
            <textarea
              id="backup-textarea"
              readOnly
              value={backupText}
              style={{ flex:1, minHeight:300, fontFamily:"monospace", fontSize:11, direction:"ltr", border:"1.5px solid #E2E5EA", borderRadius:8, padding:12, resize:"none", color:"#3A3A3A", background:"#F7F8FA", outline:"none" }}
            />
          </div>
        </div>
      )}
    </div>
  );
}


    // Add global error handler
    window.addEventListener('error', e => {
      console.error('Global error:', e.message, e.filename, e.lineno);
    });

    class ErrorBoundary extends React.Component {
      constructor(props) { super(props); this.state = { error: null }; }
      componentDidCatch(error) { this.setState({ error: error.message }); }
      render() {
        if (this.state.error) return (
          <div style={{padding:40, fontFamily:"'Heebo',sans-serif", color:"#5C2020", direction:"rtl"}}>
            <h2>שגיאה באפליקציה</h2>
            <pre style={{fontSize:12, color:"#767676"}}>{this.state.error}</pre>
          </div>
        );
        return this.props.children;
      }
    }

    ReactDOM.createRoot(document.getElementById("root")).render(
      <ErrorBoundary><App /></ErrorBoundary>
    );
  </script>
</body>
</html>
