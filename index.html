                        : <span style={{ fontSize:12, color:"#D0D5DD" }}>—</span>}
                    </td>
                    <td style={{ padding:"6px 8px", minWidth:180 }}>
                      <input value={r.notes||""} onChange={e => updateNote(r._consultantRowId, e.target.value)}
                        placeholder="הערות..."
                        style={{ width:"100%", fontSize:12, border:"1px solid #E2E5EA",
                          borderRadius:4, padding:"5px 8px", fontFamily:"'Heebo',sans-serif", color:"#3A3A3A",
                          background:"transparent", outline:"none", direction:"rtl" }}
                        onFocus={e=>e.target.style.borderColor="#444444"} onBlur={e=>e.target.style.borderColor="#E2E5EA"} />
                    </td>
                  </tr>
                );
                })}
              </>)}
              <tr>
                <td colSpan={10} style={{ padding:"5px 14px" }}>
                  <button onClick={addExtraConsultant}
                    style={{ background:"#FAF2E6", color:"#5C3D10", border:"1px solid #F0D4B0", borderRadius:4, padding:"4px 12px", fontSize:11, cursor:"pointer", fontFamily:"'Heebo',sans-serif", fontWeight:600 }}>
                    + הוסף שורה ידנית
                  </button>
                </td>
              </tr>
            </tbody>
            {allRows.length > 0 && (
              <tbody>
                <tr style={{ borderTop:"2px solid #B8CEED" }}>
                  <td style={{ padding:"8px 10px", fontWeight:800, color:"#163356", fontSize:12, textAlign:"right" }}>סה״כ יועצים</td>
                  <td style={{ padding:"8px 10px", color:"#9A9A9A", fontSize:12, textAlign:"right" }}>{allRows.length} יועצים</td>
                  <td style={{ padding:"8px 10px", fontWeight:800, color:"#0D0D0D", textAlign:"right" }}>{fmt(consultantsTotal)}</td>
                  <td style={{ padding:"8px 10px", fontWeight:800, color:"#5C3D10", textAlign:"right" }}>{fmt(allRows.reduce((s,r)=>s+(r.pendingInc||0),0))}</td>
                  <td style={{ padding:"8px 10px", fontWeight:800, color:"#0D0D0D", textAlign:"right" }}>{fmt(allRows.reduce((s,r)=>s+(r.paid||0),0))}</td>
                  <td style={{ padding:"8px 10px", fontWeight:800, color:"#0D0D0D", textAlign:"right" }}>{fmt(allRows.reduce((s,r)=>{
                    if (r.noClaims) return s;
                    return s+((r.payType==="אחוזים"?r.computedFee:r.value)+r.increases-(r.paid||0));
                  },0))}</td>
                  <td style={{ padding:"8px 10px", fontWeight:800, color:"#0D0D0D", textAlign:"right" }}>{fmt(allRows.reduce((s,r)=>s+(r.planOnly||0),0))}</td>
                  <td colSpan={2} />
                </tr>

                {/* ── אגרות ── */}
                {(() => {
                  const FIXED_FEES = ["פיצויי נופי","תאגיד המים - לא דמי הקמה","כיבוי אש","חח\"י","בזק","הוט","רשות העתיקות","תיק מידע"];
                  const feeRows = bs.feeRows || FIXED_FEES.map(name => ({ id:name, name, contract:"", paid:"", planOnly:"", noClaims:false, notes:"" }));
                  const extraFeeRows = bs.extraFeeRows || [];
                  const allFeeRows = [...feeRows, ...extraFeeRows];
                  const updFeeRow = (id, key, val, isExtra) => {
                    if (isExtra) {
                      upd("extraFeeRows", (bs.extraFeeRows||[]).map(r => r.id===id ? {...r,[key]:val} : r));
                    } else {
                      upd("feeRows", feeRows.map(r => r.id===id ? {...r,[key]:val} : r));
                    }
                  };
                  const feeTotalContract = allFeeRows.reduce((s,r) => s+Number(r.contract||0),0);
                  const feeTotalPaid = allFeeRows.reduce((s,r) => s+Number(r.paid||0),0);
                  const feeTotalRemaining = allFeeRows.reduce((s,r) => r.noClaims ? s : s+Number(r.contract||0)-Number(r.paid||0),0);
                  const feeTotalPlanOnly = allFeeRows.reduce((s,r) => s+Number(r.planOnly||0),0);
                  const inputStyle = { width:"100%", fontSize:12, border:"1px solid #E2E5EA", borderRadius:4, padding:"4px 7px", fontFamily:"'Heebo',sans-serif", background:"transparent", outline:"none", textAlign:"right" };
                  return (<>
                    <tr style={{ background:"#FAF2E6", borderTop:"2px solid #F0D4B0" }}>
                      <td colSpan={10} style={{ padding:"8px 14px", fontWeight:800, color:"#5C3D10", fontSize:13 }}>אגרות</td>
                    </tr>
                    {allFeeRows.map((r, i) => {
                      const isExtra = i >= FIXED_FEES.length;
                      const rem = r.noClaims ? 0 : Number(r.contract||0) - Number(r.paid||0);
                      return (
                        <tr key={r.id} style={{ borderBottom:"1px solid #F0F2F5", background:i%2===0?"#fff":"#F7F8FA" }}>
                          <td style={{ padding:"7px 10px", color:"#767676", fontSize:12 }}>אגרות</td>
                          <td style={{ padding:"7px 10px" }}>
                            {isExtra
                              ? <input value={r.name} onChange={e=>updFeeRow(r.id,"name",e.target.value,true)} style={inputStyle} placeholder="שם האגרה..." />
                              : <span style={{ fontSize:13, color:"#0D0D0D" }}>{r.name}</span>}
                          </td>
                          <td style={{ padding:"7px 10px" }}><BudgetNumInput value={r.contract||""} onChange={v=>updFeeRow(r.id,"contract",v,isExtra)} /></td>
                          <td style={{ padding:"7px 10px", color:"#9A9A9A", textAlign:"right" }}>—</td>
                          <td style={{ padding:"7px 10px" }}><BudgetNumInput value={r.paid||""} onChange={v=>updFeeRow(r.id,"paid",v,isExtra)} /></td>
                          <td style={{ padding:"7px 10px", textAlign:"right", fontSize:13, color: rem<0?"#5C2020":"#0D0D0D", textDecoration:r.noClaims?"line-through":"none" }}>{fmt(rem)}</td>
                          <td style={{ padding:"7px 10px", textAlign:"right", fontSize:13, color:"#0D0D0D" }}>{fmt(Number(r.contract||0))}</td>
                          <td />
                          <td style={{ padding:"7px 10px" }}>
                            <input value={r.notes||""} onChange={e=>updFeeRow(r.id,"notes",e.target.value,isExtra)} style={inputStyle} placeholder="הערות..." />
                          </td>
                        </tr>
                      );
                    })}
                    <tr>
                      <td colSpan={10} style={{ padding:"5px 14px" }}>
                        <button onClick={()=>upd("extraFeeRows",[...(bs.extraFeeRows||[]),{id:Date.now(),name:"",contract:"",paid:"",planOnly:"",noClaims:false,notes:""}])}
                          style={{ background:"#FAF2E6", color:"#5C3D10", border:"1px solid #F0D4B0", borderRadius:4, padding:"4px 10px", fontSize:11, cursor:"pointer", fontFamily:"'Heebo',sans-serif", fontWeight:600 }}>+ הוסף אגרה</button>
                      </td>
                    </tr>
                    <tr style={{ borderTop:"2px solid #F0D4B0" }}>
                      <td colSpan={2} style={{ padding:"8px 10px", fontWeight:800, color:"#5C3D10", fontSize:12 }}>סה״כ אגרות</td>
                      <td style={{ padding:"8px 10px", fontWeight:800, color:"#0D0D0D", textAlign:"right" }}>{fmt(feeTotalContract)}</td>
                      <td />
                      <td style={{ padding:"8px 10px", fontWeight:800, color:"#0D0D0D", textAlign:"right" }}>{fmt(feeTotalPaid)}</td>
                      <td style={{ padding:"8px 10px", fontWeight:800, color:"#0D0D0D", textAlign:"right" }}>{fmt(feeTotalRemaining)}</td>
                      <td style={{ padding:"8px 10px", fontWeight:800, color:"#0D0D0D", textAlign:"right" }}>{fmt(feeTotalContract)}</td>
                      <td colSpan={2} />
                    </tr>

                    {/* ── קבלן ── */}
                    {(() => {
                      const extraContractorRows = bs.extraContractorRows || [];
                      const allContractorRows = [
                        { id:"__main__", name:"קבלן ראשי", contract:bs.contractorContract||"", paid:bs.contractorPaid||"", notes:bs.contractorNotes||"", isMain:true }
                      , ...extraContractorRows];
                      const updContractorRow = (id, key, val) => {
                        if (id==="__main__") {
                          const map = {contract:"contractorContract",paid:"contractorPaid",notes:"contractorNotes"};
                          upd(map[key]||key, val);
                        } else {
                          upd("extraContractorRows", extraContractorRows.map(r => r.id===id ? {...r,[key]:val} : r));
                        }
                      };
                      const contractorContract = allContractorRows.reduce((s,r)=>s+Number(r.contract||0),0);
                      const contractorPaid     = allContractorRows.reduce((s,r)=>s+Number(r.paid||0),0);
                      const contractorRem      = contractorContract - contractorPaid;
                      return (<>
                        <tr style={{ background:"#EFF7F3", borderTop:"2px solid #C6E8D4" }}>
                          <td colSpan={10} style={{ padding:"8px 14px", fontWeight:800, color:"#1C4532", fontSize:13 }}>קבלן</td>
                        </tr>
                        {allContractorRows.map((r,i) => {
                          const rem = Number(r.contract||0) - Number(r.paid||0);
                          return (
                            <tr key={r.id} style={{ borderBottom:"1px solid #F0F2F5", background:i%2===0?"#fff":"#F7F8FA" }}>
                              <td style={{ padding:"7px 10px", fontSize:13, color:"#0D0D0D" }}>
                                {r.isMain ? "קבלן ראשי" : "קבלן"}
                              </td>
                              <td style={{ padding:"7px 10px" }}>
                                {r.isMain
                                  ? <input value={bs.contractorName||""} onChange={e=>upd("contractorName",e.target.value)} style={inputStyle} placeholder="שם הקבלן..." />
                                  : <input value={r.name} onChange={e=>updContractorRow(r.id,"name",e.target.value)} style={inputStyle} placeholder="שם הקבלן..." />}
                              </td>
                              <td style={{ padding:"7px 10px" }}><BudgetNumInput value={r.contract} onChange={v=>updContractorRow(r.id,"contract",v)} /></td>
                              <td style={{ padding:"7px 10px", color:"#9A9A9A", textAlign:"right" }}>—</td>
                              <td style={{ padding:"7px 10px" }}><BudgetNumInput value={r.paid} onChange={v=>updContractorRow(r.id,"paid",v)} /></td>
                              <td style={{ padding:"7px 10px", textAlign:"right", fontSize:13, color:rem<0?"#5C2020":"#0D0D0D" }}>{fmt(rem)}</td>
                              <td style={{ padding:"7px 10px", textAlign:"right", fontSize:13, color:"#9A9A9A" }}>—</td>
                              <td style={{ padding:"7px 6px", textAlign:"center" }}>
                                {!r.isMain && (
                                  <button onClick={()=>upd("extraContractorRows", extraContractorRows.filter(x=>x.id!==r.id))}
                                    style={{ background:"none", border:"none", cursor:"pointer", color:"#5C2020", fontSize:14, lineHeight:1, padding:"2px 4px" }}
                                    title="מחק שורה">✕</button>
                                )}
                              </td>
                              <td style={{ padding:"7px 10px" }}><input value={r.notes} onChange={e=>updContractorRow(r.id,"notes",e.target.value)} style={inputStyle} placeholder="הערות..." /></td>
                            </tr>
                          );
                        })}
                        <tr>
                          <td colSpan={10} style={{ padding:"5px 14px" }}>
                            <button onClick={()=>upd("extraContractorRows",[...extraContractorRows,{id:Date.now(),name:"",contract:"",paid:"",notes:""}])}
                              style={{ background:"#EFF7F3", color:"#1C4532", border:"1px solid #C6E8D4", borderRadius:4, padding:"4px 10px", fontSize:11, cursor:"pointer", fontFamily:"'Heebo',sans-serif", fontWeight:600 }}>+ הוסף קבלן</button>
                          </td>
                        </tr>
                        <tr style={{ borderTop:"2px solid #C6E8D4" }}>
                          <td colSpan={2} style={{ padding:"8px 10px", fontWeight:800, color:"#1C4532", fontSize:12 }}>סה״כ קבלן</td>
                          <td style={{ padding:"8px 10px", fontWeight:800, color:"#0D0D0D", textAlign:"right" }}>{fmt(contractorContract)}</td>
                          <td />
                          <td style={{ padding:"8px 10px", fontWeight:800, color:"#0D0D0D", textAlign:"right" }}>{fmt(contractorPaid)}</td>
                          <td style={{ padding:"8px 10px", fontWeight:800, color:"#0D0D0D", textAlign:"right" }}>{fmt(contractorRem)}</td>
                          <td style={{ padding:"8px 10px", color:"#9A9A9A", textAlign:"right" }}>—</td>
                          <td colSpan={2} />
                        </tr>

                        {/* ── תקורות ── */}
                        {(() => {
                          const baseForOverhead = consultantsTotal + feeTotalContract + contractorContract;
                          const overheadMode = bs.overheadMode || "pct";
                          const overheadPct = Number(bs.overheadPct||0);
                          const overheadAmt = overheadMode === "fixed"
                            ? Number(bs.overheadFixed||0)
                            : baseForOverhead * overheadPct / 100;
                          const bcmBase = baseForOverhead + overheadAmt;
                          const bcmPct = Number(bs.bcmPct||0);
                          const bcmAmt = bcmBase * bcmPct / 100;
                          const vatPct = Number(bs.vatPct||18);
                          const vatBase = bcmBase + bcmAmt;
                          const vatAmt = vatBase * vatPct / 100;
                          const basePaid = allRows.reduce((s,r)=>s+(r.paid||0),0) + feeTotalPaid + contractorPaid;
                          const overheadPaid = overheadMode === "fixed" ? Number(bs.overheadPaidFixed||0) : Math.round(basePaid * overheadPct / 100);
                          const overheadRem = overheadAmt - overheadPaid;
                          const bcmPaid = Math.round((basePaid + overheadPaid) * bcmPct / 100);
                          const bcmRem = bcmAmt - bcmPaid;
                          const vatPaid = Math.round((basePaid + overheadPaid + bcmPaid) * vatPct / 100);
                          const vatRem = vatAmt - vatPaid;
                          const consultantsPlanOnly = allRows.reduce((s,r)=>s+(r.planOnly||0),0);
                          const basePlanOnly = consultantsPlanOnly + feeTotalContract;
                          const overheadPlanOnlyCalc = overheadMode === "fixed" ? Number(bs.overheadPlanOnlyFixed||0) : basePlanOnly * overheadPct / 100;
                          const bcmPlanOnlyCalc = (basePlanOnly + overheadPlanOnlyCalc) * bcmPct / 100;
                          const vatPlanOnlyCalc = (basePlanOnly + overheadPlanOnlyCalc + bcmPlanOnlyCalc) * vatPct / 100;
                          const overheadTotalAmt = overheadAmt + bcmAmt + vatAmt;
                          const grandTotalContract = consultantsTotal + feeTotalContract + contractorContract + overheadTotalAmt;
                          const grandTotalPaid = allRows.reduce((s,r)=>s+(r.paid||0),0) + feeTotalPaid + contractorPaid + overheadPaid + bcmPaid + vatPaid;
                          const grandTotalRem = grandTotalContract - grandTotalPaid;
                          return (<>
                            <tr style={{ background:"#F0F2F5", borderTop:"2px solid #D0D5DD" }}>
                              <td colSpan={10} style={{ padding:"8px 14px", fontWeight:800, color:"#444444", fontSize:13 }}>תקורות</td>
                            </tr>
                            {/* תקורות חברה עירונית */}
                            <tr style={{ borderBottom:"1px solid #F0F2F5" }}>
                              <td style={{ padding:"7px 10px", fontSize:13, color:"#0D0D0D" }}>תקורות חברה עירונית</td>
                              <td style={{ padding:"7px 10px" }}>
                                <div style={{ display:"flex", alignItems:"center", gap:4, justifyContent:"flex-start" }}>
                                  <span onClick={()=>upd("overheadMode", overheadMode==="fixed"?"pct":"fixed")}
                                    title="לחץ לשינוי סוג"
                                    style={{ fontSize:11, cursor:"pointer", fontWeight:700, userSelect:"none",
                                      color: overheadMode==="fixed"?"#5C3D10":"#767676",
                                      textDecoration: "underline dotted" }}>
                                    {overheadMode==="fixed"?"":"%"}
                                  </span>
                                  {overheadMode==="fixed"
                                    ? <input type="number" value={bs.overheadFixed||""} onChange={e=>upd("overheadFixed",e.target.value)} style={{...inputStyle, width:75, textAlign:"right"}} placeholder="סכום" />
                                    : <input type="number" value={bs.overheadPct||""} onChange={e=>upd("overheadPct",e.target.value)} style={{...inputStyle, width:50, textAlign:"right"}} />
                                  }
                                </div>
                              </td>
                              <td style={{ padding:"7px 10px", textAlign:"right", fontSize:13, color:"#0D0D0D", fontWeight:600 }}>{fmt(overheadAmt)}</td>
                              <td style={{ padding:"7px 10px", color:"#9A9A9A", textAlign:"right" }}>—</td>
                              <td style={{ padding:"7px 10px", textAlign:"right", fontSize:13, color:"#0D0D0D" }}>
                                {overheadMode==="fixed"
                                  ? <input type="number" value={bs.overheadPaidFixed||""} onChange={e=>upd("overheadPaidFixed",e.target.value)} style={{...inputStyle, width:"100%", textAlign:"right"}} placeholder="0" />
                                  : fmt(overheadPaid)}
                              </td>
                              <td style={{ padding:"7px 10px", textAlign:"right", fontSize:13, color:overheadRem<0?"#5C2020":"#0D0D0D" }}>{fmt(overheadRem)}</td>
                              <td style={{ padding:"7px 10px", textAlign:"right", fontSize:13, color:"#0D0D0D" }}>
                                {overheadMode==="fixed"
                                  ? <input type="number" value={bs.overheadPlanOnlyFixed||""} onChange={e=>upd("overheadPlanOnlyFixed",e.target.value)} style={{...inputStyle, width:"100%", textAlign:"right"}} placeholder="0" />
                                  : (overheadPlanOnlyCalc > 0 ? fmt(Math.round(overheadPlanOnlyCalc)) : "—")}
                              </td>
                              <td />
                              <td style={{ padding:"7px 10px" }}><input value={bs.overheadNotes||""} onChange={e=>upd("overheadNotes",e.target.value)} style={inputStyle} placeholder="הערות..." /></td>
                            </tr>
                            {/* בצמ */}
                            <tr style={{ borderBottom:"1px solid #F0F2F5", background:"#F7F8FA" }}>
                              <td style={{ padding:"7px 10px", fontSize:13, color:"#0D0D0D" }}>בצ״מ</td>
                              <td style={{ padding:"7px 10px" }}>
                                <div style={{ display:"flex", alignItems:"center", gap:4, justifyContent:"flex-start" }}>
                                  <span style={{ fontSize:11, color:"#767676" }}>%</span>
                                  <input type="number" value={bs.bcmPct||""} onChange={e=>upd("bcmPct",e.target.value)} style={{...inputStyle, width:50, textAlign:"right"}} placeholder="" />
                                </div>
                              </td>
                              <td style={{ padding:"7px 10px", textAlign:"right", fontSize:13, color:"#0D0D0D", fontWeight:600 }}>{fmt(bcmAmt)}</td>
                              <td style={{ padding:"7px 10px", color:"#9A9A9A", textAlign:"right" }}>—</td>
                              <td style={{ padding:"7px 10px", textAlign:"right", fontSize:13, color:"#0D0D0D" }}>{fmt(bcmPaid)}</td>
                              <td style={{ padding:"7px 10px", textAlign:"right", fontSize:13, color:bcmRem<0?"#5C2020":"#0D0D0D" }}>{fmt(bcmRem)}</td>
                              <td style={{ padding:"7px 10px", textAlign:"right", fontSize:13, color:"#0D0D0D" }}>{bcmPlanOnlyCalc > 0 ? fmt(Math.round(bcmPlanOnlyCalc)) : "—"}</td>
                              <td />
                              <td style={{ padding:"7px 10px" }}><input value={bs.bcmNotes||""} onChange={e=>upd("bcmNotes",e.target.value)} style={inputStyle} placeholder="הערות..." /></td>
                            </tr>
                            {/* מעמ */}
                            <tr style={{ borderBottom:"1px solid #F0F2F5" }}>
                              <td style={{ padding:"7px 10px", fontSize:13, color:"#0D0D0D" }}>מע״מ</td>
                              <td style={{ padding:"7px 10px" }}>
                                <div style={{ display:"flex", alignItems:"center", gap:4, justifyContent:"flex-start" }}>
                                  <span style={{ fontSize:11, color:"#767676" }}>%</span>
                                  <input type="number" value={bs.vatPct||18} onChange={e=>upd("vatPct",e.target.value)} style={{...inputStyle, width:50, textAlign:"right"}} />
                                </div>
                              </td>
                              <td style={{ padding:"7px 10px", textAlign:"right", fontSize:13, color:"#0D0D0D", fontWeight:600 }}>{fmt(vatAmt)}</td>
                              <td style={{ padding:"7px 10px", color:"#9A9A9A", textAlign:"right" }}>—</td>
                              <td style={{ padding:"7px 10px", textAlign:"right", fontSize:13, color:"#0D0D0D" }}>{fmt(vatPaid)}</td>
                              <td style={{ padding:"7px 10px", textAlign:"right", fontSize:13, color:vatRem<0?"#5C2020":"#0D0D0D" }}>{fmt(vatRem)}</td>
                              <td style={{ padding:"7px 10px", textAlign:"right", fontSize:13, color:"#0D0D0D" }}>{vatPlanOnlyCalc > 0 ? fmt(Math.round(vatPlanOnlyCalc)) : "—"}</td>
                              <td />
                              <td style={{ padding:"7px 10px" }}><input value={bs.vatNotes||""} onChange={e=>upd("vatNotes",e.target.value)} style={inputStyle} placeholder="הערות..." /></td>
                            </tr>
                            {/* סהכ תקורות */}
                            <tr style={{ borderTop:"2px solid #D0D5DD" }}>
                              <td colSpan={2} style={{ padding:"8px 10px", fontWeight:800, color:"#444444", fontSize:12 }}>סה״כ תקורות</td>
                              <td style={{ padding:"8px 10px", fontWeight:800, color:"#0D0D0D", textAlign:"right" }}>{fmt(overheadTotalAmt)}</td>
                              <td />
                              <td style={{ padding:"8px 10px", fontWeight:800, color:"#0D0D0D", textAlign:"right" }}>{fmt(overheadPaid+bcmPaid+vatPaid)}</td>
                              <td style={{ padding:"8px 10px", fontWeight:800, color:"#0D0D0D", textAlign:"right" }}>{fmt(overheadRem+bcmRem+vatRem)}</td>
                              <td style={{ padding:"8px 10px", fontWeight:800, color:"#0D0D0D", textAlign:"right" }}>{fmt(Math.round(overheadPlanOnlyCalc+bcmPlanOnlyCalc+vatPlanOnlyCalc))}</td>
                              <td colSpan={2} />
                            </tr>
                            {/* סה"כ כללי */}
                            <tr style={{ background:"#FAF2E6", borderTop:"3px solid #5C3D10" }}>
                              <td colSpan={2} style={{ padding:"11px 10px", fontWeight:900, color:"#5C3D10", fontSize:14 }}>סה״כ כללי</td>
                              <td style={{ padding:"11px 10px", fontWeight:900, color:"#5C3D10", fontSize:14, textAlign:"right" }}>{fmt(grandTotalContract)}</td>
                              <td />
                              <td style={{ padding:"11px 10px", fontWeight:900, color:"#5C3D10", fontSize:14, textAlign:"right" }}>{fmt(grandTotalPaid)}</td>
                              <td style={{ padding:"11px 10px", fontWeight:900, color:"#5C3D10", fontSize:14, textAlign:"right" }}>{fmt(grandTotalRem)}</td>
                              <td style={{ padding:"11px 10px", fontWeight:900, color:"#5C3D10", fontSize:14, textAlign:"right" }}>{fmt(Math.round(basePlanOnly + overheadPlanOnlyCalc + bcmPlanOnlyCalc + vatPlanOnlyCalc))}</td>
                              <td colSpan={2} />
                            </tr>
                          </>);
                        })()}
                      </>);
                    })()}
                  </>);
                })()}
              </tbody>
            )}
          </table>
        </div>
      </Card>

      {budgetOpenConsultant && (
        <ConsultantModal
          consultant={budgetOpenConsultant}
          onClose={() => setBudgetOpenConsultantId(null)}
          onSave={updated => setConsultantsRows(prev => prev.map(r => r.id === updated.id ? updated : r))}
          budgetState={budgetState}
          statsRows={statsRows}
          suppliers={[]}
          openingData={openingData||{}}
          setOpeningData={setOpeningData}
          projectMeta={projectMeta}
        />
      )}
    </div>
  );
}

// ── Helper: date picker showing DD/MM/YYYY ────────────────────────────────────
function DatePickerDMY({ value, onChange, style }) {
  const ref = React.useRef();
  const toISO  = v => v ? v.split('/').reverse().join('-') : "";
  const toDMY  = v => { if (!v) return ""; const [y,m,d] = v.split('-'); return `${d}/${m}/${y}`; };
  return (
    <div style={{ position:"relative", width:"100%" }}>
      <input type="text" readOnly value={value||""} placeholder="DD/MM/YYYY"
        onClick={()=>{ try{ ref.current.showPicker(); }catch(e){ ref.current.focus(); } }}
        style={{ ...style, cursor:"pointer", width:"100%", boxSizing:"border-box" }} />
      <input ref={ref} type="date" value={toISO(value)}
        onChange={e=>onChange(toDMY(e.target.value))}
        style={{ position:"absolute", top:0, left:0, width:"100%", height:"100%", opacity:0, pointerEvents:"none" }} />
    </div>
  );
}

// ── Tab: תוצאות מכרז ─────────────────────────────────────────────────────────

  const archBaseManualT = Number(String((openingData||{}).archBase||"").replace(/[,\s]/g,"").replace(/[^\d.]/g,""));
  const archBase = archBaseManualT > 0 ? archBaseManualT : contractorEst - contractorEst * devPct / 100;
  const fmt = n => { const v=Number(n); return (!n&&n!==0)||isNaN(v)?"—":v.toLocaleString("he-IL"); };
  const fmtDiff = n => { const v=Number(n); if(isNaN(v)||v===0) return "—"; return v.toLocaleString("he-IL"); };

  // Build rows from approved consultants (percentage-based only, contract fee without increases)
  const consultants = [];
  (quotesRows||[]).forEach(field => {
    (field.consultants||[]).filter(c=>c.approved&&c.name?.trim()&&(c.payType||"אחוזים")==="אחוזים").forEach(c => {
      const feePct  = Number(c.value||0);
      const isArch  = ["אדריכל","אדריכלות","אדריכלים"].includes((field.fieldName||"").trim());
      const isPM    = (field.fieldName||"").includes("מנהל פרויקט");
      let sectionEst = 0;
      if (isArch && contractorEst)      sectionEst = archBase;
      else if (isPM && contractorEst)   sectionEst = contractorEst;
      else if (contractorEst) { const pp=profStatPct(statsRows, field.fieldName)/100; sectionEst=contractorEst*pp; }
      // Contract base fee only — no consultant increases
      const initialFee = sectionEst * feePct / 100;
      // BIM = 15% of planning-phase portion
      const isArchOrPM = isArch || isPM;
      const consultantRow = (consultantsRows||[]).find(r => r.id === "q-"+c.id);
      const hasBIM = !!(consultantRow?.increases||[]).some(x => x.isBIM);

// ── מיגרציה: פורמט ישן (שורה לכל איש קשר) → פורמט חדש (contacts:[]) ─────────
function migrateSuppliers(rows) {
  if (!rows || rows.length === 0) return rows || [];
  if (rows[0] && Array.isArray(rows[0].contacts)) return rows;
  const map = {}, order = [];
  rows.forEach(r => {
    const key = (r.name||"") + "\0" + (r.field||"");
    if (!map[key]) { map[key] = { id: r.id, name: r.name||"", field: r.field||"", notes: r.notes||"", contacts: [] }; order.push(key); }
    if (r.contact || r.phone || r.phone2 || r.email)
      map[key].contacts.push({ id: String(r.id)+"_c"+map[key].contacts.length, contact: r.contact||"", phone: r.phone||"", phone2: r.phone2||"", email: r.email||"" });
  });
  return order.map(k => map[k]);
}

// ── ניקוי HTML למניעת XSS מאוחסן ─────────────────────────────────────────────
// מסיר תגים מסוכנים, מאפייני on* (onerror/onclick...) ופרוטוקולים מסוכנים (javascript:).
// משמש עבור תוכן rich-text שנשמר משותף בין משתמשים (workScopes).
const sanitizeHtml = (dirty) => {
  if (!dirty) return "";
  const ALLOWED_TAGS = new Set(["B","STRONG","I","EM","U","S","P","BR","DIV","SPAN","UL","OL","LI","A","H1","H2","H3","H4","BLOCKQUOTE","FONT"]);
  const SAFE_URL = /^(https?:|mailto:|tel:|\/|#|$)/i;
  const tpl = document.implementation.createHTMLDocument("sanitize");
  const root = tpl.body;
  root.innerHTML = dirty;
  const walk = (node) => {
    const kids = Array.from(node.childNodes);
    for (const child of kids) {
      if (child.nodeType === 1) { // element
        if (!ALLOWED_TAGS.has(child.tagName)) {
          // תג לא מורשה: שמור את התוכן הפנימי, זרוק את התג עצמו
          while (child.firstChild) node.insertBefore(child.firstChild, child);
          node.removeChild(child);
          continue;
        }
        // נקה מאפיינים מסוכנים
        for (const attr of Array.from(child.attributes)) {
          const name = attr.name.toLowerCase();
          if (name.startsWith("on")) { child.removeAttribute(attr.name); continue; }
          if ((name === "href" || name === "src") && !SAFE_URL.test((attr.value || "").trim())) {
            child.removeAttribute(attr.name); continue;
          }
          if (name === "style" && /expression|url\s*\(|javascript:/i.test(attr.value || "")) {
            child.removeAttribute(attr.name); continue;
          }
        }
        walk(child);
      } else if (child.nodeType !== 3) {
        // לא טקסט ולא אלמנט (תגובות וכו') — הסר
        node.removeChild(child);
      }
    }
  };
  walk(root);
  return root.innerHTML;
};

// ── RichEditor: contenteditable div שמשמר HTML ────────────────────────────────
const RichEditor = React.memo(function RichEditor({ html, onChange, placeholder, style }) {
  const ref = React.useRef(null);
  const lastHtml = React.useRef(html);
  React.useEffect(() => {
    const clean = sanitizeHtml(html);
    if (ref.current && ref.current.innerHTML !== clean) {
      ref.current.innerHTML = clean;
      lastHtml.current = clean;
    }
  }, [html]);
  return (
    <div
      ref={ref}
      contentEditable
      suppressContentEditableWarning
      dir="rtl"
      data-placeholder={placeholder}
      onBlur={() => { if (onChange && ref.current) { const clean = sanitizeHtml(ref.current.innerHTML); onChange(clean); lastHtml.current = clean; } }}
      style={{ outline:"none", ...style }}
    />
  );
});

// ── FieldMultiSelect — tag-based multi-select with free-text add ──────────────
function FieldMultiSelect({ selected, options, onChange }) {
  const [input, setInput] = React.useState("");
  const [open, setOpen]   = React.useState(false);
  const ref = React.useRef(null);
  React.useEffect(() => {
    const h = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", h);
    return () => document.removeEventListener("mousedown", h);
  }, []);
  const q        = input.trim().toLowerCase();
  const qNorm    = _normSupName(input);
  const filtered = options.filter(o => !selected.includes(o) && o.toLowerCase().includes(q));
  const canAdd   = qNorm.length > 0 && !options.some(o => _normSupName(o) === qNorm) && !selected.some(s => _normSupName(s) === qNorm);
  const add = val => { const v = _cleanText(val); if (!v || selected.some(s => _normSupName(s) === _normSupName(v))) return; onChange([...selected, v]); setInput(""); };
  const remove = val => onChange(selected.filter(s => s !== val));
  return (
    <div ref={ref} style={{ position:"relative" }}>
      <div
        onClick={() => { setOpen(true); ref.current?.querySelector("input")?.focus(); }}
        style={{ border:"1.5px solid #E2E5EA", borderRadius:4, padding:"5px 8px", background:"#fff", cursor:"text",
                 minHeight:38, display:"flex", flexWrap:"wrap", gap:5, alignItems:"center" }}>
        {selected.map(s => (
          <span key={s} style={{ display:"inline-flex", alignItems:"center", gap:4, background:"#EAF1FA",
            color:"#163356", border:"1px solid #B8CEED", borderRadius:4, padding:"2px 7px", fontSize:12, fontWeight:600 }}>
            {s}
            <span onClick={e => { e.stopPropagation(); remove(s); }}
              style={{ cursor:"pointer", fontWeight:700, fontSize:13, lineHeight:1, marginRight:1 }}>×</span>
          </span>
        ))}
        <input
          value={input}
          onChange={e => { setInput(e.target.value); setOpen(true); }}
          onFocus={() => setOpen(true)}
          onKeyDown={e => {
            if (e.key === "Enter") { e.preventDefault(); canAdd ? add(input.trim()) : (filtered[0] && add(filtered[0])); }
            if (e.key === "Backspace" && !input && selected.length) remove(selected[selected.length - 1]);
            if (e.key === "Escape") setOpen(false);
          }}
          placeholder={selected.length === 0 ? "הקלד לחיפוש או להוספת תחום..." : ""}
          style={{ border:"none", outline:"none", fontSize:13, fontFamily:"'Heebo',sans-serif",
                   minWidth:120, flex:1, background:"transparent", direction:"rtl" }} />
      </div>
      {open && (filtered.length > 0 || canAdd) && (
        <div style={{ position:"absolute", top:"calc(100% + 2px)", right:0, left:0, background:"#fff",
          border:"1.5px solid #B8CEED", borderRadius:4, zIndex:200, boxShadow:"0 4px 16px #0002",
          maxHeight:200, overflowY:"auto" }}>
          {filtered.map(o => (
            <div key={o} onMouseDown={e => { e.preventDefault(); add(o); }}
              style={{ padding:"7px 12px", fontSize:13, cursor:"pointer", fontFamily:"'Heebo',sans-serif" }}
              onMouseEnter={e => e.currentTarget.style.background="#EAF1FA"}
              onMouseLeave={e => e.currentTarget.style.background="#fff"}>{o}</div>
          ))}
          {canAdd && (
            <div onMouseDown={e => { e.preventDefault(); add(input.trim()); }}
              style={{ padding:"7px 12px", fontSize:13, cursor:"pointer", fontFamily:"'Heebo',sans-serif",
                color:"#0C5749", fontWeight:700, borderTop: filtered.length ? "1px solid #E2E5EA" : "none" }}
              onMouseEnter={e => e.currentTarget.style.background="#EEF9F7"}
              onMouseLeave={e => e.currentTarget.style.background="#fff"}>
              + הוסף תחום חדש: "{input.trim()}"
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ── Supplier rating helpers ───────────────────────────────────────────────────
const getSupplierAvg = (name, allSuppliers) => {
  const found = (allSuppliers||[]).find(sup => sup.name === name);
  if (!found || !found.ratings || found.ratings.length === 0) return null;
  return found.ratings.reduce((sum, r) => sum + r.avg, 0) / found.ratings.length;
};

// שמירה אוטומטית של דירוג יועץ לפרויקט: שני שדות מלאים = עדכון/יצירה, שניהם ריקים = הסרה, קלט חלקי = המתנה
const persistRating = (setSuppliers, projectName, name, consultantField, r) => {
  const svc = Number(r.service), pro = Number(r.professionalism);
  const bothEmpty = !r.service && !r.professionalism;
  const bothValid = svc >= 1 && svc <= 5 && pro >= 1 && pro <= 5;
  if (!bothEmpty && !bothValid) return;
  setSuppliers(prev => {
    if (!prev.some(s => s.name === name)) {
      if (bothEmpty) return prev;
      const avg = (svc + pro) / 2;
      return [...prev, { id: Date.now() + Math.random(), name, field: consultantField || "", notes: "", contacts: [],
        ratings: [{ projectName, avg, service: svc, professionalism: pro, ratedAt: Date.now() }] }];
    }
    return prev.map(sup => {
      if (sup.name !== name) return sup;
      const prevRatings = sup.ratings || [];
      const hasEntry = prevRatings.some(rt => rt.projectName === projectName);
      if (bothEmpty) return hasEntry ? { ...sup, ratings: prevRatings.filter(rt => rt.projectName !== projectName) } : sup;
      const avg = (svc + pro) / 2;
      const newEntry = { projectName, avg, service: svc, professionalism: pro, ratedAt: Date.now() };
      return { ...sup, ratings: hasEntry
        ? prevRatings.map(rt => rt.projectName === projectName ? newEntry : rt)
        : [...prevRatings, newEntry] };
    });
  });
};

function ProjectRatingModal({ projectName, approvedConsultants, suppliers, setSuppliers, onClose }) {
  const initRatings = () => {
    const init = {};
    approvedConsultants.forEach(({ name }) => {
      const sup = (suppliers||[]).find(s => s.name === name);
      const existing = sup?.ratings?.find(r => r.projectName === projectName);
      // דירוג קיים מוצג כערך אמיתי בשדות — רשומות ישנות בלי service/professionalism נופלות ל-avg

// ── Supplier profile modal ────────────────────────────────────────────────────
function SupplierProfileModal({ supplier, projects, allData, onClose, setSuppliers, userRole }) {
  const [collapsed, setCollapsed] = React.useState({ "הוקפא": true, "נמסר": true, "בוטל": true });
  const [activeField, setActiveField] = React.useState(null);
  const [ratingsOpen, setRatingsOpen] = React.useState(false);
  const isAdmin = userRole?.role === "admin";
  const toggle = st => setCollapsed(p => ({ ...p, [st]: !p[st] }));
  const toFA = f => Array.isArray(f) ? f : (f ? [f] : []);

  // התאמת שם עמידה לתווים נסתרים (מנתונים מיובאים):
  // normName מסיר תווי פורמט/כיווניות/רוחב-אפס ומאחד רווחים (קוד-תווים מספרי, בלי תווים נסתרים בקוד).
  // ההתאמה חייבת להיות מלאה ומדויקת על השם כולו — "דוד דוד" ≠ "דוד ברהום",
  // "קרן אור לי" ≠ "קרן אור לי מהנדסים" — כדי שלא יוצגו תחת יועץ אחד פרויקטים של יועץ אחר.
  const normName = (s) => {
    let out = "";
    for (const ch of String(s || "")) {
      const cp = ch.codePointAt(0);
      if (cp === 0x00AD || cp === 0xFEFF || (cp >= 0x200B && cp <= 0x200F) || (cp >= 0x202A && cp <= 0x202E) || (cp >= 0x2066 && cp <= 0x2069)) continue;
      if (cp === 0x00A0 || cp === 0x202F || cp === 0x205F || cp === 0x3000 || (cp >= 0x2000 && cp <= 0x200A)) { out += " "; continue; }
      out += ch;
    }
    return out.replace(/\s+/g, " ").trim().toLowerCase();
  };
  const supplierName = normName(supplier.name);
  const namesMatch = (cname) => {
    const cn = normName(cname);
    if (!cn || !supplierName) return false;
    return cn === supplierName;
  };
  const allMatched = [];
  (projects || []).forEach(proj => {
    (allData[proj.id]?.quotes || []).forEach(field => {
      (field.consultants || []).forEach(c => {
        // רק יועצים שאושרו — מי שרק הגיש הצעה ולא נבחר לא "עבד" בפרויקט ואסור שיוצג תחתיו.
        if (c.approved && namesMatch(c.name)) {
          allMatched.push({ proj, fieldName: field.fieldName || "", consultant: c });
        }
      });
    });
  });

  // Unique fields this supplier appears in across all projects
  const uniqueFields = [...new Set(allMatched.map(m => m.fieldName).filter(Boolean))];
  const multiField = uniqueFields.length > 1;

  // Filter by active field tab if selected
  const matchedRaw = activeField ? allMatched.filter(m => m.fieldName === activeField) : allMatched;
  // דה-דופ לפי פרויקט+תחום — כפילות באותו תחום מתאחדת, אבל אם הספק עובד בכמה תחומים
  // באותו פרויקט הוא יוצג פעם לכל תחום.
  const _seenKey = new Set();
  const matched = matchedRaw.filter(m => { const k = m.proj.id + "|" + m.fieldName; if (_seenKey.has(k)) return false; _seenKey.add(k); return true; });

  const STATUSES = ["תכנון", "ביצוע", "הוקפא", "נמסר", "בוטל"];
  const groups = {};
  STATUSES.forEach(st => { groups[st] = []; });
  matched.forEach(item => {
    const st = item.proj.status || "תכנון";
    if (!groups[st]) groups[st] = [];
    groups[st].push(item);
  });
  // הצג כל סטטוס שיש בו פרויקטים מותאמים — כולל סטטוסים שאינם ברשימה הקבועה
  // (פרויקטים מיובאים עשויים להגיע בסטטוס אחר, ואסור שייפלו מהתצוגה).
  const displayStatuses = [...STATUSES, ...Object.keys(groups).filter(st => !STATUSES.includes(st) && groups[st].length > 0)];

  return (
    <div style={{ position:"fixed", inset:0, background:"#00000060", display:"flex", alignItems:"center", justifyContent:"center", zIndex:2000 }}
      onClick={onClose}>
      <div className="fade" onClick={e => e.stopPropagation()}
        style={{ background:"#fff", borderRadius:8, padding:28, width:"90%", maxWidth:560, maxHeight:"88vh", overflowY:"auto", boxShadow:"0 24px 64px #0004", display:"flex", flexDirection:"column", gap:16, direction:"rtl" }}>

        {/* Name + close */}
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start" }}>
          <div>
            <div style={{ fontSize:19, fontWeight:800, color:"#0D0D0D", marginBottom:6 }}>{supplier.name}</div>
            {/* Field tags — derived from actual project appearances, clickable when multiple */}
            {uniqueFields.length > 0 && (
              <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
                {uniqueFields.map(f => {
                  const isActive = activeField === f;
                  return (
                    <span key={f}
                      onClick={multiField ? e => { e.stopPropagation(); setActiveField(isActive ? null : f); } : undefined}
                      style={{
                        fontSize:12, padding:"3px 10px", borderRadius:20,
                        background: isActive ? "#0B1F3A" : "#EAF1FA",
                        color: isActive ? "#fff" : "#3A6B9A",
                        fontWeight:600,
                        cursor: multiField ? "pointer" : "default",
                        userSelect:"none",
                        border: isActive ? "1.5px solid #0B1F3A" : "1.5px solid #B8CEED",
                      }}>
                      {f}
                    </span>
                  );
                })}
              </div>
            )}
          </div>
          <button onClick={onClose}
            style={{ background:"none", border:"none", fontSize:20, cursor:"pointer", color:"#9A9A9A", lineHeight:1, padding:"0 2px", flexShrink:0 }}>✕</button>
        </div>

        {/* Star rating */}
        {(() => {
          const ratings = supplier.ratings || [];
          const overallAvg = ratings.length > 0 ? ratings.reduce((s,r) => s + r.avg, 0) / ratings.length : null;
          return (
            <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
              <div style={{ display:"flex", gap:4, alignItems:"center" }}>
                {/* מילוי חלקי של כוכבים לפי הדירוג המדויק (4.5 = ארבעה וחצי כוכבים) */}
                <div style={{ position:"relative", display:"inline-block", fontSize:22, lineHeight:1, direction:"rtl" }}>
                  <span style={{ color:"#D8DCE3", letterSpacing:3 }}>★★★★★</span>
                  {overallAvg !== null && (
                    <span style={{ position:"absolute", top:0, right:0, width:`${Math.max(0, Math.min(5, overallAvg)) / 5 * 100}%`, overflow:"hidden", whiteSpace:"nowrap", color:"#F5A623", letterSpacing:3, direction:"rtl" }}>★★★★★</span>
                  )}
                </div>
                {overallAvg !== null
                  ? <span style={{ fontSize:13, fontWeight:700, color:"#3A3A3A", marginRight:6 }}>{overallAvg.toFixed(1)} ({ratings.length} דירוגים)</span>
                  : <span style={{ fontSize:11, color:"#B0B7C3", marginRight:6 }}>אין דירוגים עדיין</span>
                }
              </div>

              {/* Admin: ratings list — נפתח בלחיצה, ללא הוספה ידנית (דירוגים נוצרים רק מתוך הפרויקטים) */}
              {isAdmin && ratings.length > 0 && (
                <div style={{ background:"#F7F8FA", borderRadius:6, overflow:"hidden" }}>
                  <div onClick={() => setRatingsOpen(o => !o)}
                    style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"8px 12px", cursor:"pointer", userSelect:"none" }}>
                    <span style={{ fontSize:11, fontWeight:700, color:"#767676", letterSpacing:1 }}>ניהול דירוגים (אדמין) — {ratings.length} פרויקטים</span>
                    <span style={{ fontSize:11, color:"#767676" }}>{ratingsOpen ? "▲" : "▼"}</span>
                  </div>
                  {ratingsOpen && (
                    <div style={{ padding:"0 12px 10px", display:"flex", flexDirection:"column", gap:8 }}>
                      {ratings.map((r, idx) => (
                        <div key={idx} style={{ display:"flex", alignItems:"center", justifyContent:"space-between", fontSize:12 }}>
                          <span style={{ color:"#3A3A3A" }}>{r.projectName}</span>
                          <span style={{ color:"#F5A623", fontWeight:700 }}>★ {r.avg.toFixed(1)}</span>
                          <button onClick={() => {
                            const updated = { ...supplier, ratings: ratings.filter((_,i) => i !== idx) };
                            setSuppliers(prev => prev.map(s => s.id === supplier.id ? updated : s));
                          }} style={{ background:"#F8EDED", color:"#5C2020", border:"none", borderRadius:4, padding:"2px 8px", fontSize:11, cursor:"pointer", fontFamily:"'Heebo',sans-serif" }}>מחק</button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        })()}

        <div style={{ borderTop:"1px solid #E2E5EA" }} />

        <div style={{ fontSize:13, fontWeight:700, color:"#3A3A3A" }}>פרויקטים ({matched.length})</div>

        {allMatched.length === 0 ? (
          <div style={{ color:"#9A9A9A", fontSize:13, padding:"8px 0" }}>ספק זה אינו מופיע כיועץ באף פרויקט</div>
        ) : (
          <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
            {displayStatuses.map(st => {
              const items = groups[st] || [];
              if (items.length === 0) return null;
              const isOpen = !collapsed[st];
              return (
                <div key={st} style={{ border:"1px solid #E2E5EA", borderRadius:6, overflow:"hidden" }}>
                  <div onClick={() => toggle(st)}
                    style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"10px 14px", background:"#F7F8FA", cursor:"pointer", userSelect:"none" }}>
                    <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                      <div style={{ width:8, height:8, borderRadius:"50%", background:statusColor(st), flexShrink:0 }} />
                      <span style={{ fontWeight:700, fontSize:13, color:"#0D0D0D" }}>{st}</span>
                      <span style={{ fontSize:12, color:"#767676" }}>({items.length})</span>
                    </div>
                    <span style={{ fontSize:12, color:"#9A9A9A" }}>{isOpen ? "▲" : "▼"}</span>
                  </div>
                  {isOpen && (
                    <div style={{ padding:"8px 0" }}>
                      {items.map(({ proj, fieldName }, idx) => (
                        <div key={proj.id + "-" + idx}
                          style={{ padding:"8px 14px", borderTop: idx > 0 ? "1px solid #F0F2F5" : "none" }}>
                          <div style={{ fontWeight:600, fontSize:13, color:"#0D0D0D" }}>{proj.name}</div>
                          {fieldName && <div style={{ fontSize:11, color:"#767676", marginTop:2 }}>{fieldName}</div>}
                        </div>
                      ))}
                    </div>

            })}

function SuppliersPage({ suppliers, setSuppliers, professions, projects, allData, userRole }) {

  const [editId,   setEditId]   = useState(null);   // supplier id or "new"
  const [editData,   setEditData]   = useState(null);   // { name, field, notes, contacts:[] }
  const [editError, setEditError] = useState("");
  const [sortCol,  setSortCol]  = useState("field");  // "field" | "name"
  const [sortDir,  setSortDir]  = useState(1);        // 1=א-ב, -1=ב-א
  const toggleSort = col => { if (sortCol === col) setSortDir(d => -d); else { setSortCol(col); setSortDir(1); } };

  const allFields = (() => {
    const seen = new Map(); // normKey -> display
    const raw = [
      ...suppliers.flatMap(s => Array.isArray(s.field) ? s.field : (s.field ? [s.field] : [])).filter(Boolean),
      ...(professions || [])
    ];
    for (const f of raw) {
      const disp = _cleanText(f);
      if (!disp) continue;
      const key = _normSupName(f);
      if (!seen.has(key)) seen.set(key, disp);
    }
    return [...seen.values()].sort((a, b) => a.localeCompare(b, "he"));
  })();

  const emptyContact = () => ({ id:Date.now(), contact:"", phone:"", phone2:"", email:"" });
  const validPhone = v => (v||"").replace(/\D/g,"").length >= 7;
  const validEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((v||"").trim());
  const del = id => { if(window.confirm("למחוק את הספק?")) setSuppliers(prev => prev.filter(s => s.id !== id)); };
  const toFieldArr = f => Array.isArray(f) ? f : (f ? [f] : []);
  const openEdit = s => { const cts = (s.contacts||[]).map(c=>({...c})); setEditId(s.id); setEditData({ name:s.name||"", field:toFieldArr(s.field), notes:s.notes||"", contacts: cts.length>0 ? cts : [emptyContact()] }); setEditError(""); };
  const openNew  = ()  => { setEditId("new"); setEditData({ name:"", field:[], notes:"", contacts:[emptyContact()] }); setEditError(""); };
  const closeModal = () => { setEditId(null); setEditData(null); setEditError(""); };
  const saveModal = () => {
    if (!editData.name.trim()) { setEditError("יש להזין שם ספק"); return; }
    const cleanContacts = editData.contacts.filter(c => c.contact||c.phone||c.phone2||c.email);
    if (cleanContacts.length === 0) { setEditError("יש להזין לפחות איש קשר אחד עם פרטי התקשרות (טלפון, נייד או מייל)"); return; }
    for (const c of cleanContacts) {
      const hasPhone = c.phone && validPhone(c.phone);
      const hasPhone2 = c.phone2 && validPhone(c.phone2);
      const hasEmail = c.email && validEmail(c.email);
      if (!hasPhone && !hasPhone2 && !hasEmail) {
        setEditError(`לאיש הקשר "${c.contact||"ללא שם"}" חסרים פרטי התקשרות תקינים — יש למלא לפחות טלפון, נייד או מייל`); return;
      }
      if (c.phone && !validPhone(c.phone)) { setEditError(`מספר טלפון לא תקין עבור "${c.contact||"ללא שם"}"`); return; }
      if (c.phone2 && !validPhone(c.phone2)) { setEditError(`מספר נייד לא תקין עבור "${c.contact||"ללא שם"}"`); return; }
      if (c.email && !validEmail(c.email)) { setEditError(`כתובת מייל לא תקינה עבור "${c.contact||"ללא שם"}"`); return; }
    }
    const cleanFields = [];
    const seenF = new Set();
    for (const f of (editData.field || [])) {
      const disp = _cleanText(f), k = _normSupName(f);
      if (disp && !seenF.has(k)) { seenF.add(k); cleanFields.push(disp); }
    }
    const dataToSave = { ...editData, field: cleanFields, contacts: cleanContacts };
    if (editId === "new") setSuppliers(prev => [...prev, { ...dataToSave, id: Date.now() }]);
    else setSuppliers(prev => prev.map(s => s.id === editId ? { ...s, ...dataToSave } : s));
    closeModal();
  };
  const addContact = () => setEditData(p=>({...p, contacts:[...p.contacts, emptyContact()]}));
  const delContact = cId => setEditData(p=>({...p, contacts:p.contacts.filter(c=>c.id!==cId)}));
  const updContact = (cId,key,val) => setEditData(p=>({...p, contacts:p.contacts.map(c=>c.id===cId?{...c,[key]:val}:c)}));

  const q = search.trim().toLowerCase();
  const filtered = suppliers
    .filter(s => !q || [s.name,...toFieldArr(s.field),s.notes,...(s.contacts||[]).flatMap(c=>[c.contact,c.phone,c.phone2,c.email])].some(v=>String(v||"").toLowerCase().includes(q)))
    .sort((a,b) => {
      const primary = sortCol === "name"
        ? (a.name||"").localeCompare(b.name||"","he")
        : (toFieldArr(a.field)[0]||"").localeCompare(toFieldArr(b.field)[0]||"","he");
      const secondary = sortCol === "name"
        ? (toFieldArr(a.field)[0]||"").localeCompare(toFieldArr(b.field)[0]||"","he")
        : (a.name||"").localeCompare(b.name||"","he");
      return sortDir * (primary || secondary);
    });


  const IS = { padding:"6px 10px", border:"1.5px solid #E2E5EA", borderRadius:4, fontSize:13, fontFamily:"'Heebo',sans-serif", outline:"none", width:"100%", boxSizing:"border-box" };
  const CS = { padding:"5px 8px", border:"1.5px solid #E2E5EA", borderRadius:4, fontSize:12, fontFamily:"'Heebo',sans-serif", outline:"none", width:"100%" };

  return (
    <div className="fade" style={{ display:"flex", flexDirection:"column", flex:1, minHeight:0, overflow:"hidden" }}>
      <div style={{ flexShrink:0, padding:"30px 36px 0", display:"flex", flexDirection:"column", gap:20 }}>
      {/* Header */}
      <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between", flexWrap:"wrap", gap:12 }}>
        <div>
          <div style={{ fontSize:11, color:"#444444", fontWeight:700, letterSpacing:3, marginBottom:4 }}>גיליון גלובלי</div>
          <h1 style={{ fontSize:24, fontWeight:900, color:"#0D0D0D" }}>רשימת ספקים</h1>
          <div style={{ fontSize:13, color:"#767676", marginTop:2 }}>ניהול כללי של כל הספקים במערכת</div>
        </div>
        <div style={{ display:"flex", gap:10 }}>
          <label style={{ display:"flex", alignItems:"center", gap:7, padding:"9px 16px", background:"#F7F8FA", color:"#3A3A3A", border:"1.5px solid #C6E8D4", borderRadius:4, fontSize:13, fontWeight:700, fontFamily:"'Heebo',sans-serif", cursor:"pointer" }}>
            ייבוא מאקסל ↑
            <input type="file" accept=".csv,.xlsx,.xls" style={{ display:"none" }} onChange={e => {
              const file = e.target.files?.[0]; if (!file) return;
              const reader = new FileReader();
              reader.onload = ev => {
                try {
                  const XLSX = window.XLSX;
                  if (!XLSX) { alert("ספריית Excel לא נטענה, נסה שוב"); return; }
                  const wb = XLSX.read(ev.target.result, { type:"array" });
                  const ws = wb.Sheets[wb.SheetNames[0]];
                  const data = XLSX.utils.sheet_to_json(ws, { header:1, defval:"" });
                  if (data.length < 2) return;
                  const impMap = {}, impOrder = [];
                  data.slice(1).forEach(cols => {
                    const name = String(cols[1]||"").trim(); if (!name) return;
                    const field = String(cols[0]||"").trim();
                    const key = name+"\0"+field;
                    if (!impMap[key]) { impMap[key] = { id:Date.now()+Math.random(), name, field, notes:String(cols[6]||"").trim(), contacts:[] }; impOrder.push(key); }
                    const c = String(cols[2]||"").trim(), p=String(cols[3]||"").trim(), p2=String(cols[4]||"").trim(), em=String(cols[5]||"").trim();
                    if (c||p||p2||em) impMap[key].contacts.push({ id:Date.now()+Math.random(), contact:c, phone:p, phone2:p2, email:em });
                  });
                  setSuppliers(prev => [...prev, ...impOrder.map(k=>impMap[k])]);
                } catch(err) { alert("שגיאה בייבוא הקובץ: " + err.message); }
              };
              reader.readAsArrayBuffer(file);
              e.target.value = "";
            }} />
          </label>
          <button onClick={openNew}
            style={{ display:"flex", alignItems:"center", gap:7, padding:"9px 18px", background:"#0B1F3A", color:"#fff", border:"none", borderRadius:4, fontSize:13, fontWeight:700, fontFamily:"'Heebo',sans-serif", cursor:"pointer" }}>
            + הוסף ספק חדש
          </button>
        </div>
      </div>

      {/* Search */}
      <Card style={{ padding:"14px 18px" }}>
        <div style={{ position:"relative" }}>
          <span style={{ position:"absolute", right:12, top:"50%", transform:"translateY(-50%)", color:"#9A9A9A", fontSize:16 }}>🔍</span>
          <input value={search} onChange={e => setSearch(e.target.value)}
            placeholder="חיפוש חופשי — שם, מקצוע, איש קשר, טלפון, מייל..."
            style={{ width:"100%", padding:"8px 40px 8px 12px", border:"1.5px solid #0B1F3A", borderRadius:4, fontSize:13, fontFamily:"'Heebo',sans-serif", outline:"none", boxSizing:"border-box" }} />
        </div>
      </Card>

      </div>
      <div style={{ flex:1, overflowY:"auto", minHeight:0, padding:"16px 36px 30px" }}>
      {/* Table */}
      <Card style={{ padding:0, overflow:"hidden" }}>
        <table style={{ width:"100%", borderCollapse:"collapse", fontSize:13, direction:"rtl" }}>
          <thead>
            <tr style={{ background:"#F7F8FA", borderBottom:"2px solid #E2E5EA" }}>
              {[["מקצוע / תחום","field"],["★",null],["שם ספק / חברה","name"],["איש קשר",null],["טלפון",null],["נייד",null],["מייל",null],["הערות",null],["פעולות",null]].map(([h,col])=>(
                <th key={h} onClick={col ? ()=>toggleSort(col) : undefined}
                  style={{ padding:"11px 16px", textAlign:"right", color: col?"#0B1F3A":"#767676", fontWeight:700, fontSize:11, whiteSpace:"nowrap", cursor:col?"pointer":"default", userSelect:"none" }}>
                  {h}{col && (sortDir===1?" ▲":" ▼")}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {filtered.length === 0 && (
              <tr><td colSpan={9} style={{ padding:"32px", textAlign:"right", color:"#9A9A9A", fontSize:13 }}>אין ספקים עדיין — לחץ "הוסף ספק חדש"</td></tr>
            )}
            {filtered.map((s, si) => {
              const cts = s.contacts && s.contacts.length > 0 ? s.contacts : [null];
              const bg = si%2===0 ? "#fff" : "#F7F8FA";
              return cts.map((c, ci) => {
                const isFirst = ci === 0;
                const isLast  = ci === cts.length - 1;
                return (
                  <tr key={s.id+"-"+(c?c.id:0)} className="hov-row"
                    onClick={() => setProfileSupplier(s)}
                    style={{ background: c&&!isFirst?"#F7F8FA":bg, borderBottom: isLast?"1px solid #E2E5EA":"1px solid #EAF1FA", cursor:"pointer" }}>
                    <td style={{ padding:"10px 16px", color:"#3A3A3A", verticalAlign:"top" }}>{isFirst ? (toFieldArr(s.field).join(", ") || "—") : ""}</td>
                    <td style={{ padding:"10px 4px", textAlign:"center", verticalAlign:"top", width:40 }}>{isFirst ? <RatingBadge name={s.name} suppliers={suppliers} /> : null}</td>
                    <td style={{ padding:"10px 16px", fontWeight: isFirst?700:400, color: isFirst?"#0D0D0D":"#767676", verticalAlign:"top" }}>
                      {isFirst ? s.name : ""}
                    </td>
                    <td style={{ padding:"10px 16px", color:"#3A3A3A" }}>{c ? (c.contact||"—") : "—"}</td>
                    <td style={{ padding:"10px 16px", color:"#3A3A3A" }}>{c ? (c.phone||"—") : "—"}</td>
                    <td style={{ padding:"10px 16px", color:"#3A3A3A" }}>{c ? (c.phone2||"—") : "—"}</td>
                    <td style={{ padding:"10px 16px", color:"#3A3A3A" }}>{c && c.email ? <a href={"mailto:"+c.email} style={{color:"#3A3A3A"}}>{c.email}</a> : "—"}</td>
                    <td style={{ padding:"10px 16px", color:"#3A3A3A", maxWidth:160, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{isFirst ? (s.notes||"—") : ""}</td>
                    <td style={{ padding:"10px 16px", whiteSpace:"nowrap" }}>
                      {isFirst && <>
                        <button onClick={e => { e.stopPropagation(); openEdit(s); }} style={{ background:"#F7F8FA", color:"#3A3A3A", border:"none", borderRadius:4, padding:"4px 10px", fontSize:12, cursor:"pointer", fontFamily:"'Heebo',sans-serif", marginLeft:4 }}>✏️</button>
                        <button onClick={e => { e.stopPropagation(); del(s.id); }} style={{ background:"#F8EDED", color:"#5C2020", border:"none", borderRadius:4, padding:"4px 10px", fontSize:12, cursor:"pointer", fontFamily:"'Heebo',sans-serif" }}>🗑</button>
                      </>}
                    </td>
                  </tr>
                );
              });
            })}
          </tbody>
          <tfoot>
            <tr style={{ background:"#F7F8FA", borderTop:"2px solid #E2E5EA" }}>
              <td colSpan={9} style={{ padding:"8px 16px", color:"#767676", fontSize:12 }}>סה״כ {filtered.length} ספקים{search?" (מסונן)":""}</td>
            </tr>
          </tfoot>
        </table>
      </Card>

      {/* Supplier profile modal */}
      {profileSupplier && (
        <SupplierProfileModal
          supplier={profileSupplier}
          projects={projects || []}
          allData={allData || {}}
          onClose={() => setProfileSupplier(null)}
          setSuppliers={setSuppliers}
          userRole={userRole}
        />
      )}

      {/* Add / Edit modal */}
      {editId && editData && (
        <div style={{ position:"fixed", inset:0, background:"#00000060", display:"flex", alignItems:"center", justifyContent:"center", zIndex:2000 }}
          onClick={closeModal}>
          <div className="fade" onClick={e=>e.stopPropagation()}
            style={{ background:"#fff", borderRadius:8, padding:28, width:"90%", maxWidth:980, maxHeight:"88vh", overflowY:"auto", boxShadow:"0 24px 64px #0004", display:"flex", flexDirection:"column", gap:16 }}>
            <div style={{ fontSize:17, fontWeight:800, color:"#0D0D0D" }}>{editId==="new"?"➕ ספק חדש":"✏️ עריכת ספק"}</div>

            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:12 }}>
              <div style={{ display:"flex", flexDirection:"column", gap:4 }}>
                <label style={{ fontSize:11, fontWeight:700, color:"#767676" }}>שם ספק / חברה *</label>
                <input value={editData.name} onChange={e=>setEditData(p=>({...p,name:e.target.value}))}
                  placeholder="" style={IS} autoFocus={editId==="new"} />
              </div>
              <div style={{ display:"flex", flexDirection:"column", gap:4 }}>
                <label style={{ fontSize:11, fontWeight:700, color:"#767676" }}>מקצוע / תחום (ניתן לבחור מספר)</label>
                <FieldMultiSelect
                  selected={editData.field||[]}
                  options={allFields}
                  onChange={fields => setEditData(p => ({ ...p, field: fields }))}
                />
              </div>
            </div>
            <div style={{ display:"flex", flexDirection:"column", gap:4 }}>
              <label style={{ fontSize:11, fontWeight:700, color:"#767676" }}>הערות</label>
              <input value={editData.notes} onChange={e=>setEditData(p=>({...p,notes:e.target.value}))} placeholder="הערות נוספות..." style={IS} />
            </div>

            {/* Contacts */}
            <div>
              <div style={{ fontSize:13, fontWeight:700, color:"#3A3A3A", borderBottom:"1px solid #E2E5EA", paddingBottom:8, marginBottom:10 }}>
                אנשי קשר ({editData.contacts.length})
              </div>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr 2fr 2fr 32px", gap:6, marginBottom:4 }}>
                {["שם","טלפון","נייד","מייל","הערות",""].map((h,i)=><div key={i} style={{ fontSize:10, fontWeight:700, color:"#9A9A9A" }}>{h}</div>)}
              </div>
              {editData.contacts.map((c, ci) => (
                <div key={c.id} style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr 2fr 2fr 32px", gap:6, marginBottom:6, alignItems:"center",
                  background:ci%2===0?"#F7F8FA":"#FAFBFC", borderRadius:4, padding:"6px 8px" }}>
                  <input value={c.contact||""} placeholder="שם" onChange={e=>updContact(c.id,"contact",e.target.value)} style={CS} />
                  <input value={c.phone||""}   placeholder="03-…" onChange={e=>updContact(c.id,"phone",e.target.value)}   style={CS} />
                  <input value={c.phone2||""}  placeholder="05x-…" onChange={e=>updContact(c.id,"phone2",e.target.value)} style={CS} />
                  <input value={c.email||""}   placeholder="מייל"  onChange={e=>updContact(c.id,"email",e.target.value)}  style={CS} />
                  <input value={c.notes||""}   placeholder="הערות" onChange={e=>updContact(c.id,"notes",e.target.value)}  style={CS} />
                  {editData.contacts.length > 1 && <button onClick={()=>delContact(c.id)} style={{ background:"#F8EDED",color:"#5C2020",border:"none",borderRadius:4,padding:"4px 6px",cursor:"pointer",fontSize:12 }}>🗑</button>}
                </div>
              ))}
              <button onClick={addContact}
                style={{ marginTop:8, background:"#EAF1FA", color:"#163356", border:"1.5px dashed #B8CEED", borderRadius:4, padding:"6px 14px", fontSize:12, cursor:"pointer", fontFamily:"'Heebo',sans-serif", fontWeight:700 }}>
                + הוסף איש קשר
              </button>
            </div>

            {editError && <div style={{ color:"#5C2020", fontSize:13, background:"#F8EDED", border:"1px solid #F0B8B8", borderRadius:8, padding:"8px 12px" }}>{editError}</div>}
            <div style={{ display:"flex", gap:10, justifyContent:"flex-start", marginTop:4 }}>
              <button onClick={saveModal}
                style={{ padding:"8px 24px", background:"#0B1F3A", color:"#fff", border:"1.5px solid transparent", borderRadius:4, fontSize:14, fontWeight:700, fontFamily:"'Heebo',sans-serif", cursor:"pointer" }}>
                {editId==="new"?"הוסף":"שמור"}
              </button>
              <button onClick={closeModal}
                style={{ padding:"8px 18px", background:"#F0F2F5", color:"#767676", border:"1.5px solid transparent", borderRadius:4, fontSize:14, fontFamily:"'Heebo',sans-serif", cursor:"pointer" }}>ביטול</button>
            </div>
          </div>
        </div>
      )}
      </div>
    </div>
  );
}

// ── Global page: חברות עירוניות ─────────────────────────────────────────────
function CompaniesPage({ companies, setCompanies }) {
  const [form, setForm] = useState({ name:"", contact:"", phone:"", email:"" });
  const [editId, setEditId] = useState(null);
  const [editForm, setEditForm] = useState({});
  const [showAdd, setShowAdd] = useState(false);

  const add = () => {
    if (!form.name.trim()) return;
    setCompanies([...companies, { ...form, id: Date.now() }]);
    setForm({ name:"", contact:"", phone:"", email:"" });
    setShowAdd(false);
  };
  const del = id => setCompanies(companies.filter(c => c.id !== id));
  const saveEdit = () => {
    setCompanies(companies.map(c => c.id === editId ? { ...c, ...editForm } : c));
    setEditId(null);
  };

  return (
    <div className="fade" style={{ display:"flex", flexDirection:"column", flex:1, minHeight:0, overflow:"hidden" }}>
      <div style={{ flexShrink:0, padding:"34px 38px 0" }}>
        <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between" }}>
          <div>
            <div style={{ fontSize:11, color:"#767676", fontWeight:700, letterSpacing:3, marginBottom:4 }}>גיליון גלובלי</div>
            <h1 style={{ fontSize:24, fontWeight:900, color:"#0D0D0D", margin:0 }}>חברות עירוניות</h1>
            <div style={{ fontSize:13, color:"#9A9A9A", marginTop:4 }}>ניהול רשימת הלקוחות — חברות עירוניות לפרויקטים</div>
          </div>
          <PrimaryButton onClick={() => setShowAdd(v => !v)}>{showAdd ? "✕ סגור" : "+ הוסף חברה עירונית"}</PrimaryButton>
        </div>
      </div>
      <div style={{ flex:1, overflowY:"auto", minHeight:0, padding:"22px 38px 34px" }}>

      {/* Add form - collapsible */}
      {showAdd && (
        <Card className="fade" style={{ marginBottom:22 }}>
          <div style={{ fontWeight:700, color:"#0D0D0D", marginBottom:14, fontSize:15 }}>הוסף חברה עירונית</div>
          <Grid>
            <TextInput label="שם החברה" value={form.name}    onChange={e=>setForm({...form,name:e.target.value})} />
            <TextInput label="איש קשר"  value={form.contact} onChange={e=>setForm({...form,contact:e.target.value})} />
            <TextInput label="טלפון"    value={form.phone}   onChange={e=>setForm({...form,phone:e.target.value})} />
            <TextInput label="אימייל"   value={form.email}   onChange={e=>setForm({...form,email:e.target.value})} />

          </Grid>
          <div style={{ marginTop:14, display:"flex", gap:10 }}>
            <PrimaryButton onClick={add}>+ הוסף חברה</PrimaryButton>
            <button onClick={() => setShowAdd(false)} style={{ background:"#F0F2F5", border:"1.5px solid #E2E5EA", borderRadius:4, padding:"8px 16px", fontSize:13, color:"#767676", cursor:"pointer", fontFamily:"'Heebo',sans-serif" }}>ביטול</button>
          </div>
        </Card>
      )}

      {/* List */}
      <Card style={{ padding:0, overflow:"hidden" }}>
        <div style={{ padding:"14px 20px", borderBottom:"1px solid #E2E5EA", fontWeight:700, color:"#0D0D0D" }}>
          רשימת חברות ({companies.length})
        </div>
        {companies.length === 0 && (
          <div style={{ padding:32, textAlign:"right", color:"#9A9A9A" }}>אין חברות עירוניות עדיין</div>
        )}
        {companies.map((c, i) => (
          <div key={c.id} style={{ borderBottom: i<companies.length-1?"1px solid #F0F2F5":"none" }}>
            {editId === c.id ? (
              <div style={{ padding:"14px 20px", background:"#F7F8FA", display:"flex", gap:10, alignItems:"flex-end", flexWrap:"wrap" }}>
                <TextInput label="שם החברה" value={editForm.name||""}    onChange={e=>setEditForm({...editForm,name:e.target.value})} />
                <TextInput label="איש קשר"  value={editForm.contact||""} onChange={e=>setEditForm({...editForm,contact:e.target.value})} />
                <TextInput label="טלפון"    value={editForm.phone||""}   onChange={e=>setEditForm({...editForm,phone:e.target.value})} />
                <TextInput label="אימייל"   value={editForm.email||""}   onChange={e=>setEditForm({...editForm,email:e.target.value})} />

                <div style={{ display:"flex", gap:8 }}>
                  <PrimaryButton onClick={saveEdit}>שמור</PrimaryButton>
                  <button onClick={()=>setEditId(null)} style={{ background:"#F0F2F5", border:"1.5px solid #E2E5EA", borderRadius:4, padding:"8px 14px", cursor:"pointer", fontFamily:"'Heebo',sans-serif", fontSize:13, color:"#767676" }}>ביטול</button>
                </div>
              </div>
            ) : (
              <div className="hov-row" style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"13px 20px" }}>
                <div style={{ display:"flex", alignItems:"center", gap:14 }}>
                  <div style={{ width:40, height:40, borderRadius:10, background:"linear-gradient(135deg,#EAF1FA,#B8CEED)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:18 }}>🏛️</div>
                  <div>
                    <div style={{ fontWeight:700, fontSize:14, color:"#0D0D0D" }}>{c.name}</div>
                    <div style={{ fontSize:12, color:"#9A9A9A", marginTop:2 }}>
                      {[c.contact, c.phone, c.email].filter(Boolean).join(" · ")}

                    </div>
                  </div>
                </div>
                <div style={{ display:"flex", gap:8 }}>
                  <button onClick={()=>{ setEditId(c.id); setEditForm({...c}); }}
                    style={{ background:"#EAF1FA", color:"#163356", border:"1.5px solid #E2E5EA", borderRadius:4, padding:"8px 12px", fontSize:13, cursor:"pointer", fontFamily:"'Heebo',sans-serif" }}>עריכה</button>
                  <DeleteButton onClick={()=>del(c.id)} />
                </div>
              </div>
            )}
          </div>
        ))}
      </Card>
      </div>
    </div>
  );
}

            <TextInput label="אימייל" value={form.email} onChange={e=>setForm({...form,email:e.target.value})} />
            <TextInput label="טלפון" value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} />
          </div>
          <div style={{ marginTop:14, display:"flex", gap:10 }}>

          <div key={m.id} style={{ borderBottom: i<managers.length-1?"1px solid #F0F2F5":"none" }}>
            {editId === m.id ? (
              <div style={{ padding:"14px 20px", background:"#F7F8FA", display:"flex", gap:10, alignItems:"flex-end", flexWrap:"wrap" }}>
                <TextInput label="שם מלא" value={editForm.name||""} onChange={e=>setEditForm({...editForm,name:e.target.value})} />
                <div style={{ display:"flex", flexDirection:"column", gap:4 }}>
                  <label style={{ fontSize:12, color:"#767676", fontWeight:600 }}>תפקיד</label>

                  <div>
